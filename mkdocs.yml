site_name: FUNWAVE-TVD
site_description: Full-dispersion, fully nonlinear Boussinesq wave model
repo_url: https://github.com/mayhl/mayhlFUNWAVE
repo_name: mayhl/FUNWAVE-TVD

theme:
  name: swan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  - docs/hooks.py

# Everything under docs_dir is copied into the site verbatim, so build inputs
# and local cruft ship unless named here -- docs/_build alone was ~7 MB of a
# stale Sphinx tree, and mike duplicates the payload for every version kept
exclude_docs: |
  .DS_Store
  __pycache__/
  _build/
  hooks.py
  doxygen-custom.css
  doxygen-footer.html
  doxygen-nav.js

plugins:
  - search
  - bibtex:
      bib_file: docs/references.bib

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  # transclusion: a walkthrough includes the REAL deck with --8<--, never a copy
  - pymdownx.snippets:
      # repo root first so a page can pull in a real deck from test/ or examples/
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - footnotes
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

# mike owns the versioned layout on the docs branch; Material reads the
# versions.json it writes and renders the selector from this provider key
extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Model:
    - Overview: model/overview.md
    - Governing Equations: model/equations.md
    - Numerics: model/numerics.md
  - User Guide:
    - Installation: guide/installation.md
    - Configuration: guide/configuration.md
    - Configuration Reference: guide/config_reference.md
    - Output: guide/output.md
  - Examples:
    - Overview: examples/index.md
    - Standing Wave:
      - Walkthrough: examples/standing_wave/index.md
      - Analysis: examples/standing_wave/analysis.md
  - Validation:
    - Overview: validation/index.md
    - Analytic: validation/analytic/index.md
    - Lab: validation/lab/index.md
  - Benchmarks:
    - Overview: benchmarks/index.md
  - API Reference: api/index.md
