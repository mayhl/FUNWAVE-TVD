groups:
  - name: Base
    tests: [test_path, test_memory, test_misc, test_units]
  - name: Infra
    tests: [test_yaml_serial, test_yaml_parallel, test_comm, test_logging, test_range_parser, test_probe]
  - name: Engine
    tests: [test_time, test_time_utils]
  - name: Numerics
    tests: [test_grid, test_interpolation, test_crs, test_accumulators, test_solver_tridiag]
  - name: Output
    tests: [test_field_registry, test_gatherer, test_output_channel]
  - name: Model2D
    tests: [test_fields, test_scratch_pool, test_geometry, test_numerics,
            test_model_setup, test_sponge, test_bc, test_wavemaker,
            test_kernel_derivatives, test_kernel_fluxes, test_kernel_masks,
            test_kernel_bc, test_kernel_dispersion, test_kernel_breaker,
            test_kernel_etauv, test_kernel_sources]
  - name: Model2D Modules
    tests: [test_subgrid, test_foam, test_tracer, test_vessel]
