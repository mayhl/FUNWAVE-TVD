# Fixture for test_model_setup — solitary IC on a flat 4-rank flume
grid:
  cell_size: [1.0, 1.0]
  grid_size: [40, 4]
  decomposition:
    nx_proc: 4
    ny_proc: 1
  bathymetry:
    type: flat
    depth: 10.0
simulation:
  title: test_model_setup
