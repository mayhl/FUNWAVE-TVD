# Reader coverage: initial: + multi-entry wavemaker: coexistence
# (one boundary-feed + one internal source; seeds derive per entry)
initial:
  solitary:
    amplitude: 0.5
    depth: 10.0
    x_center: 20.0
wavemaker:
  - name: swell
    zero_phase: yes
    spectrum:
      type: jonswap
      hm0: 0.3
      gamma: 3.3
      freq: {peak: 0.1, min: 0.05, max: 0.3}
  - spectrum:
      type: regular
      amplitude: 0.3
      period: 8.0
      direction: 0.0
    source:
      x_center: 50.0
      y_center: 0.0
      depth: 10.0
