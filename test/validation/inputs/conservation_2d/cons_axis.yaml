# Mass/energy conservation validation — closed SQUARE basin, axis-aligned mode.
# Companion to cons_diag: same closed frictionless/breaking-free/sponge-free basin,
# but the (m_x, m_y) = (5, 0) mode excites only the x-flux, so a x/y asymmetry in the
# continuity or energy bookkeeping shows up as a drift difference vs the diagonal case.
# The oracle integrates the ETA/U/V frames and checks volume + energy drift.
# L = Mglob*DX = 20 m, h = 2 m -> kh ~ 1.57.

grid:
  cell_size: [0.2, 0.2]
  n_cells: [100, 100]
  bathymetry:
    type: flat
    depth: 2.0
simulation:
  title: conservation_2d_axis
  total_time: 40.0
  screen_interval: 10.0
initial:
  sine_mode:
    amplitude: 0.01
    mode_x: 5
    mode_y: 0
numerics:
  cfl: 0.5
  froude_cap: 3.0
  min_depth: 0.01
output:
  format: ascii
  depth_out: true
  channels:
    - name: fields
      geometry: field
      variables: [u, v, eta]
      interval: 1.0
