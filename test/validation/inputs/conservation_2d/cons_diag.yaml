# Mass/energy conservation validation — closed SQUARE basin, oblique standing mode.
# A frictionless, breaking-free, sponge-free closed basin conserves total water
# volume V = integral (eta + h) dA to machine precision (flux-form continuity with
# wall BC) and total energy E = 1/2 g integral eta^2 dA + 1/2 integral H |u|^2 dA to
# within the Boussinesq dispersive-energy exchange plus numerical dissipation.  The
# oracle integrates the ETA/U/V field frames and checks the drift of both.  This
# case is the diagonal mode (m_x, m_y) = (4, 3) so both x- and y-fluxes are exercised.
# L = Mglob*DX = 20 m, h = 2 m -> kh ~ 1.57.

grid:
  cell_size: [0.2, 0.2]
  n_cells: [100, 100]
  bathymetry:
    type: flat
    depth: 2.0
simulation:
  title: conservation_2d_diag
  total_time: 40.0
  screen_interval: 10.0
initial:
  sine_mode:
    amplitude: 0.01
    mode_x: 4
    mode_y: 3
numerics:
  cfl: 0.5
  froude_cap: 3.0
  min_depth: 0.01
breaking:
  model: shock_capturing
output:
  format: ascii
  depth_out: true
  channels:
    - name: fields
      geometry: field
      variables: [u, v, eta]
      interval: 1.0
