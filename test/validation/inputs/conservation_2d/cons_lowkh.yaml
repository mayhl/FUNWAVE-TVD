# Energy conservation validation — low-kh (weakly dispersive) closed SQUARE basin.
# Shallow water h = 0.5 m with the (m_x, m_y) = (2, 0) mode gives kh ~ 0.16, so the
# model is near the non-dispersive shallow-water limit where leading-order PE+KE IS
# the conserved energy (dispersive exchange ~ (kh)^2 ~ 2.5%, averaged out by the
# multi-period window mean).  Numerical dissipation then shows as a secular energy
# change -- the gated quantity.  ~9 periods (T ~ 9 s) fit the 80 s run.  Mass is
# also checked (machine precision, as in the diag/axis cases).
# L = Mglob*DX = 20 m, h = 0.5 m, wavelength = L = 20 m.
# FUNWAVE-TVD input — converted from legacy input.txt
# Source: test/validation/inputs/conservation_2d/cons_lowkh.txt
#
# No unrecognised keys.

grid:
  cell_size: [0.2, 0.2]
  n_cells: [100, 100]
  bathymetry:
    type: flat
    depth: 0.5
simulation:
  title: conservation_2d_lowkh
  total_time: 80.0
  screen_interval: 20.0
initial:
  sine_mode:
    amplitude: 0.005
    mode_x: 2
    mode_y: 0
numerics:
  cfl: 0.5
  froude_cap: 3.0
  min_depth: 0.01
breaking:
  model: shock_capturing
output:
  format: ascii
  depth_out: true
  channels:
    - name: fields
      geometry: field
      variables: [u, v, eta]
      interval: 1.0
