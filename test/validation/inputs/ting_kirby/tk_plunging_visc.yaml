# Ting & Kirby plunging — eddy_viscosity arm; same flume/wavemaker as
# tk_plunging_shock.

grid:
  cell_size: [0.025, 0.2]
  n_cells: [1600, 3]
  bathymetry:
    type: slope
    depth: 0.4
    slope: 0.02857142857
    x0: 20.0
simulation:
  title: lab_tk_plunging_visc
  total_time: 400.0
  screen_interval: 20.0
wavemaker:
  spectrum:
    type: regular
    amplitude: 0.050
    period: 5.0
    direction: 0.0
  source:
    x_center: 16.0
    y_center: 0.3
    depth: 0.4
    delta: 0.5
    time_ramp: 5.0
boundaries:
  west:
    sponge:
      width: 12.0
      direct:
        r: 0.85
        a: 5.0
numerics:
  cfl: 0.5
  froude_cap: 10.0
  min_depth: 0.001
breaking:
  model: eddy_viscosity
  # explicit diffusion source dies mid-run on ifx (nu_break over the
  # stability bound); the split solve is unconditionally stable
  solver: split_implicit
output:
  result_folder: ./output/
  depth_out: true
  channels:
    - name: line
      geometry: gauges
      variables: [eta]
      interval: 0.05
  geometries:
    - name: gauges
      type: transect
      start: [19.435, 0.3]
      end: [30.435, 0.3]
      n_points: 221
