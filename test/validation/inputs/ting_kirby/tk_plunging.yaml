# Ting & Kirby (1994) plunging — T = 5.0 s cnoidal, H = 0.128 m over the
# h0 = 0.40 m flat, 1:35 slope.  Truth: setup + digitized heights here.
# The paddle ran Goring cnoidal signals; the cnoidal spectrum type
# generates the same wave (amplitude = H/2, no calibration factor).  The
# west sponge carries a friction strip: under the harmonic-rich cnoidal
# wave the direct sponge alone dies at t ~250 s (09-14 sponge probe).
grid:
  cell_size: [0.025, 0.2]
  n_cells: [1600, 3]
  bathymetry:
    type: slope
    depth: 0.4
    slope: 0.02857142857
    x0: 20.0
simulation:
  title: lab_tk_plunging
  total_time: 400.0
  screen_interval: 20.0
wavemaker:
  spectrum:
    type: cnoidal
    amplitude: 0.0640
    period: 5.0
    direction: 0.0
  source:
    x_center: 16.0
    y_center: 0.3
    depth: 0.4
    delta: 0.5
    time_ramp: 5.0
boundaries:
  west:
    sponge:
      width: 12.0
      direct:
        r: 0.85
        a: 5.0
      friction:
        cd: 5.0
numerics:
  cfl: 0.5
  froude_cap: 10.0
  min_depth: 0.001
output:
  result_folder: ./output/
  depth_out: true
  channels:
    - name: line
      geometry: gauges
      variables: [eta]
      interval: 0.05
    - name: breaker  # end-of-run snapshot: the oracle reads the class at the breakpoint
      geometry: field
      variables: [xi_0, xi_b, gamma_b, front_steepness]
      interval: 1.0e6
    - name: brk_events  # end-of-run event counts: one breaking event per wave per cell
      geometry: field
      variables: [breaking_active]
      statistics: [count, duration]
      threshold: {above: 0.5}
      gap: 0.2  # 0.1 T: merges the step-scale flicker of the flag (4 fragments per passage unfiltered)
      log: true  # one row per breaking event: onset, duration, peak, cell
      accumulate: total
      interval: 1.0e6
    - name: crest_events  # the unfiltered reference: one crest per wave per wet cell
      geometry: field
      variables: [eta]
      statistics: [count]
      threshold: {above: 0.0}
      accumulate: total
      interval: 1.0e6
  geometries:
    - name: gauges
      type: transect
      start: [19.435, 0.3]
      end: [30.435, 0.3]
      n_points: 221
