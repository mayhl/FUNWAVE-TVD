# Ting & Kirby (1994) spilling — T = 2.0 s cnoidal, H = 0.125 m over the
# h0 = 0.40 m flat, 1:35 slope.  Truth: setup + digitized heights here.
# The lab paddle ran Goring cnoidal signals; a sinusoid stands in,
# amplitude 0.0485 = 0.78 x H/2 calibrated at the reference gauge.

grid:
  cell_size: [0.025, 0.2]
  n_cells: [1600, 3]
  bathymetry:
    type: slope
    depth: 0.4
    slope: 0.02857142857
    x0: 20.0
simulation:
  title: lab_tk_spilling
  total_time: 300.0
  screen_interval: 20.0
wavemaker:
  spectrum:
    type: regular
    amplitude: 0.0485
    period: 2.0
    direction: 0.0
  source:
    x_center: 14.0
    y_center: 0.3
    depth: 0.4
    delta: 0.5
    time_ramp: 2.0
boundaries:
  west:
    sponge:
      width: 12.0
      direct:
        r: 0.85
        a: 5.0
numerics:
  cfl: 0.5
  froude_cap: 10.0
  min_depth: 0.001
output:
  result_folder: ./output/
  depth_out: true
  channels:
    - name: line
      geometry: gauges
      variables: [eta]
      interval: 0.05
  geometries:
    - name: gauges
      type: transect
      start: [19.435, 0.3]
      end: [30.435, 0.3]
      n_points: 221
