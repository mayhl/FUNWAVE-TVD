# Spatially-varying boundary-feed wavemaker (case B: non-periodic).  Identical
# to data2d_varying.yaml but WITHOUT periodic-y, so the N/S faces default to
# solid walls and there is NO wrap seam.  With theta = 0 the primary wave carries
# no alongshore propagation, so a wall reflects only the weak gradient-driven
# alongshore flow; the full Hm0 profile — anchors included — is clean, and the
# station line spans the whole gradient y = [40, 280].  Contrast case A, whose
# periodic seam forced the gauges into the interior.
grid:
  cell_size: [1.0, 4.0]
  n_cells: [500, 80]
  bathymetry: {type: flat, depth: 10.0}
simulation: {title: wm_boundary_varying_nonper, total_time: 340.0, screen_interval: 100.0}
wavemaker:
  name: westfeed
  seed: 66
  spectrum: {type: spectrum_2d, locations: data/locations.txt}
boundaries:
  west:
    forcing: {wavemaker: westfeed, depth: 10.0}
    sponge: {width: 80.0, direct: {r: 0.85, a: 5.0}}
  east:
    sponge: {width: 160.0, direct: {r: 0.85, a: 5.0}, friction: {cd: 1.0}}
numerics: {cfl: 0.5, froude_cap: 1.0, min_depth: 0.01}
breaking: {model: shock_capturing, Cbrk1: 0.65, Cbrk2: 0.35}
output:
  channels:
    - name: sta
      type: station
      x: [285.0, 285.0, 285.0, 285.0, 285.0]
      y: [40.0, 100.0, 160.0, 220.0, 280.0]
      variables: [eta]
      interval: 0.1
