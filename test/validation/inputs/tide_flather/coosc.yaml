# Flather co-oscillation: a slow tide (T=300s >> 45s basin transit) forced as
# eta on BOTH open faces.  A faithful radiation boundary imposes it with no strip
# attenuation, so the interior tracks the full tidal range (ratio ~1.0).  The
# relaxation strip gives ~0.4 here; this is the tide use case Flather fixes.
grid: {cell_size: [2.0, 2.0], n_cells: [200, 3], bathymetry: {type: flat, depth: 8.0}}
simulation: {title: tide_flather_coosc, total_time: 900.0, screen_interval: 300.0}
boundaries:
  west: {forcing: {file: data/tide_eta.txt}}
  east: {forcing: {file: data/tide_eta.txt}}
  periodic: [y]
numerics: {cfl: 0.5, froude_cap: 3.0, min_depth: 0.01}
breaking: {model: shock_capturing}
output:
  format: ascii
  depth_out: true
  channels:
    - {name: fields, geometry: field, variables: [eta], interval: 10.0}
