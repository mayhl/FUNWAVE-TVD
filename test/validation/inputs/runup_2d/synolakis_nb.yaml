# Solitary-wave runup — Synolakis (1987) nonbreaking canonical case.
# H/h = 0.019 solitary wave over a flat section onto the cot(beta) = 19.85
# plane beach; the maximum vertical runup obeys the analytic runup law
#   R/h = 2.831 sqrt(cot beta) (H/h)^{5/4}   ->   R/h = 0.0889
# (nonbreaking: H/h below the 0.8183 (cot beta)^{-10/9} ~ 0.030 threshold).
# The oracle tracks the wet/dry front through the MASK frames and gates the
# peak ground elevation ever wetted against the law.  Still-water shoreline
# sits at x = 79.85 m; the dry beach extends to +0.41 m for headroom.
grid:
  cell_size: [0.1, 0.1]
  grid_size: [880, 4]
  bathymetry:
    type: slope
    depth: 1.0
    slope: 0.0503778
    x0: 60.0
simulation:
  title: synolakis_nb
  total_time: 40.0
  screen_interval: 10.0
initial:
  solitary:
    amplitude: 0.019
    depth: 1.0
    x_center: 30.0
numerics:
  cfl: 0.5
  min_depth: 0.001
output:
  result_folder: ./output/
  interval: 0.2
  depth_out: yes
  variables: [ETA, MASK]
