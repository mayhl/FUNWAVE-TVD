# Periodic-wave runup — Carrier-Greenspan/Keller amplification on a plane beach.
# A monochromatic T = 10 s wave (kh ~ 0.2, weakly dispersive) is generated by an
# internal Wei-Kirby source over the h = 1 m flat and shoals onto the 1/15 plane
# slope (toe x = 75 m, still-water shoreline x = 90 m); the west sponge absorbs
# the re-reflected wave behind the source.  For nonbreaking waves the maximum
# vertical runup equals the LINEAR amplification of the incident amplitude
# (Carrier & Greenspan 1958); at these parameters the amplification is ~6.36 so
# R ~ 0.04 m and the CG breaking parameter R w^2 / (g beta^2) ~ 0.39 < 1 stays
# safely in the surging regime.  The steady incident amplitude runs ~1.35x the
# deck value — NOT source miscalibration (pre-reflection A+ matches the nominal
# to ~1 %) but cavity pumping: the beach returns ~0.9 of the incident and the
# 20 m sponge reflects ~30 % at this wavelength (0.64 lambda), so the
# source-beach-sponge cavity multiplies up; the oracle measures the incident
# wave, so the deck value only sets scale.  The oracle integrates the linear SWE over the ACTUAL
# dep.out profile (no Bessel-convention risk), measures the incident amplitude
# by lock-in demodulation at the forcing frequency on the flat, and gates the
# steady shoreline oscillation peak against the predicted linear runup.
grid:
  cell_size: [0.05, 0.05]
  grid_size: [1860, 4]
  bathymetry:
    type: slope
    depth: 1.0
    slope: 0.0666667
    x0: 75.0
simulation:
  title: cg_periodic
  total_time: 120.0
  screen_interval: 25.0
wavemaker:
  spectrum:
    type: regular
    amplitude: 0.005
    period: 10.0
    direction: 0.0
  source:
    x_center: 40.0
    y_center: 0.0
    depth: 1.0
    time_ramp: 2.0
boundaries:
  west:
    sponge:
      width: 20.0
      direct:
        r: 0.85
        a: 5.0
      friction:
        cd: 1.0
numerics:
  cfl: 0.5
  min_depth: 0.001
output:
  result_folder: ./output/
  interval: 0.25
  depth_out: yes
  variables: [ETA, MASK]
