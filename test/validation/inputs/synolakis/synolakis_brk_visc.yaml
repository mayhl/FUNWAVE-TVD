# Breaking runup on the eddy_viscosity path — the wetdry_disp_ramp
# acceptance probe; ramp 0 blows up at t = 10.28 (wet/dry dispersion
# ringing).  Otherwise identical to synolakis_brk.yaml.

grid:
  cell_size: [0.05, 0.05]
  n_cells: [1500, 3]
  bathymetry:
    type: slope
    depth: 1.0
    slope: 0.0503778
    x0: 40.15
simulation:
  title: lab_synolakis_brk_visc
  total_time: 10.5
  screen_interval: 5.0
initial:
  solitary:
    amplitude: 0.30
    depth: 1.0
    x_center: 34.784
numerics:
  cfl: 0.5
  froude_cap: 5.0
  min_depth: 0.001
breaking:
  model: eddy_viscosity
  wetdry_disp_ramp: 3.0
output:
  result_folder: ./output/
  depth_out: true
  channels:
    - name: fields
      geometry: field
      variables: [eta]
      interval: 0.05
