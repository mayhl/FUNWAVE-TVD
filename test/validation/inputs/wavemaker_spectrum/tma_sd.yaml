# Wavemaker spectrum self-consistency — TMA, single_dir_per_freq discretizer.
# Same rig as tma_grid.  One direction per frequency line drawn at equal
# spreading mass (the f0a8375 comb fix): every ladder line keeps its full
# S(f) df energy, so the exact-T_rec line-completeness metric regresses the
# pre-fix periodic dead-line comb (legacy ntheta-cyclic ladder weighted
# amplitudes by G(theta) -> tail slots carried no energy, ~14% dead lines).
grid:
  cell_size: [1.0, 2.0]
  n_cells: [500, 80]
  bathymetry:
    type: flat
    depth: 10.0
simulation:
  title: wm_tma_sd
  total_time: 340.0
  screen_interval: 100.0
wavemaker:
  seed: 66
  spectrum:
    type: tma
    hm0: 1.0
    gamma: 3.3
    freq:
      peak: 0.12
      min: 0.08
      max: 0.28
    directional:
      peak: 0.0
      spread: 20.0
    discretization:
      freq_bins: 41
      theta_bins: 24
      method: single_dir_per_freq
  source:
    x_center: 145.0
    y_center: 80.0
    depth: 10.0
boundaries:
  west:
    sponge:
      width: 80.0
      direct:
        r: 0.85
        a: 5.0
      friction:
        cd: 1.0
  east:
    sponge:
      width: 160.0
      direct:
        r: 0.85
        a: 5.0
      friction:
        cd: 1.0
  periodic: [y]
numerics:
  cfl: 0.5
  froude_cap: 1.0
  min_depth: 0.01
breaking:
  model: shock_capturing
  Cbrk1: 0.65
  Cbrk2: 0.35
output:
  channels:
    - name: sta
      type: station
      x: [265.0, 275.0, 285.0, 295.0, 305.0, 285.0, 285.0]
      y: [80.0, 80.0, 80.0, 80.0, 80.0, 40.0, 120.0]
      variables: [eta]
      interval: 0.1
