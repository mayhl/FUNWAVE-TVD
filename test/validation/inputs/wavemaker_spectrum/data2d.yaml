# Wavemaker spectrum self-consistency — spectrum_2d (WK_DATA2D) file table.
# Same rig as tma_grid.  The committed fixture data/wk2d_flat.txt is a
# flat-amplitude 41 x 7 (freq x dir) table on the shared 0.08-0.28 Hz
# equal-df ladder (T_rec = 200 s), dirs -30..30 deg (inside the engine's
# |dir| < 60 filter), amplitudes sized so 4 sqrt(sum(a^2)/2) = 1.0 m exactly
# — the analytic Hm0 target.  A flat table has no spectral peak, so the
# oracle skips the peak-location gate here (schema-driven: no tma/jonswap
# freq: block to gate against).  Provenance: gen_wk2d_flat.py alongside this
# deck regenerates the fixture bit-identically.
grid:
  cell_size: [1.0, 2.0]
  n_cells: [500, 80]
  bathymetry:
    type: flat
    depth: 10.0
simulation:
  title: wm_data2d
  total_time: 340.0
  screen_interval: 100.0
wavemaker:
  seed: 66
  spectrum:
    type: spectrum_2d
    file: data/wk2d_flat.txt
  source:
    x_center: 145.0
    y_center: 80.0
    depth: 10.0
boundaries:
  west:
    sponge:
      width: 80.0
      direct:
        r: 0.85
        a: 5.0
      friction:
        cd: 1.0
  east:
    sponge:
      width: 160.0
      direct:
        r: 0.85
        a: 5.0
      friction:
        cd: 1.0
  periodic: [y]
numerics:
  cfl: 0.5
  froude_cap: 1.0
  min_depth: 0.01
output:
  channels:
    - name: sta
      type: station
      x: [265.0, 275.0, 285.0, 295.0, 305.0, 285.0, 285.0]
      y: [80.0, 80.0, 80.0, 80.0, 80.0, 40.0, 120.0]
      variables: [eta]
      interval: 0.1
