# Linear dispersion: the fundamental seiche of a closed flat basin, 20 m long,
# so k = pi/L and kh follows from the depth alone.  Small amplitude keeps it
# linear; no friction, breaking or sponge, so dispersion alone sets the period.
# This deck: depth 12.0 m, kh = 1.88.

grid:
  cell_size: [0.2, 0.2]
  n_cells: [100, 3]
  bathymetry:
    type: flat
    depth: 12.0
simulation:
  title: dispersion_2d_khc
  total_time: 50.0
  screen_interval: 10.0
initial:
  sine_mode:
    amplitude: 0.01
numerics:
  cfl: 0.5
  froude_cap: 3.0
  min_depth: 0.01
breaking:
  model: shock_capturing
output:
  format: ascii
  channels:
    - name: fields
      geometry: field
      variables: [eta]
      interval: 50.0
    - name: sta
      type: station
      x: [0.8]
      y: [0.2]
      variables: [eta, u, v]
      interval: 0.05
  depth_out: true
