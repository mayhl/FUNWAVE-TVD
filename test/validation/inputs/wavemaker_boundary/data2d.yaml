# Boundary-feed wavemaker: a spectrum-only entry (NO source: block) fed at the
# west face via boundaries.west.forcing.wavemaker.  Mirrors wavemaker_spectrum/
# data2d.yaml (same flat 41x7 table, Hm0 target 1.0 m) but generates at the
# boundary instead of the internal Wei-Kirby source box.  The west sponge is the
# ABS relaxation strip (forcing.wavemaker requires sponge.direct); forcing.depth
# is the series reference depth.  Oracle recovers Hm0 vs the 1.0 m target as the
# mean over an alongshore station column at x = 285 (20 gauges, one 160 m
# period): the periodic box snaps the ladder onto alongshore modes, so a single
# y line reads a standing pattern (y = 80 is the m = 1 antinode, ~1.15x).
grid:
  cell_size: [1.0, 2.0]
  n_cells: [500, 80]
  bathymetry: {type: flat, depth: 10.0}
simulation: {title: wm_boundary_data2d, total_time: 340.0, screen_interval: 100.0}
wavemaker:
  name: westfeed
  seed: 66
  spectrum: {type: spectrum_2d, file: data/wk2d_flat.txt}
boundaries:
  west:
    forcing: {wavemaker: westfeed, depth: 10.0}
    sponge: {width: 80.0, direct: {r: 0.85, a: 5.0}}
  east:
    sponge: {width: 160.0, direct: {r: 0.85, a: 5.0}, friction: {cd: 1.0}}
  periodic: [y]
numerics: {cfl: 0.5, froude_cap: 1.0, min_depth: 0.01}
output:
  channels:
    - name: sta
      type: station
      x: [285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0, 285.0]
      y: [4.0, 12.0, 20.0, 28.0, 36.0, 44.0, 52.0, 60.0, 68.0, 76.0, 84.0, 92.0, 100.0, 108.0, 116.0, 124.0, 132.0, 140.0, 148.0, 156.0]
      variables: [eta]
      interval: 0.1
