# Wind setup: a closed rectangular basin (all walls) under a steady uniform +x
# wind reaches a static balance tau = rho g h d(eta)/dx.  The wind ramps on over
# ~2 seiche periods to suppress the onset seiche; the oracle time-averages the
# fitted slope over the settled window and gates it against the analytic
# d(eta)/dx = (rho_a/rho) Cd_w W^2 / (g h).  Fully wet (setup << depth) so the
# unmasked-wind-on-dry-cells path is not exercised.  L = 4 km, h = 5 m, W = 40 m/s.
grid: {cell_size: [20.0, 20.0], n_cells: [200, 5], bathymetry: {type: flat, depth: 5.0}}
simulation: {title: wind_setup, total_time: 6000.0, screen_interval: 2000.0}
meteo:
  wind: {file: data/wind_ramp.txt, cd: 0.002}
friction: {cd: 0.05}
numerics: {cfl: 0.5, froude_cap: 3.0, min_depth: 0.01}
output:
  format: ascii
  depth_out: true
  channels:
    - {name: fields, geometry: field, variables: [eta], interval: 200.0}
