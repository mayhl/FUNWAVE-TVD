  - name: study_tk_gap_tma_dx2
    <<: *tk_spilling
    tags: [study, tkgap, tkgapfast]
    overrides: { wavemaker.spectrum: { type: tma, hm0: 0.125, gamma: 3.3, freq: { peak: 0.5, min: 0.25, max: 1.5 }, discretization: { freq_bins: 45 } }, grid.cell_size: [0.05, 0.2], grid.n_cells: [800, 3] }
    variants:
