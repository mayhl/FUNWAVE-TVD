    variants:
      viscous: { overrides: { breaking.model: eddy_viscosity } }
    sweep:
      output.channels.2.gap: [5, 10, 20]
  # Steep-beach arm, report-only (tags study, tksteep): the same wave on 1:5
  # and 1:2.5 (xi_0 1.4 and 2.8) to exercise the oracle's non-breaking path --
  # no dissipation event, class from the beach-face xi_0.  The height and
  # setup gates fail by construction here (measured on the 1:35 beach).
  - name: study_tk_steep
    <<: *tk_spilling
    tags: [study, tksteep]
    variants:
      viscous: { overrides: { breaking.model: eddy_viscosity } }
    sweep:
      grid.bathymetry.slope: [0.2, 0.4]


  # ── Wavemaker fidelity: the h470 incident gauge as its own gated case ───
  # anchors: nrmse 8.6 over the 60-700 s window
  - name: lab_mase_wavemaker
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/mase_kirby
    input_files: [mase_kirby_run2.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, gauges, wavemaker, 1d]
    postprocess:
      gauges: test.validation.oracles.gauges
    tolerances:
      gauges:
        file: gauges.txt
        gauges: [h470]
        align: none
        channel: gauges
        window_s: [60.0, 700.0]
        gauge_nrmse_pct: 12.0

  # ── Mase & Kirby 1992 run 2: random-wave gauge ladder, statistics gates ─
  # anchors: sigma_rmse 6.7, skew 24.0, asym 12.0; Shi 2012 = 5.4/6.6/12.1
  - name: lab_mase_kirby
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/mase_kirby
    input_files: [mase_kirby_run2.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, gauges, 1d]
    postprocess:
      gauges: test.validation.oracles.gauges
    tolerances:
      gauges:
        file: gauges.txt
        gauges: [h470, h350, h300, h250, h200, h175, h150, h125, h100, h075, h050, h025]
        align: none
        channel: gauges
        window_s: [60.0, 700.0]
        mode: heights
        stat_exclude: [h470]
        height_error_pct: 25.0
        sigma_error_pct: 20.0
        sigma_rmse_pct: 8.5
        skew_rmse_pct: 30.0
        asym_rmse_pct: 15.0
    # both closures: the viscous arm sharpens skewness (24 -> 12 %) and loosens
    # the height variance (16 -> 24 %); its sigma bound follows the 09-11 board
    variants:
      shock: { overrides: { breaking.model: shock_capturing } }
      viscous: { overrides: { breaking.model: eddy_viscosity }, tolerances: { gauges: { sigma_error_pct: 25.0 } } }

  # ── Kobayashi & Lawrence 2004: bed change under a breaking solitary wave ─
  # Wave 1 of the Fig 4.5 growth curves; CACR-16-02's own model matched emax
  # and ran dmax ~half of measured, so the deposition gate stays inherited-loose.
  # min_depth_pickup 0.03 is the calibrated pickup cutoff (see the study below).
# Viscous breaker only: sediment is refused under shock_capturing
  - name: lab_kl_erosion
    <<: &kl_erosion
      exe_type: validation-2d
      np_pin: 4
      input: test/validation/inputs/kobayashi_lawrence
      input_files: [kl_erosion.yaml]
      binary: funwave
      output_dir: output
      tags: [lab, sediment, 1d]
      postprocess:
        morphology: test.validation.oracles.morphology
      tolerances:
        morphology:
          growth: erosion_growth.txt
          h0: 0.216
          wave: 1
          emax_rel_err_pct: 60.0
          dmax_rel_err_pct: 75.0

  # Sensitivity study, report-only (tag study, never on a board): the erosion
  # excess vs cell size and the two pickup knobs.  Reads through the results
  # record; no gate.
  - name: study_kl_sediment
    <<: *kl_erosion
    tags: [study]
    variants:
      dx_0p10: { overrides: { grid.cell_size: [0.10, 0.10], grid.n_cells: [400, 3] } }
      dx_0p05: {}
      dx_0p025: { overrides: { grid.cell_size: [0.025, 0.025], grid.n_cells: [1600, 3] } }
    sweep:
      sediment.min_depth_pickup: [0.01, 0.02, 0.03, 0.05, 0.07, 0.10]
      sediment.shields_cr: [0.045, 0.065]

  # ── Yoshii et al. 2017/2018: TSTLE case C2, NTHMP sediment benchmark 3 ──
  # Fixed-bed channel = the hydrodynamic gate; the measured x = 0.5 m eta/u
  # series drives the west face (Flather).  Gate: worst gauge 22 % at first
  # light (09-15), the shallow last station.
  - name: lab_yoshii_c2_fixed
    <<: &yoshii_c2
      exe_type: validation-2d
      np: 2
      input: test/validation/inputs/yoshii_tanaka
      input_files: [c2_fixed.yaml]
      binary: funwave
      output_dir: output
      tags: [lab, sediment, gauges, 1d]
      postprocess:
        gauges: test.validation.oracles.gauges
      tolerances:
        gauges:
          file: gauges_c2.txt
          variable: h
          align: none
          channel: gauges
          window_s: [20.0, 130.0]
          gauge_nrmse_pct: 30.0

  # Stability study, report-only (tag study + c2): the pond drains over the
  # dune crest as a 1-2 cm supercritical film at the wet/dry floor; floor x
  # cap, viscous throughout (09-15: cap 2 at the 1 cm floor is the survivor,
  # cap 3 blows up at t = 122 s, floors of 2 cm and more lose the last gauge).
  - name: study_c2_stability
    <<: *yoshii_c2
    tags: [study, c2]
    sweep:
      numerics.min_depth: [0.01, 0.02, 0.03]
      numerics.froude_cap: [2.0, 3.0]

  # Movable-bed channel = the morphology gate over the dune reach (30-50 m):
  # profile NRMSE + the erosion trough as PP16 gates.  At the legacy dx 0.06
  # (09-15): NRMSE 9, trough 0.27 m, gauges 41 -- the gauge file is the
  # FIXED-bed record, so the better the dune erodes the further the stations
  # just landward of it drift from it; that gate is a soft check, kept loose.
  - name: lab_yoshii_c2_movable
    <<: &yoshii_c2_movable
      exe_type: validation-2d
      np: 2
      input: test/validation/inputs/yoshii_tanaka
      input_files: [c2_movable.yaml]
      binary: funwave
      output_dir: output
      tags: [lab, sediment, 1d]
      postprocess:
        morphology: test.validation.oracles.morphology
        gauges: test.validation.oracles.gauges
      tolerances:
        morphology:
          bedchange: bedchange_c2.txt
          gate_x: -0.5
          bedchange_nrmse_pct: 45.0
          trough_offset_m: 1.0
        gauges:
          file: gauges_c2.txt
          variable: h
          align: none
          channel: gauges
          window_s: [20.0, 130.0]
          gauge_nrmse_pct: 50.0

  # Runaway study, report-only (tag study + c2sed): every cutoff from 1 to
  # 5 cm blows up at t 95-108 s (09-15) once the drainage film digs the
  # seaward dune face past 0.7 m -- the scour runaway; which closure holds it.
  - name: study_c2_runaway
    <<: *yoshii_c2_movable
    tags: [study, c2sed]
    variants:
      avalanche: { overrides: { sediment.avalanche.tan_phi: 0.5 } }
      avalanche_nobedload: { overrides: { sediment.avalanche.tan_phi: 0.5, sediment.bedload: false } }
      nobedload: { overrides: { sediment.bedload: false } }
      avalanche_climiter: { overrides: { sediment.avalanche.tan_phi: 0.5, sediment.c_limiter: 0.3 } }
      pickup_0p05_avalanche: { overrides: { sediment.avalanche.tan_phi: 0.5, sediment.min_depth_pickup: 0.05 } }

  # Taper study, report-only (tag study + c2grid): the dx 0.06 + 2 m taper
  # deck lost the dune-reach gauges (g42-46 at 33-41 %) that the dx 0.04
  # untapered deck held at 28.  Verdict 09-15: 41 % at every length from 0
  # to 8 m, so the grid did it, not the taper; ramp 2 m stays.
  - name: study_c2_grid
    <<: *yoshii_c2_movable
    tags: [study, c2grid]
    sweep:
      boundaries.west.forcing.disp_ramp: [0.0, 1.0, 4.0, 8.0]

  # Crest study, report-only (tag study + c2crest): the dune-crest calibration
  # Malone did by hand -- the critical Shields number against the pickup
  # cutoff, each grid point once with the flow feedback off (the deck) and
  # once with the three feedback terms on (Malone's BSS 0.65 -> 0.83).  Read
  # on the dune reach 39-44 m from each run's bed change, not the 30-50 gate.
  # Verdict 09-15: flat -- reach NRMSE 13-18 % at every point, the crest
  # within 2 cm of the measured -0.19 m except pickup 0.04 at theta 0.055
  # (half the crest survives, Malone's knife-edge); the feedback terms move
  # the full profile half a point and the reach not at all.  Deck unchanged.
  - name: study_c2_crest
    <<: *yoshii_c2_movable
    tags: [study, c2crest]
    sweep:
      sediment.shields_cr: [0.045, 0.05, 0.055]
      sediment.min_depth_pickup: [0.02, 0.03, 0.04]
    variants:
      nofb: { overrides: {} }
      feedback:
        overrides:
          sediment.feedback.mass_source: true
          sediment.feedback.moment_dc: true
          sediment.feedback.moment_exg: true

  # ── Yoshii et al. 2018: TSTLE case C7, the 1/100 land-slope bore ──
  # Same flume, dune and forcing path as C2; the land flattens to 1/100
  # past x = 45 and the survey reaches 87.4 m.  The sustained bore outflow
  # through the Flather face grew a two-cell dispersive mode there (09-15,
  # every ghost fill and strip made it worse); the 2 m dispersion taper on
  # the face (forcing.disp_ramp) is what carries it.  Gate: worst gauge 29 %
  # at the dx 0.06 first light, the x = 70 station.
  - name: lab_yoshii_c7_fixed
    <<: &yoshii_c7
      exe_type: validation-2d
      np: 2
      input: test/validation/inputs/yoshii_tanaka
      input_files: [c7_fixed.yaml]
      binary: funwave
      output_dir: output
      tags: [lab, sediment, gauges, 1d]
      postprocess:
        gauges: test.validation.oracles.gauges
      tolerances:
        gauges:
          file: gauges_c7.txt
          variable: h
          align: none
          channel: gauges
          window_s: [20.0, 130.0]
          gauge_nrmse_pct: 40.0

  # Movable bed over the 30-62 m reach: the dune is removed entirely in the
  # lab (crest -0.20, a 0.07 m scour at 41.3) and the deposit runs down the
  # 1/100 slope.  Malone's cutoff knife-edge (0.04) lives on this flume.
  # First light 09-15 (dx 0.06, taper 2 m): NRMSE 9, trough 0.18 m, gauges 31.
  - name: lab_yoshii_c7_movable
    <<: &yoshii_c7_movable
      exe_type: validation-2d
      np: 2
      input: test/validation/inputs/yoshii_tanaka
      input_files: [c7_movable.yaml]
      binary: funwave
      output_dir: output
      tags: [lab, sediment, 1d]
      postprocess:
        morphology: test.validation.oracles.morphology
        gauges: test.validation.oracles.gauges
      tolerances:
        morphology:
          bedchange: bedchange_c7.txt
          gate_x: -0.5
          bedchange_nrmse_pct: 30.0
          trough_offset_m: 1.0
        gauges:
          file: gauges_c7.txt
          variable: h
          align: none
          channel: gauges
          window_s: [20.0, 130.0]
          gauge_nrmse_pct: 45.0

  # Cutoff study, report-only (tag study + c7sed): Malone's knife-edge
  # (0.04 best, 0.0375 and 0.0425 much worse) on our closure pair.
  - name: study_c7_pickup
    <<: *yoshii_c7_movable
    tags: [study, c7sed]
    sweep:
      sediment.min_depth_pickup: [0.02, 0.03, 0.04, 0.05]

  # ── Pintado-Patino et al. 2016: dam-break swash over an erodible beach ──
  # Runs to 8.5 s — the paper's own comparison regime (before the reflected
  # bore, which the experiment's second gate blocked, reaches the beach).
  # Gates: profile NRMSE + the erosion-trough location; the deposition peak
  # reports ungated (measured settles fully, the model's suspended load is
  # still aloft — CACR-16-02 p.69).  Viscous breaker with swe_gate on: the
  # front is a bore, and sediment is refused under shock_capturing.
  - name: lab_pp_dambreak
    exe_type: validation-2d
    np_pin: 2
    input: test/validation/inputs/pintado_patino
    input_files: [pp_dambreak.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, sediment, 1d]
    postprocess:
      morphology: test.validation.oracles.morphology
    tolerances:
      morphology:
        bedchange: bedchange_10s.txt
        gate_x: 1.0
        bedchange_nrmse_pct: 60.0
        trough_offset_m: 0.3

  # ── Still-water level: grid.water_level on a flat, unforced basin ──
  # The level bakes into the depth datum (depth = d + W) and the surface stays
  # quiescent (eta referenced to the level).  Gates the datum shift and the
  # residual surface excursion.  The (d, W) vs (d + W, 0) bit-identical
  # cross-check (which also exercises the wavemaker DEP_WK shift) is reported
  # in the forcing-validation task writeup, not gated here (a single-deck
  # oracle cannot compare two runs).
  - name: wl_still
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/water_level
    input_files: [wl_still.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, water_level, forcing]
    postprocess:
      still_water: test.validation.oracles.still_water
    tolerances:
      # measured: max|eta| 0 (exact since the flat-state reconstruction guard), datum_err 0
      still_water: { max_eta_m: 1.0e-3, depth_datum_err_m: 1.0e-6 }

  # ── Flather open boundary (characteristic BC track): tide transmission ──
  # forcing: without sponge.direct derives a Flather radiation face — imposes
  # the target through the boundary-normal flux and radiates outgoing energy,
  # unlike the relaxation strip (which attenuates to 0.2-0.4).  Slow tide
  # (T=300s >> 45s basin transit) so the interior co-oscillates.  The three
  # progressive arms expose the Riemann-invariant structure: the full (eta,u)
  # invariant transmits fully, either half transmits at ~0.5.
  - name: tide_flather_coosc
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/tide_flather
    input_files: [coosc.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, tide, flather, forcing]
    postprocess:
      flather_transmission: test.validation.oracles.flather_transmission
    tolerances:
      # measured 1.009 (relaxation strip: 0.40)
      flather_transmission: { ratio_min: 0.9, ratio_max: 1.1 }

  - name: tide_flather_prog_etauv
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/tide_flather
    input_files: [prog_etauv.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, tide, flather, forcing]
    postprocess:
      flather_transmission: test.validation.oracles.flather_transmission
    tolerances:
      # full incident R+ = u + sqrt(g/h) eta -> measured 1.003
      flather_transmission: { ratio_min: 0.9, ratio_max: 1.1 }

  # np_sweep is the rank-invariance gate on the Flather face.  ny = 3 forces
  # the np=4 variant to decompose in x (PX=4, seams at i = 50/100/150), which
  # is the axis that carries the face: flux_flather_bc applies at the RANK-
  # local lp%ib/lp%ie, so an unmasked face flag makes every interior rank
  # impose the open BC at its own subdomain edge.  That regression measured
  # 0.18 m of eta at the seams and a ratio spread of 0.0038; masked by rank
  # ownership the two decompositions are bitwise (spread 0.0000), so the
  # 0.001 window sits between the two.
  - name: tide_flather_prog_eta
    exe_type: validation-2d
    np_sweep: [1, 4]
    input: test/validation/inputs/tide_flather
    input_files: [prog_eta.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, tide, flather, forcing, sweep]
    postprocess:
      flather_transmission: test.validation.oracles.flather_transmission
    tolerances:
      # eta only = half the Riemann invariant -> measured 0.502
      flather_transmission: { ratio_min: 0.45, ratio_max: 0.55 }
    sweep_tolerances: { ratio: 0.001 }

  - name: tide_flather_prog_uvonly
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/tide_flather
    input_files: [prog_uvonly.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, tide, flather, forcing]
    postprocess:
      flather_transmission: test.validation.oracles.flather_transmission
    tolerances:
      # u/v only = half the invariant; eta column is zero so reference the
      # 1.0 m incident range explicitly -> measured 0.502
      flather_transmission: { ratio_min: 0.45, ratio_max: 0.55, reference_pp_m: 1.0 }

  # ── Wind setup: meteo.wind steady-state balance ──
  # Closed basin, steady uniform wind ramped on over ~2 seiche periods; the
  # oracle time-averages the fitted surface slope and gates it against the
  # analytic d(eta)/dx = (rho_a/rho) Cd_w W^2 / (g h).  Flux-form stress, no
  # 1/h, so it is bounded as h -> 0.
  - name: wind_setup
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/wind_setup
    input_files: [wind_setup.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, meteo, wind, forcing]
    postprocess:
      wind_setup: test.validation.oracles.wind_setup
    tolerances:
      # analytic slope 7.86e-5; time-mean ratio 1.005 over the settled window
      wind_setup: { ratio_min: 0.9, ratio_max: 1.1 }

  # ── Boundary-feed wavemaker: spectrum-only entry fed at the west face ──
  # Mirrors wm_data2d but generates at the boundary (no source: box).
  # Transmits at ~1.0x the table, matching the internal source, after the
  # directional-phase-coherence fix (wavemaker.f90): the boundary path
  # previously collapsed all of a frequency's directions onto one phase
  # (legacy Phase_LEFT(:,1)), so periodic-y direction snapping added them
  # coherently and piled up energy (old measured 1.987 m ~ 2x).  Read on an
  # alongshore station column (09-15): the periodic box snaps the ladder onto
  # alongshore modes, and the y = 80 x-line the rig decks use sits on the
  # m = 1 antinode (1.144 there, ~27 % spread down the column).
  - name: wm_boundary_data2d
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/wavemaker_boundary
    input_files: [data2d.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, forcing]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # column-mean Hm0 1.029 (err 2.9 %) at np 4, board 09-15
      wavemaker_spectrum: { hm0_err_pct: 10.0, band_frac_pct: 95.0, dead_line_pct: 5.0 }

  # ── Boundary-feed wavemaker on a FLATHER face (no west sponge) ──
  # Same feed as wm_boundary_data2d but the incident series rides the
  # boundary-normal flux as the Flather external target instead of relaxing
  # through a strip (wavemaker-Flather stage 2).  Transmits at ~1.04x on the
  # alongshore column, a point above the strip and the internal source; the
  # dispersive Flather mismatch (this spectrum spans kh~0.7-3; the fed
  # u_ext != cf*eta_ext radiates a sliver back) is inside that -- compose
  # with an interior absorber for a strongly dispersive boundary sea.
  - name: wm_boundary_flather
    exe_type: validation-2d
    np_sweep: [1, 4]
    input: test/validation/inputs/wavemaker_boundary
    input_files: [data2d_flather.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, flather, forcing, sweep]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # column-mean Hm0 1.040 (err 4.0 %) at np 1 and 4, board 09-15.  The
      # y = 80 x-line read 1.154 on every commit since the case landed; the
      # 0.979 once quoted here was read at np 4 BEFORE the 09-04
      # rank-ownership fix, when an interior rank injected the feed at its
      # own edge 15 m upwave of the stations (bisected 09-15).
      wavemaker_spectrum: { hm0_err_pct: 10.0, band_frac_pct: 95.0, dead_line_pct: 5.0 }
    # Rank-invariance on a Flather-fed face.  500x80 factorises to PX=4, PY=1,
    # so np=4 splits ACROSS the fed face -- the decomposition that carried the
    # unmasked-flag bug (interior ranks imposing the open BC at their own
    # lp%ib).  Measured spread is 0 on all three metrics; the window is the
    # soliton sweep's 0.05, far above that and far below a structural shift.
    sweep_tolerances: { hm0_err_pct: 0.05, band_frac_pct: 0.05, dead_line_pct: 0.05 }

  # ── Boundary-feed wavemaker on the EAST Flather face (all-boundary rung) ──
  # Mirror of wm_boundary_flather with the feed on the east face; the
  # face_relative frame rotates theta = 0 to the east inward normal, so the
  # 1.0 m table radiates westward.  Confirms the feed transmits on a non-west
  # boundary; the west sponge absorbs the through wave.
  - name: wm_boundary_flather_east
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/wavemaker_boundary
    input_files: [data2d_flather_east.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, flather, allbnd, forcing]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # column-mean Hm0 1.041 (err 4.1 %) at np 4, board 09-15
      wavemaker_spectrum: { hm0_err_pct: 10.0, band_frac_pct: 95.0, dead_line_pct: 5.0 }

  # ── Face reflection: one coherent wave group at a zero-target Flather face ──
  # The Flather figure of merit the boundary-feed Hm0 gates never measure:
  # an interior source sends a focused group east at a forcing face with a
  # zero external target (no sponge = pure radiator); a 20-gauge column
  # 500 m short of the face sees the group outgoing, then whatever comes
  # back, and the oracle reports Kr from the two time windows.  Variants
  # spread the same per-line energy over 7 directions (raised cosine to the
  # half-width); s00 is the single-direction group.  The face takes the
  # auto dispersion taper (forcing.disp_ramp absent = 5 depths = 50 m):
  # with the dispersive closure on at the face Kr reads 35 %, with the
  # taper 0.5 % (50 m), 0.3 % (100 and 200 m); the bare variant sets the
  # key to 0 to keep the untapered number on record.
  - name: flather_reflection
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/flather_reflection
    input_files: [group.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, boundary, flather, reflection, forcing]
    postprocess:
      face_reflection: test.validation.oracles.face_reflection
    tolerances:
      # tapered face, board 09-15: Kr 0.5 (s00), 2.2 (s15), 3.3 (s30); the
      # 45 deg point reads 10.9 -- a normal-flux radiation condition is
      # exact at normal incidence only, and (1 - cos) / (1 + cos) at 45 deg
      # is 17 % for the edge components -- so it carries its own gate
      face_reflection: { kr_pct: 5.0 }
    variants:
      s00: { overrides: {} }
      s15: { overrides: { wavemaker.spectrum.file: data/group_s15.txt } }
      s30: { overrides: { wavemaker.spectrum.file: data/group_s30.txt } }
      s45: { overrides: { wavemaker.spectrum.file: data/group_s45.txt }, tolerances: { face_reflection: { kr_pct: 15.0 } } }
      # the untapered face on record: Kr 34.7 (s00), 34.6/34.7/37.9 at
      # 15/30/45 deg, board 09-15 -- the dispersive closure at the face
      bare: { overrides: { boundaries.east.forcing.disp_ramp: 0.0 }, tolerances: { face_reflection: { kr_pct: 45.0 } } }

  # Calibration twins of flather_reflection on the single-direction group: a
  # wall (the group comes back whole -- the bookkeeping check, floor-gated)
  # and the rig's direct + friction sponge (the absorber the spectrum lanes
  # rely on).  Measured 09-15: wall Kr 98.3, sponge 2.8.
  - name: flather_reflection_wall
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/flather_reflection
    input_files: [group_wall.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, boundary, reflection, refcal, forcing]
    postprocess:
      face_reflection: test.validation.oracles.face_reflection
    tolerances:
      face_reflection: { kr_min_pct: 90.0 }

  - name: flather_reflection_sponge
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/flather_reflection
    input_files: [group_sponge.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, boundary, sponge, reflection, refcal, forcing]
    postprocess:
      face_reflection: test.validation.oracles.face_reflection
    tolerances:
      face_reflection: { kr_pct: 6.0 }

  # ── combined forcing (GEN_ABS): wavemaker spectrum + SWL file on one face ──
  # The west forcing block carries both a wavemaker and a still-water-level file
  # series; the tide relaxes to the SWL while the wavemaker generates the waves.
  # SWL ramps to 0.3 m; the near-west line should sit at that mean while the
  # 1.0 m table Hm0 transmits.  Proves forcing.wavemaker + forcing.file compose.
  - name: wm_boundary_gen_abs
    exe_type: validation-2d
    np_sweep: [1, 4]
    input: test/validation/inputs/wavemaker_boundary
    input_files: [data2d_genabs.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, genabs, forcing, sweep]
    postprocess:
      wavemaker_gen_abs: test.validation.oracles.wavemaker_gen_abs
    tolerances:
      # measured: mean 0.293 vs SWL 0.30 (err 0.007 m); Hm0 0.95-0.99 vs 1.0
      wavemaker_gen_abs: { swl_err_m: 0.03, hm0_err_pct: 15.0 }
    # Rank-invariance on the RELAXATION path (this deck carries sponge.direct,
    # so it derives BC_RELAX, not Flather).  Measured spread is 0 on both
    # metrics.  Note the aggregate statistics are what is invariant here, NOT
    # the fields: a direct np=1 vs np=4 station-series comparison on the
    # relaxation path diverges from roundoff (p50 ~1e-4 m, tail 4.3e-2 m over
    # 340 s), seeded at the noise floor and amplified by the breaking field.
    # Mean level and Hm0 average that scatter out, which is why they gate
    # cleanly where a bitwise field check would be flaky.
    sweep_tolerances: { swl_err_m: 0.0005, hm0_err_pct: 0.05 }

  # ── spatially-varying boundary feed: Hm0 profile along the face ──
  # Case A (periodic-y).  The west feed reads a two-anchor manifest so the fed
  # spectrum interpolates along the face: Hm0 0.5 m at y = 40 to 1.5 m at
  # y = 280 (single-direction scaled copies -> linear Hm0 in y).  An alongshore
  # station line at x = 285 (>= 40 m off the periodic wrap) samples the clamped
  # ends and the gradient; the oracle checks measured Hm0(y) vs the interpolated
  # target end-to-end through the solver.  theta = 0 keeps the columns
  # quasi-independent so a near-boundary gauge reads its local fed Hm0.
  - name: wm_boundary_varying
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/wavemaker_boundary_varying
    input_files: [data2d_varying.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, varying, forcing]
    postprocess:
      wavemaker_boundary_varying: test.validation.oracles.wavemaker_boundary_varying
    tolerances:
      wavemaker_boundary_varying: { hm0_profile_err_pct: 15.0 }

  # ── spatially-varying boundary feed, case B: non-periodic (no seam) ──
  # Same rig without periodic-y (N/S default to solid walls), so there is no
  # wrap seam and the station line spans the FULL gradient y = [40, 280] with
  # the low anchor recovered EXACTLY (0.0 % at y = 40).  The trade vs case A:
  # the wall blocks the gradient-driven alongshore adjustment, leaving a
  # ~10 % interior Hm0 deficit that grows with amplitude (11.1 % at the high
  # anchor) — where case A's periodic interior was near-exact.  N/S sponges
  # would remove both the seam and the wall deficit (a future variant).
  - name: wm_boundary_varying_nonper
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/wavemaker_boundary_varying
    input_files: [data2d_varying_nonper.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, varying, nonper, forcing]
    postprocess:
      wavemaker_boundary_varying: test.validation.oracles.wavemaker_boundary_varying
    tolerances:
      # measured: anchor exact (0%), interior deficit to 11.1% at the high anchor
      wavemaker_boundary_varying: { hm0_profile_err_pct: 15.0 }
