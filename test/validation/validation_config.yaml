# Validation suite — physics oracles (analytic reference, physical tolerance).
#
# Ref-less by design: each executable declares no `ref:` key, so the runner
# builds a single binary and each postproc compares the run against theory
# instead of a reference build.  This is the "one repo + oracle" counterpart
# to the regression suite's two-repo byte comparison.
#
# Run with:
#   FUNWAVE_REGRESSION_CONFIG=test/validation/validation_config.yaml \
#     uv run python -m test.framework.cli regression

tier: validation

executables:
  validation-2d: {}

simulations:
  # ── linear dispersion: fundamental seiche vs the Nwogu relation ──────────
  # kh swept a..f = 0.31/0.94/1.88/2.83/4.00/12.57; e/f probe the short-wave edge
  # of the Boussinesq range (f = 4*pi, the 2D upper bound), checked vs the model's
  # own Nwogu relation so they stay correctness tests where Nwogu departs from Airy.
  - name: dispersion_2d
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/dispersion_2d
    input_files: [kh_a.yaml, kh_b.yaml, kh_c.yaml, kh_d.yaml, kh_e.yaml, kh_f.yaml]
    labels: { kh_a: "$kh = 0.31$", kh_b: "$kh = 0.94$", kh_c: "$kh = 1.88$", kh_d: "$kh = 2.83$", kh_e: "$kh = 4.00$", kh_f: "$kh = 12.57$" }
    binary: funwave
    output_dir: output
    tags: [2d, dispersion]
    postprocess:
      dispersion: test.validation.oracles.dispersion
    tolerances:
      dispersion: { period_error_pct: 5.0 }

  # ── mass conservation: closed frictionless basin, volume drift over the run ──
  # No forcing/friction/breaking/sponge, so total volume (flux-form continuity +
  # wall BC) conserves to ~machine precision.  diag (4,3) exercises both fluxes,
  # axis (5,0) the x-flux alone (x/y-asymmetry probe).  Energy is reported as an
  # ungated diagnostic here: at kh ~ 1.57 leading-order PE+KE is not the Boussinesq
  # invariant (it exchanges with dispersive energy), so only mass is a gate.
  - name: conservation_2d
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/conservation_2d
    input_files: [cons_diag.yaml, cons_axis.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, conservation]
    postprocess:
      conservation: test.validation.oracles.conservation
    tolerances:
      conservation: { mass_drift_pct: 0.01 }

  # ── energy conservation: low-kh (weakly dispersive) closed basin ─────────
  # kh ~ 0.16 (shallow h = 0.5 m, mode (2,0)) so leading-order PE+KE IS the true
  # invariant to O((kh)^2) ~ 2.5% and the multi-period window mean averages that
  # residual out; numerical dissipation then shows as a secular energy change.
  # FUTURE: the full dispersive energy functional (A/B gradient terms) would gate
  # energy at any kh -- an in-model metric, deferred.
  - name: conservation_2d_lowkh
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/conservation_2d
    input_files: [cons_lowkh.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, conservation]
    postprocess:
      conservation: test.validation.oracles.conservation
    tolerances:
      conservation: { mass_drift_pct: 0.01, energy_drift_pct: 3.0 }

  # ── solitary permanence: periodic-x flume, crest tracked over ~3 transits ──
  # A solitary wave must keep amplitude, shape, and c = sqrt(g(h+a)) after the
  # initial adjustment sheds.  Measured celerity 0.0024 %, amplitude 0.0069 %,
  # shape 2.4 % — the shed dispersive tail wrapping the domain dominates the
  # L2; the crest itself is permanent to ~1e-4.
  # np_sweep: the same deck at several rank counts; the runner aggregates a
  # decomp-invariance gate (metric spread across np vs sweep_tolerances) on
  # top of the per-np physics gates.  Periodic-x seams stress the x-halo path.
  - name: soliton_2d
    exe_type: validation-2d
    np_sweep: [1, 2, 8]
    input: test/validation/inputs/soliton_2d
    input_files: [soliton_x.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, soliton, sweep]
    postprocess:
      soliton: test.validation.oracles.soliton
    tolerances:
      soliton: { celerity_error_pct: 1.0, amplitude_decay_pct: 1.0, shape_error_pct: 5.0 }
    sweep_tolerances: { celerity_error_pct: 0.05, amplitude_decay_pct: 0.1, shape_error_pct: 1.0 }

  # ── oblique tiled train: 45-deg crest, doubly periodic square box ────────
  # Full 2D path (nonzero v, both periodic tridiagonals).  Crest metrics stay
  # tight (trace celerity 0.004 %, amplitude 0.44 %); the shape gate is
  # looser than the flume's because the 2D adjustment radiation wraps
  # the closed box and sits under the row-profile L2 (7.5 % measured) — it is
  # a radiation-noise bound, not a crest-permanence bound.
  # Flagship decomp sweep: square doubly-periodic domain factorizes to real
  # 2D decompositions (1x1 / 2x2 / 4x4 / 8x8), exercising both halo axes +
  # corners; the np=64 variant needs the HPC rank pool (skipped locally).
  - name: soliton_oblique
    exe_type: validation-2d
    np_sweep: [1, 4, 16, 64]
    input: test/validation/inputs/soliton_2d
    input_files: [soliton_oblique.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, soliton, sweep]
    postprocess:
      soliton: test.validation.oracles.soliton
    tolerances:
      soliton: { celerity_error_pct: 1.0, amplitude_decay_pct: 2.0, shape_error_pct: 10.0 }
    sweep_tolerances: { celerity_error_pct: 0.05, amplitude_decay_pct: 0.2, shape_error_pct: 1.0 }

  # ── solitary runup: Synolakis nonbreaking canonical case ─────────────────
  # H/h = 0.019 on the cot(beta) = 19.85 beach vs the asymptotic NSWE runup
  # law R/h = 2.831 sqrt(cot beta) (H/h)^{5/4} = 0.0889.  The model lands
  # ~10 % below the law (R/h ~ 0.080), robust to scheme/dx/min_depth/breaking
  # path — ADJUDICATED INHERITED 2026-07-20: the legacy binary on the same
  # bathy/IC gives R = 0.0797 vs modern 0.0794 (0.3 % apart), so this is
  # FUNWAVE-TVD's standing distance from the asymptotic law (lab data scatter
  # below it too), not a modern-side swash regression.  The 15 % law-referenced
  # gate is the drift tripwire around that documented behaviour.
  # Swept for the wet/dry front crossing x-rank seams; the runup metric moves
  # in front-cell quanta (~dx*slope ~ 0.6 % of the law here), so its sweep
  # tolerance allows a couple of quanta, not roundoff.
  - name: runup_synolakis
    exe_type: validation-2d
    np_sweep: [1, 2, 4]
    input: test/validation/inputs/runup_2d
    input_files: [synolakis_nb.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, runup, sweep]
    postprocess:
      runup: test.validation.oracles.runup
    tolerances:
      runup: { runup_error_pct: 15.0 }
    sweep_tolerances: { runup_error_pct: 2.0 }

  # ── periodic runup: Carrier-Greenspan/Keller amplification, plane beach ──
  # Monochromatic T = 10 s (kh ~ 0.2) over h = 1 m onto the 1/15 slope; for
  # nonbreaking waves the maximum runup equals the LINEAR amplification of the
  # incident amplitude (CG 1958).  The oracle integrates the linear SWE over
  # the actual dep.out profile (RK4 flux form, matches the exact Bessel value
  # to 4 decimals — no convention risk), measures the incident amplitude by
  # lock-in demodulation + e^{+-ikx} split on the flat (raw min/max envelopes
  # are bound-harmonic contaminated: 18% false fail at first light), and gates
  # the steady shoreline peak against the linear prediction.  First light
  # 2026-07-20: amplification 6.363, error 5.5%, CG breaking param 0.39,
  # reflection 0.91; shoreline granularity dx*slope ~ 8% of R bounds the
  # measurement, so 15% is a tripwire, not a discretization claim.  The steady
  # incident amplitude is ~1.35x the deck value via beach-sponge cavity pumping
  # (source itself calibrates to ~1%; the deck comment has the split).
  - name: runup_cg
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/runup_2d
    input_files: [cg_periodic.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, runup]
    postprocess:
      runup_cg: test.validation.oracles.runup_cg
    tolerances:
      runup_cg: { runup_amp_error_pct: 15.0 }

  # ── scheme presets: each dispersion preset vs ITS OWN linear relation ────
  # The same kh = 1.88 seiche under fully_nonlinear / weakly_nonlinear /
  # linear / nswe; dispersive presets gate against Nwogu, nswe against the
  # non-dispersive sqrt(gh) period (~17% apart at this kh), so the
  # preset -> Gamma1/2/3 wiring is guarded directly (the 2026-07-16 silent
  # gamma-wipe class).  Native-YAML decks (scheme: is a modern key).
  - name: schemes_2d
    exe_type: validation-2d
    input: test/validation/inputs/schemes_2d
    input_files: [scheme_fnl.yaml, scheme_wnl.yaml, scheme_lin.yaml, scheme_nswe.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, dispersion, schemes]
    postprocess:
      dispersion: test.validation.oracles.dispersion
    tolerances:
      dispersion: { period_error_pct: 5.0 }

  # ── dispersion isotropy: oblique modes at fixed |k| across angles ────────
  # Square-basin standing modes (m_x, m_y) sharing m_x^2+m_y^2 = 25 -> one |k| (kh
  # ~ 1.57) at theta = 0/36.9/53.1/90 deg; (5,0) vs (0,5) is the x<->y symmetry
  # probe.  Reuses the dispersion oracle (checks each angle's period vs Nwogu).
  - name: isotropy_2d
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/isotropy_2d
    input_files: [iso_50.yaml, iso_43.yaml, iso_34.yaml, iso_05.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, dispersion, isotropy]
    postprocess:
      dispersion: test.validation.oracles.dispersion
    tolerances:
      dispersion: { period_error_pct: 5.0 }

  # ── spectral wavemaker fidelity: Hm0 out vs Hm0 asked ────────────────────
  # TMA internal source on a flat frictionless flume, breaking never triggered;
  # station-mean variance Hm0 ~2-3 lambda_p downwave gated against the deck Hm0
  # (the band renormalization makes the deck value the exact analytic target).
  # Band-fraction diagnostics separate generation-side deficits (source-width
  # truncation, ledger A7c) from sponge leakage; primary coverage for the
  # wavemaker spectrum-pipeline refactor.
  - name: spectral_2d
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/spectral_2d
    input_files: [tma_fidelity.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, spectral]
    postprocess:
      spectral_fidelity: test.validation.oracles.spectral_fidelity
    tolerances:
      spectral_fidelity: { hm0_error_pct: 25.0 }

  # ── wavemaker spectrum self-consistency: target vs field-realized ────────
  # Synthetic parametric rung (oracle-mode, no lab data): five spectra-type
  # lanes on one flat rig (h = 10 m, periodic-y, 41-line equal-df ladder ->
  # T_rec = 200 s; deck headers carry the geometry).  Hm0, peak location,
  # band containment, and the exact-T_rec line-completeness comb tripwire
  # gate each discretizer path: directional grid (TMA+JONSWAP),
  # single_dir_per_freq (regresses the equal-spreading-mass comb fix),
  # single_dir + equal_energy: freq (the reader accepting the per-axis combo
  # is itself the coverage; non-uniform bins, so no line metric), and a
  # WK_DATA2D flat table (exact component-sum Hm0, no peak gate).
  # The Hm0 anchors expose a real discretizer spread: single_dir delivers the
  # deck Hm0 to 1.1 % while the directional-grid lanes under-deliver 13-18 %
  # (spreading mass parked on steeply-snapped periodic modes; JONSWAP worse
  # than TMA via its heavier low band).  So the Hm0 gates are CHARACTERIZATION
  # bounds per lane, not one shared physics bound.
  - name: wm_tma_grid
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/wavemaker_spectrum
    input_files: [tma_grid.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, spectral, wavemaker_spectrum]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # anchors: hm0 13.5, fp 2.3, band 99.2, dead 0.0
      wavemaker_spectrum: { hm0_err_pct: 18.0, fp_err_pct: 16.7, band_frac_pct: 95.0, dead_line_pct: 5.0 }

  - name: wm_jonswap_grid
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/wavemaker_spectrum
    input_files: [jonswap_grid.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, spectral, wavemaker_spectrum]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # anchors: hm0 18.5, fp 2.3, band 99.3, dead 0.0
      wavemaker_spectrum: { hm0_err_pct: 24.0, fp_err_pct: 16.7, band_frac_pct: 95.0, dead_line_pct: 5.0 }

  - name: wm_tma_sd
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/wavemaker_spectrum
    input_files: [tma_sd.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, spectral, wavemaker_spectrum]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # anchors: hm0 1.1, fp 2.3, band 99.3, dead 0.0 (pre-fix comb ~14)
      wavemaker_spectrum: { hm0_err_pct: 4.0, fp_err_pct: 16.7, band_frac_pct: 95.0, dead_line_pct: 5.0 }

  - name: wm_tma_sd_eqe
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/wavemaker_spectrum
    input_files: [tma_sd_eqe.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, spectral, wavemaker_spectrum]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # anchors: hm0 10.5 (0.988 realized at init + delivery), fp 2.3, band 98.9
      wavemaker_spectrum: { hm0_err_pct: 15.0, fp_err_pct: 16.7, band_frac_pct: 95.0 }

  - name: wm_data2d
    exe_type: validation-2d
    np: 4
    input: test/validation/inputs/wavemaker_spectrum
    input_files: [data2d.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, spectral, wavemaker_spectrum]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # anchors: hm0 3.5, band 99.3, dead 0.0 (flat table: no peak gate)
      wavemaker_spectrum: { hm0_err_pct: 7.0, band_frac_pct: 95.0, dead_line_pct: 5.0 }

  # ═══ Lab cases — model vs measured laboratory truth ═════════════════════
  # Ref-less; each inputs/<case>/ dir holds decks + measured data, staged
  # into the run dir where the oracle reads them.  Gates = anchor + headroom.

  # ── Synolakis runup: measured eta(x) snapshots, NTHMP labBM-04 ──────────
  # anchors: nb worst 10.6 (t*=70), NTHMP acceptance 10/20 nb/breaking
  - name: lab_synolakis_nb
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/synolakis
    input_files: [synolakis_nb.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, profiles, 1d]
    postprocess:
      synolakis: test.validation.oracles.synolakis
    tolerances:
      synolakis:
        profiles: [profile_nb_t30.txt, profile_nb_t40.txt, profile_nb_t50.txt, profile_nb_t60.txt, profile_nb_t70.txt]
        profile_nrmse_pct: 15.0

  # anchors: brk worst 8.2 at the WKN-B release
  - name: lab_synolakis_brk
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/synolakis
    input_files: [synolakis_brk.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, profiles, 1d]
    postprocess:
      synolakis: test.validation.oracles.synolakis
    tolerances:
      synolakis:
        profiles: [profile_brk_t15.txt, profile_brk_t20.txt, profile_brk_t25.txt, profile_brk_t30.txt]
        profile_nrmse_pct: 10.0
    # the same deck under both breaking closures; the viscous arm carries
    # its own calibrated bounds where they differ
    variants:
      shock: { overrides: { breaking.model: shock_capturing } }
      viscous: { overrides: { breaking.model: eddy_viscosity }, tolerances: { synolakis: { profile_nrmse_pct: 15.0 } } }


  # ── Hansen & Svendsen 1979: H(x) + setup(x), the breaking-closure rung ──
  # anchors: H 6.0-8.6; setup 18.7/31.1 spilling, 14.4/18.1 plunging
  - name: lab_hs_spilling
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/hansen_svendsen
    input_files: [hs_spilling.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, surf, 1d]
    postprocess:
      surf: test.validation.oracles.surf
    tolerances:
      surf:
        heights: ht_setup_061071.txt
        setup: ht_setup_061071.txt
        channel: line
        window_s: [30.0, 100.0]
        height_nrmse_pct: 15.0
        setup_nrmse_pct: 30.0
    # the same deck under both breaking closures; the viscous arm carries
    # its own calibrated bounds where they differ
    variants:
      shock: { overrides: { breaking.model: shock_capturing } }
      viscous: { overrides: { breaking.model: eddy_viscosity }, tolerances: { surf: { height_nrmse_pct: 20.0, setup_nrmse_pct: 40.0 } } }


  - name: lab_hs_plunging
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/hansen_svendsen
    input_files: [hs_plunging.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, surf, 1d]
    postprocess:
      surf: test.validation.oracles.surf
    tolerances:
      surf:
        heights: ht_setup_031041.txt
        setup: ht_setup_031041.txt
        channel: line
        window_s: [30.0, 100.0]
        height_nrmse_pct: 15.0
        setup_nrmse_pct: 25.0
    # the same deck under both breaking closures; the viscous arm carries
    # its own calibrated bounds where they differ
    variants:
      shock: { overrides: { breaking.model: shock_capturing } }
      viscous: { overrides: { breaking.model: eddy_viscosity }, tolerances: { surf: { height_nrmse_pct: 20.0 } } }


  # ── Ting & Kirby 1994: spilling/plunging cnoidal pair ───────────────────
  # 50 % gates = sinusoid-era tripwire; a cnoidal maker should reach ~20
  # anchors: spilling 21.8+49.4 / 17.4+47.4, plunging shock 22.4+36.3
  - name: lab_tk_spilling
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/ting_kirby
    input_files: [tk_spilling.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, surf, 1d]
    postprocess:
      surf: test.validation.oracles.surf
    tolerances:
      surf:
        heights: heights_spilling.txt
        setup: setup_spilling.txt
        channel: line
        window_s: [100.0, 300.0]
        setup_nrmse_pct: 50.0
        height_nrmse_pct: 50.0
    # the same deck under both breaking closures; the viscous arm carries
    # its own calibrated bounds where they differ
    variants:
      shock: { overrides: { breaking.model: shock_capturing } }
      viscous: { overrides: { breaking.model: eddy_viscosity } }


  - name: lab_tk_plunging
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/ting_kirby
    input_files: [tk_plunging.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, surf, 1d]
    postprocess:
      surf: test.validation.oracles.surf
    tolerances:
      surf:
        heights: heights_plunging.txt
        setup: setup_plunging.txt
        channel: line
        window_s: [150.0, 400.0]
        setup_nrmse_pct: 50.0
        height_nrmse_pct: 50.0
    # the same deck under both breaking closures; the viscous arm carries
    # its own calibrated bounds where they differ
    variants:
      shock: { overrides: { breaking.model: shock_capturing } }
      viscous: { overrides: { breaking.model: eddy_viscosity } }


  # ── Wavemaker fidelity: the h470 incident gauge as its own gated case ───
  # anchors: nrmse 8.6 over the 60-700 s window
  - name: lab_mase_wavemaker
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/mase_kirby
    input_files: [mase_kirby_run2.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, gauges, wavemaker, 1d]
    postprocess:
      gauges: test.validation.oracles.gauges
    tolerances:
      gauges:
        file: gauges.txt
        gauges: [h470]
        align: none
        channel: gauges
        window_s: [60.0, 700.0]
        gauge_nrmse_pct: 12.0

  # ── Mase & Kirby 1992 run 2: random-wave gauge ladder, statistics gates ─
  # anchors: sigma_rmse 6.7, skew 24.0, asym 12.0; Shi 2012 = 5.4/6.6/12.1
  - name: lab_mase_kirby
    exe_type: validation-2d
    np: 2
    input: test/validation/inputs/mase_kirby
    input_files: [mase_kirby_run2.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, gauges, 1d]
    postprocess:
      gauges: test.validation.oracles.gauges
    tolerances:
      gauges:
        file: gauges.txt
        gauges: [h470, h350, h300, h250, h200, h175, h150, h125, h100, h075, h050, h025]
        align: none
        channel: gauges
        window_s: [60.0, 700.0]
        mode: heights
        stat_exclude: [h470]
        height_error_pct: 25.0
        sigma_error_pct: 20.0
        sigma_rmse_pct: 8.5
        skew_rmse_pct: 30.0
        asym_rmse_pct: 15.0
    # both closures: the viscous arm sharpens skewness (24 -> 12 %) and loosens
    # the height variance (16 -> 24 %); its sigma bound follows the 09-11 board
    variants:
      shock: { overrides: { breaking.model: shock_capturing } }
      viscous: { overrides: { breaking.model: eddy_viscosity }, tolerances: { gauges: { sigma_error_pct: 25.0 } } }

  # ── Kobayashi & Lawrence 2004: bed change under a breaking solitary wave ─
  # Wave 1 of the Fig 4.5 growth curves; CACR-16-02's own model matched emax
  # and ran dmax ~half of measured, so the deposition gate stays inherited-loose.
# Viscous breaker only: sediment is refused under shock_capturing
  - name: lab_kl_erosion
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/kobayashi_lawrence
    input_files: [kl_erosion.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, sediment, 1d]
    postprocess:
      morphology: test.validation.oracles.morphology
    known_fail: "emax 5.5x the lab since the face depths follow the bed; scour limiter rung open"
    tolerances:
      morphology:
        growth: erosion_growth.txt
        h0: 0.216
        wave: 1
        emax_rel_err_pct: 60.0
        dmax_rel_err_pct: 75.0

  # ── Pintado-Patino et al. 2016: dam-break swash over an erodible beach ──
  # Runs to 8.5 s — the paper's own comparison regime (before the reflected
  # bore, which the experiment's second gate blocked, reaches the beach).
  # Gates: profile NRMSE + the erosion-trough location; the deposition peak
  # reports ungated (measured settles fully, the model's suspended load is
  # still aloft — CACR-16-02 p.69).  Viscous breaker with swe_gate on: the
  # front is a bore, and sediment is refused under shock_capturing.
  - name: lab_pp_dambreak
    exe_type: validation-2d
    np_pin: 2
    input: test/validation/inputs/pintado_patino
    input_files: [pp_dambreak.yaml]
    binary: funwave
    output_dir: output
    tags: [lab, sediment, 1d]
    postprocess:
      morphology: test.validation.oracles.morphology
    tolerances:
      morphology:
        bedchange: bedchange_10s.txt
        gate_x: 1.0
        bedchange_nrmse_pct: 60.0
        trough_offset_m: 0.3

  # ── Still-water level: grid.water_level on a flat, unforced basin ──
  # The level bakes into the depth datum (depth = d + W) and the surface stays
  # quiescent (eta referenced to the level).  Gates the datum shift and the
  # residual surface excursion.  The (d, W) vs (d + W, 0) bit-identical
  # cross-check (which also exercises the wavemaker DEP_WK shift) is reported
  # in the forcing-validation task writeup, not gated here (a single-deck
  # oracle cannot compare two runs).
  - name: wl_still
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/water_level
    input_files: [wl_still.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, water_level, forcing]
    postprocess:
      still_water: test.validation.oracles.still_water
    tolerances:
      # measured: max|eta| 3.3e-6 m (numerical flat-state floor), datum_err 0
      still_water: { max_eta_m: 1.0e-3, depth_datum_err_m: 1.0e-6 }

  # ── Flather open boundary (characteristic BC track): tide transmission ──
  # forcing: without sponge.direct derives a Flather radiation face — imposes
  # the target through the boundary-normal flux and radiates outgoing energy,
  # unlike the relaxation strip (which attenuates to 0.2-0.4).  Slow tide
  # (T=300s >> 45s basin transit) so the interior co-oscillates.  The three
  # progressive arms expose the Riemann-invariant structure: the full (eta,u)
  # invariant transmits fully, either half transmits at ~0.5.
  - name: tide_flather_coosc
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/tide_flather
    input_files: [coosc.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, tide, flather, forcing]
    postprocess:
      flather_transmission: test.validation.oracles.flather_transmission
    tolerances:
      # measured 1.009 (relaxation strip: 0.40)
      flather_transmission: { ratio_min: 0.9, ratio_max: 1.1 }

  - name: tide_flather_prog_etauv
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/tide_flather
    input_files: [prog_etauv.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, tide, flather, forcing]
    postprocess:
      flather_transmission: test.validation.oracles.flather_transmission
    tolerances:
      # full incident R+ = u + sqrt(g/h) eta -> measured 1.003
      flather_transmission: { ratio_min: 0.9, ratio_max: 1.1 }

  # np_sweep is the rank-invariance gate on the Flather face.  ny = 3 forces
  # the np=4 variant to decompose in x (PX=4, seams at i = 50/100/150), which
  # is the axis that carries the face: flux_flather_bc applies at the RANK-
  # local lp%ib/lp%ie, so an unmasked face flag makes every interior rank
  # impose the open BC at its own subdomain edge.  That regression measured
  # 0.18 m of eta at the seams and a ratio spread of 0.0038; masked by rank
  # ownership the two decompositions are bitwise (spread 0.0000), so the
  # 0.001 window sits between the two.
  - name: tide_flather_prog_eta
    exe_type: validation-2d
    np_sweep: [1, 4]
    input: test/validation/inputs/tide_flather
    input_files: [prog_eta.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, tide, flather, forcing, sweep]
    postprocess:
      flather_transmission: test.validation.oracles.flather_transmission
    tolerances:
      # eta only = half the Riemann invariant -> measured 0.502
      flather_transmission: { ratio_min: 0.45, ratio_max: 0.55 }
    sweep_tolerances: { ratio: 0.001 }

  - name: tide_flather_prog_uvonly
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/tide_flather
    input_files: [prog_uvonly.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, tide, flather, forcing]
    postprocess:
      flather_transmission: test.validation.oracles.flather_transmission
    tolerances:
      # u/v only = half the invariant; eta column is zero so reference the
      # 1.0 m incident range explicitly -> measured 0.502
      flather_transmission: { ratio_min: 0.45, ratio_max: 0.55, reference_pp_m: 1.0 }

  # ── Wind setup: meteo.wind steady-state balance ──
  # Closed basin, steady uniform wind ramped on over ~2 seiche periods; the
  # oracle time-averages the fitted surface slope and gates it against the
  # analytic d(eta)/dx = (rho_a/rho) Cd_w W^2 / (g h).  Flux-form stress, no
  # 1/h, so it is bounded as h -> 0.
  - name: wind_setup
    exe_type: validation-2d
    np_pin: 1
    input: test/validation/inputs/wind_setup
    input_files: [wind_setup.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, meteo, wind, forcing]
    postprocess:
      wind_setup: test.validation.oracles.wind_setup
    tolerances:
      # analytic slope 7.86e-5; time-mean ratio 1.005 over the settled window
      wind_setup: { ratio_min: 0.9, ratio_max: 1.1 }

  # ── Boundary-feed wavemaker: spectrum-only entry fed at the west face ──
  # Mirrors wm_data2d but generates at the boundary (no source: box).  Now
  # transmits at ~1.0x the table (measured Hm0 1.026 m), matching the internal
  # source, after the directional-phase-coherence fix (wavemaker.f90): the
  # boundary path previously collapsed all of a frequency's directions onto one
  # phase (legacy Phase_LEFT(:,1)), so periodic-y direction snapping added them
  # coherently and piled up energy (old measured 1.987 m ~ 2x).
  - name: wm_boundary_data2d
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/wavemaker_boundary
    input_files: [data2d.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, forcing]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # measured Hm0 1.026 vs 1x target -> err 2.6%, band 99.5%
      wavemaker_spectrum: { hm0_err_pct: 15.0, band_frac_pct: 95.0, dead_line_pct: 5.0 }

  # ── Boundary-feed wavemaker on a FLATHER face (no west sponge) ──
  # Same feed as wm_boundary_data2d but the incident series rides the
  # boundary-normal flux as the Flather external target instead of relaxing
  # through a strip (wavemaker-Flather stage 2).  Transmits at ~1.0x
  # (measured Hm0 0.979 m) after the directional-phase-coherence fix, matching
  # both the strip and the internal source.  A residual ~2% under 1.0 is the
  # dispersive Flather mismatch (this spectrum spans kh~0.7-3; the fed
  # u_ext != cf*eta_ext radiates a sliver back) — compose with an interior
  # absorber for a strongly dispersive boundary sea.
  - name: wm_boundary_flather
    exe_type: validation-2d
    np_sweep: [1, 4]
    input: test/validation/inputs/wavemaker_boundary
    input_files: [data2d_flather.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, flather, forcing, sweep]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      # measured Hm0 0.979 vs 1x target -> err 2.1%, band 99.3%
      wavemaker_spectrum: { hm0_err_pct: 15.0, band_frac_pct: 95.0, dead_line_pct: 5.0 }
    # Rank-invariance on a Flather-fed face.  500x80 factorises to PX=4, PY=1,
    # so np=4 splits ACROSS the fed face -- the decomposition that carried the
    # unmasked-flag bug (interior ranks imposing the open BC at their own
    # lp%ib).  Measured spread is 0 on all three metrics; the window is the
    # soliton sweep's 0.05, far above that and far below a structural shift.
    sweep_tolerances: { hm0_err_pct: 0.05, band_frac_pct: 0.05, dead_line_pct: 0.05 }

  # ── Boundary-feed wavemaker on the EAST Flather face (all-boundary rung) ──
  # Mirror of wm_boundary_flather with the feed on the east face; the
  # face_relative frame rotates theta = 0 to the east inward normal, so the
  # 1.0 m table radiates westward.  Confirms the feed transmits on a non-west
  # boundary; the west sponge absorbs the through wave.
  - name: wm_boundary_flather_east
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/wavemaker_boundary
    input_files: [data2d_flather_east.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, flather, allbnd, forcing]
    postprocess:
      wavemaker_spectrum: test.validation.oracles.wavemaker_spectrum
    tolerances:
      wavemaker_spectrum: { hm0_err_pct: 15.0, band_frac_pct: 95.0, dead_line_pct: 5.0 }

  # ── combined forcing (GEN_ABS): wavemaker spectrum + SWL file on one face ──
  # The west forcing block carries both a wavemaker and a still-water-level file
  # series; the tide relaxes to the SWL while the wavemaker generates the waves.
  # SWL ramps to 0.3 m; the near-west line should sit at that mean while the
  # 1.0 m table Hm0 transmits.  Proves forcing.wavemaker + forcing.file compose.
  - name: wm_boundary_gen_abs
    exe_type: validation-2d
    np_sweep: [1, 4]
    input: test/validation/inputs/wavemaker_boundary
    input_files: [data2d_genabs.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, genabs, forcing, sweep]
    postprocess:
      wavemaker_gen_abs: test.validation.oracles.wavemaker_gen_abs
    tolerances:
      # measured: mean 0.293 vs SWL 0.30 (err 0.007 m); Hm0 0.95-0.99 vs 1.0
      wavemaker_gen_abs: { swl_err_m: 0.03, hm0_err_pct: 15.0 }
    # Rank-invariance on the RELAXATION path (this deck carries sponge.direct,
    # so it derives BC_RELAX, not Flather).  Measured spread is 0 on both
    # metrics.  Note the aggregate statistics are what is invariant here, NOT
    # the fields: a direct np=1 vs np=4 station-series comparison on the
    # relaxation path diverges from roundoff (p50 ~1e-4 m, tail 4.3e-2 m over
    # 340 s), seeded at the noise floor and amplified by the breaking field.
    # Mean level and Hm0 average that scatter out, which is why they gate
    # cleanly where a bitwise field check would be flaky.
    sweep_tolerances: { swl_err_m: 0.0005, hm0_err_pct: 0.05 }

  # ── spatially-varying boundary feed: Hm0 profile along the face ──
  # Case A (periodic-y).  The west feed reads a two-anchor manifest so the fed
  # spectrum interpolates along the face: Hm0 0.5 m at y = 40 to 1.5 m at
  # y = 280 (single-direction scaled copies -> linear Hm0 in y).  An alongshore
  # station line at x = 285 (>= 40 m off the periodic wrap) samples the clamped
  # ends and the gradient; the oracle checks measured Hm0(y) vs the interpolated
  # target end-to-end through the solver.  theta = 0 keeps the columns
  # quasi-independent so a near-boundary gauge reads its local fed Hm0.
  - name: wm_boundary_varying
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/wavemaker_boundary_varying
    input_files: [data2d_varying.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, varying, forcing]
    postprocess:
      wavemaker_boundary_varying: test.validation.oracles.wavemaker_boundary_varying
    tolerances:
      wavemaker_boundary_varying: { hm0_profile_err_pct: 15.0 }

  # ── spatially-varying boundary feed, case B: non-periodic (no seam) ──
  # Same rig without periodic-y (N/S default to solid walls), so there is no
  # wrap seam and the station line spans the FULL gradient y = [40, 280] with
  # the low anchor recovered EXACTLY (0.0 % at y = 40).  The trade vs case A:
  # the wall blocks the gradient-driven alongshore adjustment, leaving a
  # ~10 % interior Hm0 deficit that grows with amplitude (11.1 % at the high
  # anchor) — where case A's periodic interior was near-exact.  N/S sponges
  # would remove both the seam and the wall deficit (a future variant).
  - name: wm_boundary_varying_nonper
    exe_type: validation-2d
    np_pin: 4
    input: test/validation/inputs/wavemaker_boundary_varying
    input_files: [data2d_varying_nonper.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, wavemaker, boundary, varying, nonper, forcing]
    postprocess:
      wavemaker_boundary_varying: test.validation.oracles.wavemaker_boundary_varying
    tolerances:
      # measured: anchor exact (0%), interior deficit to 11.1% at the high anchor
      wavemaker_boundary_varying: { hm0_profile_err_pct: 15.0 }
