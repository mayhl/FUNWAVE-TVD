# Hotstart round-trip base deck — NSWE (dispersion off).
# Same three-leg derivation as bouss.yaml, but with dispersion disabled the
# restart is exactly BITWISE (no one-exchange-behind ghost carried state), so
# the harness asserts a zero tolerance for this case.
grid:
  cell_size: [1.0, 1.0]
  grid_size: [200, 4]
  decomposition:
    nx_proc: 1
    ny_proc: 1
  bathymetry:
    type: flat
    depth: 10.0
simulation:
  title: hotstart_nswe
  total_time: 4.0
  time_stepping:
    fixed_dt: yes
    dt: 0.02
initial:
  solitary:
    amplitude: 0.5
    depth: 10.0
    x_center: 60.0
boundaries:
  periodic: [y]
physics:
  dispersion:
    scheme: nswe
numerics:
  cfl: 0.5
  min_depth: 0.01
output:
  result_folder: ./out/
  interval: 4.0
  variables: [ETA]
