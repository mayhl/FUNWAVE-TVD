# Sediment hotstart round-trip: core.bin and sediment.bin must survive checkpoint + restart.
grid:
  cell_size: [0.05, 0.05]
  n_cells: [800, 3]
  n_procs: [1, 1]
  bathymetry:
    type: slope
    depth: 0.8
    slope: 0.0833333333
    x0: 20.0
simulation:
  title: hotstart_sediment
  total_time: 4.0
initial:
  solitary:
    amplitude: 0.216
    depth: 0.8
    x_center: 5.0
friction:
  cd: 0.01
sediment:
  d50: 0.00018
  specific_gravity: 2.6
  porosity: 0.4
  settling_velocity: 0.02
  bed_change: true
  morph_interval: 0.05
  min_depth_pickup: 0.01
numerics:
  dt: 0.005
  min_depth: 0.01
output:
  result_folder: ./out/
  channels:
    - name: fields
      geometry: field
      variables: [eta]
      interval: 4.0
