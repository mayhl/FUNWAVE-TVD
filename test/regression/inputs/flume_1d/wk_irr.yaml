# FUNWAVE-TVD input — converted from legacy input.txt
# Source: test/regression/inputs/flume_1d/wk_irr.txt
#
# No unrecognised keys.

grid:
  cell_size: [2.0, 2.0]
  grid_size: [250, 10]
  bathymetry:
    type: slope
    depth: 8.0
    slope: 0.05
    x0: 300.0
simulation:
  title: 2D_beach
  total_time: 900.0
  screen_interval: 2.0
wavemaker:
  spectrum:
    type: tma
    hm0: 1.0
    gamma: 5.0
    freq:
      peak: 0.0833
      min: 0.05
      max: 0.3
    directional:
      peak: 0.0
      spread: 10.0
    discretization:
      freq_bins: 45
      theta_bins: 24
  source:
    x_center: 150.0
    y_center: 0.0
    depth: 8.0
boundaries:
  west:
    sponge:
      width: 100.0
      direct:
        r: 0.85
        a: 5.0
      friction:
        cd: 1.0
  periodic: [y]
numerics:
  cfl: 0.5
  froude_cap: 1.0
  min_depth: 0.01
breaking:
  model: shock_capturing
  cbrk1: 0.65
  cbrk2: 0.35
output:
  interval: 5.0
  result_folder: output/
  field_io_type: BINARY
  means:
    interval: 100.0
    steady_time: 100.0
  depth_out: true
  variables: [U, V, ETA, ETAscreen, Hmax, Hmin, Umax, MASK, MASK9, P, Q]
