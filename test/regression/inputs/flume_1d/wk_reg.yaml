# FUNWAVE-TVD input — converted from legacy input.txt
# Source: test/regression/inputs/flume_1d/wk_reg.txt
#
# No unrecognised keys.

grid:
  cell_size: [2.0, 2.0]
  n_cells: [250, 10]
  bathymetry:
    type: slope
    depth: 8.0
    slope: 0.05
    x0: 300.0
simulation:
  title: flume_1d_wk_reg
  total_time: 900.0
  screen_interval: 2.0
wavemaker:
  spectrum:
    type: regular
    amplitude: 0.5
    period: 12.0
    direction: 0.0
  source:
    x_center: 150.0
    y_center: 0.0
    depth: 8.0
    time_ramp: 20.0
boundaries:
  west:
    sponge:
      # 120 m clears the lambda_low advisory (102.3 m at T=12 s, h=8 m)
      width: 120.0
      direct:
        r: 0.85
        a: 5.0
      friction:
        cd: 1.0
  periodic: [y]
numerics:
  cfl: 0.5
  froude_cap: 1.0
  min_depth: 0.01
breaking:
  cbrk1: 0.65
  cbrk2: 0.35
output:
  result_folder: output/
  format: binary
  depth_out: true
  channels:
    - name: fields
      geometry: field
      variables: [u, v, eta, h_max, h_min, u_max, mask, mask9, p_flux, q_flux]
      interval: 5.0
    - name: means  # nee means block + *mean variables; hsig = 4.004 std(eta)
      geometry: field
      variables: [eta, u, v, hsig]
      statistics: [mean]
      t_start: 100.0
      interval: 100.0
