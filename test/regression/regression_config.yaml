# Auto rank-sizing: each test's MPI np is derived from its grid, not hand-set.
#   np = clamp(round(sqrt(Mglob*Nglob) / K), 1, rank_budget)
# Only the horizontal plane decomposes, so Kglob (vertical layers) is excluded:
# a wheat scan showed the 3D HYPRE solve does not strong-scale (np=1 fastest), so
# M*N sizes the 3D case to np=1 while leaving 2D unchanged.
# K is the efficiency dial (measured on wheat, 92-core, shm transport):
#   K=13 -> ~60% per-run efficiency (debug: max node usage, fastest turnaround)
#   K=25 -> ~85% per-run efficiency (production: revisit near release)
# ref and dev auto-size identically, so the comparison stays bitwise.
np_sizing:
  K: 25

refs:
  2d:
    branch: regression-ref/v4.0-modern
  3d:
    branch: vendor/3d-fd
    cmake_flags: ["HYPRE_DIR={repo_root}/extern/hypre/installed"]

executables:
  # ── 2D  (ref: regression-ref/v4.0-modern @ ac15e8f — post-cord-cut baseline) ───────
  # NOTE: the ZERO_PHASE build flag is retired — the seeded per-entry phase
  # draw is deterministic per compiler, so refs carry the seeded realization
  # (a deck may still set wavemaker zero_phase: for parity work).
  central:
    cmake_flags: []
    ref: 2d

  # ── 3D  (ref: vendor/3d-fd) ───────────────────────────────────────────
  central-3d:
    cmake_flags: []
    ref: 3d

  # ── 2D twin for the phase-seeding reproducibility guard; no ref branch
  #    (self-compares two dev runs).  Build-identical to central now the
  #    ZERO_PHASE flag is gone — merge candidate. ──────────────────
  central-random:
    cmake_flags: []

simulations:
  # preprocess (optional): command run in dev run dir before simulation.
  #   {input_file}  → the current txt file being processed
  #   {curr_input}  → auto-derived yaml output name ({stem}.yaml)
  #   {repo_root}   → absolute path to repo root
  #   {run_dir}     → absolute path to the run directory
  #   Use [uv, run, scripts/my_script.py, ...] for Python scripts.

  # ── flume_1d_reg: REG wavemaker — stats meaningful, kept for regression ──
  - name: flume_1d_reg
    exe_type: central
    input: test/regression/inputs/flume_1d
    input_files: [wk_reg.yaml]
    binary: funwave
    output_dir: output
    tags: [flume, 1d, smoke]
    postprocess:
      field: test.regression.postproc.field_compare
      statistics: test.regression.postproc.statistics_compare
    tolerances:
      # v, q omitted — near-zero in 1D periodic flume (Y-direction noise)
      field: { eta: 1.0e-4, u: 1.0e-3, h_max: 1.0e-4, h_min: 1.0e-4, u_max: 1.0e-3, mask: 1.0e-3, mask9: 1.0e-4, p_flux: 1.0e-4 }
      # vmean, vlagm omitted — same reason as v/q above
      statistics: { u_mean: 2.0e-2, eta_mean: 1.0e-4, hsig: 1.0e-4 }

  # ── flume_1d_irr: IRR wavemaker — code-path coverage only, no stats ──────
  # Stats (spectral shape, Hm0) belong in the validation framework.
  - name: flume_1d_irr
    exe_type: central
    input: test/regression/inputs/flume_1d
    input_files: [wk_irr.yaml]
    binary: funwave
    output_dir: output
    tags: [flume, 1d, smoke]
    postprocess:
      field: test.regression.postproc.field_compare
    tolerances:
      # v, q omitted — near-zero in 1D periodic flume (Y-direction noise)
      # mask9/p calibrated to measured floors (means 5.3e-4/1.6e-4, ledger-16 noise class)
      field: { eta: 1.0e-4, u: 1.0e-3, h_max: 1.0e-4, h_min: 1.0e-4, u_max: 1.0e-3, mask: 1.0e-3, mask9: 1.0e-3, p_flux: 5.0e-4 }

  # ── flume_1d_spectral: spectral wavemakers — code-path coverage only ─────
  # T_INTV_mean removed from inputs; spectral stats belong in validation.
  - name: flume_1d_spectral
    exe_type: central
    input: test/regression/inputs/flume_1d
    input_files: [jon_1d.yaml, tma_1d.yaml]
    binary: funwave
    output_dir: output
    tags: [flume, 1d, smoke]
    postprocess:
      field: test.regression.postproc.field_compare
    tolerances:
      # mask9/hmin calibrated to measured floors (ledger-16 noise class; tma_1d hmin mean 1.05e-4)
      field: { eta: 5.0e-4, u: 5.0e-3, h_max: 1.0e-4, h_min: 2.0e-4, u_max: 1.0e-3, mask: 2.0e-3, mask9: 1.0e-3, p_flux: 5.0e-4 }

  # flume_2d_wk_reg: wall BC (PERIODIC=F), oblique regular wave (Theta=20°).
  # Two variants: bare walls and walls + south/north sponge.
  # v/q/vmean/vlagm are now meaningful (oblique wave drives Y-momentum against wall).
  # Tolerances match flume_1d_wk_reg; wall reflection adds ~no extra FP spread for
  # regular waves since both ref and dev compile from the same commit.
  - name: flume_2d
    exe_type: central
    input: test/regression/inputs/flume_2d
    input_files: [wk_reg_wall.yaml, wk_reg_wall_sponge.yaml]
    binary: funwave
    output_dir: output
    tags: [flume, 2d]
    postprocess:
      field: test.regression.postproc.field_compare
      statistics: test.regression.postproc.statistics_compare
    tolerances:
      field: { eta: 1.0e-4, u: 1.0e-3, v: 1.0e-3, h_max: 1.0e-4, h_min: 1.0e-4, u_max: 1.0e-3, mask: 1.0e-3, mask9: 1.0e-4, p_flux: 1.0e-4, q_flux: 1.0e-3 }
      statistics: { u_mean: 2.0e-2, v_mean: 2.0e-2, eta_mean: 1.0e-4, hsig: 1.0e-4 }

  # flume_2d_irr: IRR wavemaker, PERIODIC=T, ThetaPeak=0 — code-path coverage only.
  # Tests PY=2 MPI decomp + Nglob=50 + wk_irr spectral wavemaker + 2D slope path.
  # v/q omitted — near-zero with ThetaPeak=0. Stats removed: spectral stats
  # belong in the validation framework, not regression.
  - name: flume_2d_irr
    exe_type: central
    # decomp pinned: this case exists to cover periodic-Y across ranks (PY>=2);
    # aspect auto-sizing collapses its 5:1 grid to PY=1. FUTURE: swap for a square
    # periodic domain so it keeps that coverage under pure auto-sizing, then drop the pin.
    decomp: [4, 2]
    input: test/regression/inputs/flume_2d
    input_files: [wk_irr_periodic.yaml]
    binary: funwave
    output_dir: output
    tags: [flume, 2d]
    postprocess:
      field: test.regression.postproc.field_compare
    tolerances:
      # v/q omitted — near-zero with ThetaPeak=0.
      field: { eta: 3.0e-3, u: 1.5e-2, h_max: 1.5e-3, h_min: 1.5e-3, u_max: 5.0e-3, mask: 2.0e-3, mask9: 3.0e-4, p_flux: 3.0e-3 }

  # solitary_flat_1d: INI_SOLITARY on flat bottom — wavemaker-free physics path.
  # Exercises core flux divergence (ESTIMATE_HUV else branch) + dispersion tridiagonal.
  # No sponge, no friction, PERIODIC=T so wave wraps; short run to verify mass conservation.
  # Deliberately kept on a legacy .txt deck — the standing convert_input.py guard
  # (all other cases run native YAML decks).
  - name: solitary_flat_1d
    exe_type: central
    input: test/regression/inputs/solitary_flat_1d
    input_files: [solitary_flat_1d.txt]
    preprocess:
      [
        uv,
        run,
        "{repo_root}/scripts/convert_input.py",
        "{input_file}",
        "{curr_input}",
      ]
    preprocess_ref: true
    binary: funwave
    output_dir: output
    tags: [solitary, 1d, smoke]
    postprocess:
      field: test.regression.postproc.field_compare
    tolerances:
      field: { eta: 1.0e-4, u: 1.0e-3, h_max: 1.0e-4, h_min: 2.0e-4, u_max: 1.0e-3, mask: 1.0e-4, p_flux: 1.0e-4 }

  # rip_2d: DATA bathymetry reader + y-varying 2D depth (rip channels, bar).
  # Cd=0.0 — clean bathy test; friction is a separate concern.
  # WK_IRR with VISCOSITY_BREAKING=F; DT_fixed=0.04 (finer DX=1m grid).
  # Short TOTAL_TIME=200s — code-path coverage only, not full rip development.
  # Stats removed: mean circulation belongs in validation framework.
  # eta calibrated to measured floor: legacy realization distance 7.5e-3 vs
  # fresh refs (legacy nondeterministic even at fixed dt, ledger 15).
  - name: rip_2d
    exe_type: central
    input: test/regression/inputs/rip_2d
    input_files: [rip_2d.yaml]
    binary: funwave
    output_dir: output
    tags: [2d, bathy]
    postprocess:
      field: test.regression.postproc.field_compare
    tolerances:
      field: { eta: 2.0e-2, u: 3.0e-2, v: 3.0e-2, h_max: 3.0e-3, h_min: 3.0e-3, u_max: 1.0e-2, mask: 2.0e-3 }

  # hotstart_{bouss,nswe}: checkpoint round-trip self-consistency (no ref branch).
  # A continuous run (0->T) and a checkpoint+restart pair (0->T/2, then restart
  # T/2->T) must leave the same end-of-run core.bin. Both legs run the dev binary
  # and the two core.bin files are self-compared (test.regression.postproc.checkpoint_compare).
  # Both are exactly bitwise (tol 0): the Boussinesq ~1e-7 ghost residual closed
  # with the ledger-18c quirk-drop (etat + mask9 ring = exchange(interior)).
  # decomp pinned [1,1]: the round-trip requires a fixed decomposition, and the
  # bitwise claim is np=1 — MPI-seam fws faces are still carried, not restored.
  - name: hotstart_bouss
    test_type: self_consistency
    exe_type: central
    input: test/regression/inputs/hotstart
    input_file: bouss.yaml
    decomp: [1, 1]
    binary: funwave
    tags: [hotstart, smoke]
    postprocess:
      field: test.regression.postproc.checkpoint_compare
    tolerances:
      field: { default: 0.0, mask: 0.0, mask9: 0.0 }

  - name: hotstart_nswe
    test_type: self_consistency
    exe_type: central
    input: test/regression/inputs/hotstart
    input_file: nswe.yaml
    decomp: [1, 1]
    binary: funwave
    tags: [hotstart, smoke]
    postprocess:
      field: test.regression.postproc.checkpoint_compare
    tolerances:
      field: { default: 0.0 }

  # wavemaker_repro_tma: deterministic phase-seed guard (ZERO_PHASE off).
  # Runs the irregular-TMA deck twice with the same dev binary and asserts the
  # two end-of-run core.bin files are BITWISE identical (tol 0). ny_proc=2 splits
  # the wavemaker strip across ranks, so it guards both run-to-run repeatability
  # and rank-consistency of the random phases. Regresses if the phase RNG loses
  # its deterministic, rank-uniform seed (seed_wave_phases).
  - name: wavemaker_repro_tma
    test_type: reproducibility
    exe_type: central-random
    input: test/regression/inputs/wavemaker_repro
    input_file: tma.yaml
    decomp: [1, 2]
    binary: funwave
    tags: [wavemaker, reproducibility, smoke]
    postprocess:
      field: test.regression.postproc.checkpoint_compare
    tolerances:
      field: { default: 0.0 }

  # stability_rip: no-reference stability sentinel for the swe_eta_ramp taper.
  # rip bathy (rows 1-400 of the scaled ripbig depth) pushed to the 2026-07
  # damping-mission tripping config (hm0 1.45, swe_eta_dep 0.6); the deck
  # engages the smoothstep taper (swe_eta_ramp 0.10) that must keep it stable —
  # a ramp regression collapses dt (min_dt) or blows up (run aborts), either
  # way failing the case.  exe_type central-random has no ref branch, so this
  # runs in oracle mode (single dev run; stability_check reads no ref).  decomp
  # pinned for a deterministic tripwire.
  - name: stability_rip
    exe_type: central-random
    input: test/regression/inputs/stability
    input_files: [stability_rip.yaml]
    decomp: [4, 2]
    binary: funwave
    output_dir: output
    tags: [stability, 2d]
    postprocess:
      stability: test.regression.postproc.stability_check
    # min_dt 0.006 sits between the healthy operating floor (dt settles at 0.01
    # on wheat/ifx under this forcing, 10/10 ensemble draws) and the blow-up
    # cascade (2.5e-3 by t~105, 10/10 hard-switch draws) — decomp-robust either
    # side.  0.011 would false-fail the healthy arm on ifx.
    tolerances:
      stability: { min_dt: 0.006, max_abs_eta: 30.0 }

  # stability_bank: no-reference lake-at-rest quiescence gate on a real-bathy
  # window of the Holland dx-1.5 grid (channel-bank sliver class, ledger entry
  # 21).  No forcing; the gate is the optional max_abs_vel arm of
  # stability_check — quiescent max|v| 0.036 m/s vs the m/s-scale self-excited
  # bank mode.  max_abs_eta 15.0 clears the static dry-land eta fill (12.87 m);
  # min_dt 0.05 sits under the CFL-settled 0.078.  Deck header documents why
  # this is a modern-only gate (the window does not reproduce the full-domain
  # legacy trip).
  - name: stability_bank
    exe_type: central-random
    input: test/regression/inputs/stability
    input_files: [stability_bank.yaml]
    decomp: [2, 2]
    binary: funwave
    output_dir: output
    tags: [stability, bank, 2d]
    postprocess:
      stability: test.regression.postproc.stability_check
    tolerances:
      stability: { min_dt: 0.05, max_abs_eta: 15.0, max_abs_vel: 0.15 }

  # channel_stats: no-reference oracle for the windowed channel products.
  # Fixed dt with the snapshot cadence EQUAL to dt, so postproc recomputes
  # the dt-weighted mean/std/hsig from the exact accumulator sample set
  # (float64) and asserts the engine's shifted-moment float32 products at
  # roundoff-level tolerance -- the durable replacement for the retired
  # means.f90 comparison target.
  - name: channel_stats
    exe_type: central-random
    input: test/regression/inputs/channel_stats
    input_files: [channel_stats.yaml]
    decomp: [2, 1]
    binary: funwave
    output_dir: output
    tags: [statistics, 2d]
    postprocess:
      channel_stats: test.regression.postproc.channel_stats_oracle
    tolerances:
      channel_stats: { rtol: 1.0e-4 }

  - name: standing_wave_3d_10m
    exe_type: central-3d
    # decomp pinned np=2 (PX=2|Mglob=100, PY=1 forced by Nglob=3). The pin is
    # about this case's size, not the solver: 100x3x24 = 7,200 cells leaves ~1,800
    # per rank at PX=2, and past that the run is halo and per-stage solver setup.
    # The solver itself does strong-scale on a realistic problem —
    # bench_decks/poisson_scale_3d (192x96x16, wheat/ifx, 2026-08-13) hits 4.1x at
    # np=16 and a 4.3x optimum at np=32, turning back up by np=64 — but parallel
    # efficiency still falls off hard (84% np=2, 46% np=8, 14% np=32) because
    # GMRES and the SMG preconditioner are rebuilt every RK stage. 2fb47bf
    # persisted only the grid/matrix/vector objects and left that curve unmoved.
    decomp: [2, 1]
    # the vendor ref reads ./input.txt only (no yaml, no argv): the legacy 10m
    # deck stays in the input dir under that name and stages with the run
    input: test/regression/inputs/standing_wave_3d
    input_files: [input_10m.yaml]
    binary: funwave
    output_dir: output
    tags: [3d]
    postprocess:
      field: test.regression.postproc.field_compare
      standing_wave: test.regression.postproc.standing_wave
    tolerances:
      field: { eta: 1.0e-5 }
      standing_wave: { period_error_pct: 15.0 }

