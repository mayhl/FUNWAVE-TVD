name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --group dev
      
      # Fortran formatting (blocking, post canonical reformat). fprettify 0.3.7 has
      # no --check, so gate on a non-empty -d diff. -d is diff-only; exclude legacy
      # old/ and the regression worktrees, matching fortitude.toml. Default indent 3.
      # -f overrides the extension list --recursive walks, which is the only way to
      # reach the pFUnit .pf tests; it replaces the defaults, so name every wanted
      # extension. Note the gate folds stderr into the diff, so an fprettify WARNING
      # (e.g. a line too long to indent) fails the build as loudly as real drift.
      - name: Check Fortran formatting
        run: |
          diff=$(uv run fprettify -d --recursive src/ test/ -e old -e worktrees -f .f90 -f .F90 -f .pf 2>&1) || true
          if [ -n "$diff" ]; then
            printf '%s\n' "$diff"
            echo "::error::fprettify formatting drift; run: fprettify --recursive src/ test/ -e old -e worktrees -f .f90 -f .F90 -f .pf"
            exit 1
          fi

      # Fortran lint (advisory: fortitude reads fortitude.toml, incl. its excludes)
      - name: Lint Fortran (advisory)
        continue-on-error: true
        run: uv run --with fortitude-lint==0.9.0 fortitude check

      # Python
      - name: Check Python formatting
        run: uv run ruff format --check
      
      # CMake
      - name: Check CMake formatting
        run: uv run cmake-format --check $(find . -name "CMakeLists.txt" -o -name "*.cmake" -not -path "*/.*")
      
      # Markdown
      - name: Check Markdown formatting
        run: npx prettier --check "**/*.md"
      
      # Shell
      - name: Check Shell formatting
        run: uv run shfmt -d .
