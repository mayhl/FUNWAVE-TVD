name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --group dev
      
      # Fortran formatting (advisory: fprettify 0.3.7 has no --check and cannot
      # preserve the current manual column alignment; blocking is deferred until a
      # one-time canonical reformat. -d is diff-only; exclude legacy old/ and the
      # regression worktrees, matching fortitude.toml.)
      - name: Check Fortran formatting (advisory)
        continue-on-error: true
        run: |
          diff=$(uv run fprettify -d --recursive src/ test/ -e old -e worktrees 2>&1) || true
          if [ -n "$diff" ]; then
            printf '%s\n' "$diff"
            echo "::warning::fprettify would reformat the files above (advisory, not blocking)"
            exit 1
          fi

      # Python
      - name: Check Python formatting
        run: uv run ruff format --check
      
      # CMake
      - name: Check CMake formatting
        run: uv run cmake-format --check $(find . -name "CMakeLists.txt" -o -name "*.cmake" -not -path "*/.*")
      
      # Markdown
      - name: Check Markdown formatting
        run: npx prettier --check "**/*.md"
      
      # Shell
      - name: Check Shell formatting
        run: uv run shfmt -d .
