[check]
# Enable all categories: Conventions (C), Errors (E), Style (S)
select = ["C", "E", "S"]

# We ignore specific legacy-heavy checks for now, but keep them listed
# so you can enable them one-by-one as you refactor src/old/
ignore = [
  "S001", # Ignore: archaic features (enable later)
  "S082", # Ignore: legacy constructs
  "S091"  # Ignore: fixed-form/legacy style
]

# Set a line length that accommodates modern wide monitors
# but discourages "spaghetti" logic inside single lines
line-length = 100

[format]
indentation = 2
whitespace = true
align-keywords = true
# Ensure Fortran modules are always indented
indent-modules = true

[files]
# Tell fortitude to focus on modern extensions 
# and ignore the legacy files that are currently too messy
exclude = [
  "src/old/**/*.F",
  "build_*/",
  "test/regression/worktrees/"
]
