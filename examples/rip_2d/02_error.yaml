# rip_2d — 2/5: deliberate config error (loud-rejection demo)
#
# The reader rejects retired or unknown keys with an actionable message
# instead of silently ignoring them.  This deck carries the retired legacy
# stations: block; expect an immediate abort at read time:
#
#   ERROR: output: stations: retired -- use channels: with a station geometry
#          (x/y in metres; legacy i j maps to x = (i-1)*dx, y = (j-1)*dy)
#
# Run:  mpirun -n 4 <funwave> 02_error.yaml     (exits nonzero, no output/)

grid:
  cell_size: [1.0, 2.0]
  n_cells: [512, 250]
  bathymetry:
    type: file
    file: data/depth_a15.txt

simulation:
  title: rip_2d_error
  total_time: 200.0
  screen_interval: 20.0

wavemaker:
  spectrum:
    type: tma
    hm0: 1.0
    gamma: 5.0
    freq:
      peak: 0.1
      min: 0.03
      max: 0.5
    directional:
      peak: 0.0
      spread: 10.0
    discretization:
      freq_bins: 45
      theta_bins: 24
  source:
    x_center: 425.0
    y_center: 0.0
    depth: 13.0

boundaries:
  east:
    sponge:
      width: 60.0
      direct:
        r: 0.85
        a: 5.0
      friction:
        cd: 1.0
  periodic: [y]

breaking:
  model: shock_capturing

output:
  interval: 20.0
  depth_out: true
  variables: [ETA]
  stations: # <- retired block: triggers the abort
    file: stations.txt
    interval: 0.05
