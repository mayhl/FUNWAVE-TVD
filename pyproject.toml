
[project]
name = "FUNWAVE-TVD"
version = "4.0-beta"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "numpy>=2.2.6",
    "weasyprint>=68.1",
    "plotly>=6.7.0",
    "kaleido>=1.3.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-bibtex>=4.4.0",
    "pymdown-extensions>=10.21.3",
    "mkdocs-swan>=0.4.0",
    "matplotlib>=3.10.9",
    "mike>=2.1.3",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "build_*",
    "test/regression/worktrees/*",
    # local scratch, never tracked
    ".parity",
    ".sweep",
    "Testing",
    "bench_decks",
    "bench_plots",
    "examples_FD",
]

# Same as Black.
line-length = 132

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings by default.
select = [
    "E4", "E7", "E9", "F", # Pyflakes, Pycodestyle E4, E7, E9
    "I",                   # isort
    "N",                   # pep8-naming
    "D",                   # pydocstyle
    "UP",                  # pyupgrade
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # magic methods and __init__ carry no docstring
    "D107",
    "D203", # the D211/D212 side of the two incompatible pairs
    "D213",
    "D205", # summaries are noun phrases that may wrap, not imperative one-liners
    "D401",
]

[tool.ruff.lint.per-file-ignores]
# docstrings are gated on the library-like code (tools/, test/framework/);
# tests, oracles, postproc and one-off scripts are exempt
"test/unit/**" = ["D"]
"test/validation/**" = ["D"]
"test/regression/**" = ["D"]
"test/python/**" = ["D"]
"test/__init__.py" = ["D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]
# wave notation (Hm0, Tp, L, k) in the oracles and postproc
"test/validation/oracles/**" = ["N803", "N806"]
"test/regression/postproc/**" = ["N803", "N806"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[dependency-groups]
dev = [
    "cmake-format>=0.6.13",
    "fprettify>=0.3.7",
    "netcdf4>=1.7",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["test/python"]
# the repo's `test` package must shadow the stdlib one, as it does under
# `python -m test.framework.cli` from the repo root
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff.lint.isort]
known-first-party = ["test"]

# NOTE: cmake-format and shfmt do NOT read pyproject.toml; these tables are inert.
# The live settings are the CLI args in .github/workflows/lint.yml. Kept here only to
# record intent until wired via each tool's own config (-c / .cmake-format / etc.).
[tool.cmake-format]
line_width = 132
tab_size = 2

[tool.shfmt]
indent = 2

