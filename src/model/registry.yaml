  # ── vessel (legacy mod_vessel.F) ───────────────────────────────────────────
  # One vessel_NNNNN file per hull (geometry, propeller specs, and the time/x/y
  # track) lives in VESSEL_FOLDER, not here: registry v1 is flat and cannot
  # express a list.  Both engines read those files, so they are the parity-shared
  # input.
  #
  # PROPELLER and DEEP_DRAFT_VESSEL are cpp flags in legacy; the modern engine is
  # not preprocessed, so they become runtime switches.  The io.F bridge checks
  # them against the legacy build flags and stops on a mismatch, so a modern
  # `propeller: true` against a binary built without -DPROPELLER cannot silently
  # score as parity.
  # deep_draft is a presence block (nee the DEEP_DRAFT bool): clearance is its
  # required key (an empty block dumps as YAML null and reads as absent); cd
  # presence = hull drag (nee FrictionMethod + CdDeepDraft), nu presence = hull
  # eddy viscosity (nee ViscosityMethod + VisDeepDraft).  NOTE: legacy defaults
  # FrictionMethod on, so the converter emits cd explicitly; a hand-authored
  # block without cd runs drag-free.  OUT_VESSEL/PLOT_INTV_VESSEL stay
  # legacy-spelled until the rung-5 output move.
  - name:         vessel_folder
    legacy_name:  VESSEL_FOLDER
    yaml_path:    "vessel.folder"
    units:        ~
    default:      ~
    latex:        ~

