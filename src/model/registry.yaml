    legacy_name:  ~
    yaml_path:    "wavemaker.name"
    units:        ~
    default:      ~
    latex:        ~

  - name:         spectrum_type
    legacy_name:  WAVEMAKER
    yaml_path:    "wavemaker.spectrum.type"
    units:        ~
    default:      ~
    latex:        ~

  - name:         wm_amplitude
