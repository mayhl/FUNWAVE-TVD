# FUNWAVE Variable and Parameter Registry
#
# variables: field arrays output to NetCDF/binary.
#   Required: name, legacy_name, long_name, standard_name, units, fill_value, latex
#   standard_name: empty string if no CF match exists.
#   funwave_name:  required when standard_name is ""; follows CF naming style
#                  (lowercase, underscores, physical description) so future CF
#                  migration is obvious. Omit when standard_name is non-empty.
#                  Written as its own attribute, never as standard_name.
#   flag_values / flag_meanings: optional CF 3.5 coded-value pair for a flag
#                  variable (values as reals, meanings space-separated, same
#                  count); long_name stays a plain phrase.
#   comment:       optional CF 2.6.2 free text (semantics, method, caveats),
#                  written as the variable's comment attribute.
#
# sections: hierarchical metadata catalog for config keys (legacy name, default,
#   units, latex, values, doc).  See the sections: header below.
#
# Neither html descriptions, latex, nor funwave_name are written to NetCDF variable attrs.
# funwave_name IS written as a global attr on simulation.nc for variable inventory.
# NetCDF variable attr allowlist: {long_name, standard_name, units, fill_value, grid_mapping}.

variables:

  # ── Primary prognostic fields ──────────────────────────────────────────────
  - name:           eta
    legacy_name:    ETA
    long_name:      "free surface elevation"
    standard_name:  "sea_surface_height_above_mean_sea_level"
    units:          "m"
    fill_value:     -9999.0
    latex:          "$\\eta$"

  - name:           u
    legacy_name:    U
    long_name:      "depth-averaged x-velocity"
    standard_name:  "eastward_sea_water_velocity"
    units:          "m s-1"
    fill_value:     -9999.0
    latex:          "$u$"

  - name:           v
    legacy_name:    V
    long_name:      "depth-averaged y-velocity"
    standard_name:  "northward_sea_water_velocity"
    units:          "m s-1"
    fill_value:     -9999.0
    latex:          "$v$"

  # NOTE: field-registry names (code p/q = Ubar); legacy P/Q are the
  # interface fluxes the output layer registers as p_flux/q_flux
  - name:           p_flux
    legacy_name:    P
    long_name:      "x-component of depth-integrated volume flux"
    standard_name:  ""
    funwave_name:   "sea_water_x_volume_flux"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$P = Hu$"

  - name:           q_flux
    legacy_name:    Q
    long_name:      "y-component of depth-integrated volume flux"
    standard_name:  ""
    funwave_name:   "sea_water_y_volume_flux"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$Q = Hv$"

  # ── Depth / bathymetry ─────────────────────────────────────────────────────
  - name:           depth
    legacy_name:    Depth
    long_name:      "still-water depth"
    standard_name:  "sea_floor_depth_below_mean_sea_level"
    units:          "m"
    fill_value:     -9999.0
    latex:          "$d$"

  - name:           h
    legacy_name:    H
    long_name:      "total water depth"
    standard_name:  "sea_floor_depth_below_sea_surface"
    units:          "m"
    fill_value:     -9999.0
    latex:          "$H = \\eta + d$"

  # ── Masks ──────────────────────────────────────────────────────────────────
  - name:           mask
    legacy_name:    MASK
    long_name:      "wet/dry mask"
    standard_name:  ""
    funwave_name:   "sea_water_wet_binary_mask"
    units:          "1"
    fill_value:     -9999.0
    flag_values:    [0, 1]
    flag_meanings:  "dry wet"
    latex:          "$m$"

  - name:           mask9
    legacy_name:    MASK9
    long_name:      "wet/dry mask on the 3x3 stencil"
    standard_name:  ""
    funwave_name:   "sea_water_3x3_wet_binary_mask"
    units:          "1"
    fill_value:     -9999.0
    flag_values:    [0, 1]
    flag_meanings:  "dry wet"
    latex:          "$m_9$"

  # ── Instantaneous diagnostics (their envelopes are running-max channels) ──
  - name:           vorticity
    legacy_name:    ~
    long_name:      "relative vorticity of the depth-averaged flow"
    standard_name:  "ocean_relative_vorticity"
    units:          "s-1"
    fill_value:     -9999.0
    latex:          "$\\omega$"

  # breaker type: surf-similarity numbers, thresholds left to postprocessing.
  # xi_0 is static (bed slope, the wavemakers' offshore wave, refreshed after
  # a bed change); the other three capture at each breaking onset (the
  # rising edge of the active-dissipation flag) and hold the last event.
  - name:           xi_0
    legacy_name:    ~
    long_name:      "offshore surf similarity parameter"
    standard_name:  ""
    funwave_name:   "surf_similarity_parameter_offshore"
    units:          "1"
    fill_value:     -9999.0
    comment:        "bed slope / sqrt(H0 / L0); H0, T from the wavemakers (2a and T, or Hm0 and T_m-1,0), L0 = g T^2 / 2 pi"
    latex:          "$\\xi_0$"

  - name:           xi_b
    legacy_name:    ~
    long_name:      "breaker surf similarity parameter"
    standard_name:  ""
    funwave_name:   "surf_similarity_parameter_at_breaking"
    units:          "1"
    fill_value:     -9999.0
    comment:        "slope / sqrt(H_b / L0) at the last onset, H_b = envelope height; fill before the first (always under shock)"
    latex:          "$\\xi_b$"

  - name:           gamma_b
    legacy_name:    ~
    long_name:      "breaker index"
    standard_name:  ""
    funwave_name:   "breaker_height_to_depth_ratio"
    units:          "1"
    fill_value:     -9999.0
    comment:        "H_b over (still depth + envelope mid-level) at the last breaking onset; fill until the first onset"
    latex:          "$\\gamma_b$"

  - name:           front_steepness
    legacy_name:    ~
    long_name:      "peak surface rise rate over the shallow-water celerity"
    standard_name:  ""
    funwave_name:   "peak_breaking_front_rise_rate_over_shallow_water_celerity"
    units:          "1"
    fill_value:     -9999.0
    comment:        "max of eta_t / sqrt(g h) over the last breaking event (breaking.cbrk1/cbrk2 gate this); fill until the first"
    latex:          "$\\max \\eta_t / \\sqrt{gh}$"

  # vertical structure (nee the legacy AB_OUTPUT files Ax/Ay/Bx/By): the
  # velocity profile u(z) = u + (z_a - z) grad A + (z_a^2 - z^2)/2 grad B with
  # A = div(h u), B = div u, z_a = (1 + beta_ref) eta + beta_ref h
  - name:           a
    legacy_name:    ~
    long_name:      "divergence of the depth-integrated velocity"
    standard_name:  ""
    funwave_name:   "divergence_of_depth_integrated_velocity"
    units:          "m s-1"
    fill_value:     -9999.0
    comment:        "A = div(h u), h the still-water depth; w(z) = -A - z B to leading order"
    latex:          "$A$"

  - name:           b
    legacy_name:    ~
    long_name:      "divergence of the depth-averaged velocity"
    standard_name:  ""
    funwave_name:   "divergence_of_depth_averaged_velocity"
    units:          "s-1"
    fill_value:     -9999.0
    comment:        "B = div u; see a for the vertical velocity"
    latex:          "$B$"

  - name:           a_x
    legacy_name:    ~
    long_name:      "x-gradient of the depth-integrated velocity divergence"
    standard_name:  ""
    funwave_name:   "x_derivative_of_divergence_of_depth_integrated_velocity"
    units:          "s-1"
    fill_value:     -9999.0
    comment:        "A = div(h u); u(z) = u + (z_a - z) a_x + (z_a^2 - z^2)/2 b_x, z_a = (1 + beta_ref) eta + beta_ref h"
    latex:          "$A_x$"

  - name:           a_y
    legacy_name:    ~
    long_name:      "y-gradient of the depth-integrated velocity divergence"
    standard_name:  ""
    funwave_name:   "y_derivative_of_divergence_of_depth_integrated_velocity"
    units:          "s-1"
    fill_value:     -9999.0
    comment:        "A = div(h u); v(z) = v + (z_a - z) a_y + (z_a^2 - z^2)/2 b_y, z_a = (1 + beta_ref) eta + beta_ref h"
    latex:          "$A_y$"

  - name:           b_x
    legacy_name:    ~
    long_name:      "x-gradient of the velocity divergence"
    standard_name:  ""
    funwave_name:   "x_derivative_of_divergence_of_depth_averaged_velocity"
    units:          "m-1 s-1"
    fill_value:     -9999.0
    comment:        "B = div u; see a_x for the profile"
    latex:          "$B_x$"

  - name:           b_y
    legacy_name:    ~
    long_name:      "y-gradient of the velocity divergence"
    standard_name:  ""
    funwave_name:   "y_derivative_of_divergence_of_depth_averaged_velocity"
    units:          "m-1 s-1"
    fill_value:     -9999.0
    comment:        "B = div u; see a_y for the profile"
    latex:          "$B_y$"

  - name:           momentum_flux
    legacy_name:    ~
    long_name:      "depth-integrated momentum flux magnitude"
    standard_name:  ""
    funwave_name:   "depth_integrated_momentum_flux_magnitude"
    units:          "m3 s-2"
    fill_value:     -9999.0
    latex:          "$h |\\mathbf{u}|^2$"
  # ── prognostic fluxes and the vector-derived output names ───────────────
  # p/q are always registered (never demand-gated) and velocity.mag/.dir are
  # synthesised per step, but none was declared, so all four wrote with no CF
  # attributes.  NOTE the direction convention: vec_dir = atan2(v, u) in
  # DEGREES, i.e. counterclockwise from +x -- NOT a compass bearing, so CF's
  # direction_of_sea_water_velocity would be a mislabel and is deliberately
  # not claimed here.
  - name:           p
    legacy_name:    Ubar
    long_name:      "x depth-integrated volume flux"
    standard_name:  ""
    funwave_name:   "eastward_depth_integrated_volume_flux_per_unit_width"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$P = Hu$"

  - name:           q
    legacy_name:    Vbar
    long_name:      "y depth-integrated volume flux"
    standard_name:  ""
    funwave_name:   "northward_depth_integrated_volume_flux_per_unit_width"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$Q = Hv$"

  - name:           velocity.mag
    legacy_name:    ~
    long_name:      "depth-averaged sea water speed"
    standard_name:  "sea_water_speed"
    units:          "m s-1"
    fill_value:     -9999.0
    latex:          "$|\\mathbf{u}|$"

  - name:           velocity.dir
    legacy_name:    ~
    long_name:      "current direction, CCW from +x axis"
    standard_name:  ""
    funwave_name:   "depth_averaged_current_direction_from_x_axis"
    units:          "degree"
    fill_value:     -9999.0
    latex:          "$\\theta_u$"

  # ── breaker diagnostics + remaining running maxima ──────────────────────
  # Registerable and deck-selectable via derive_demand_flags, but undeclared
  # until now, so they wrote with NO CF attributes.  Units taken from the
  # definitions, not from the names: roller_flux and undertow_* are
  # depth-integrated fluxes (m2 s-1), NOT velocities, despite "undertow".
  - name:           nu_break
    legacy_name:    nu_break
    long_name:      "breaking eddy viscosity"
    standard_name:  ""
    funwave_name:   "breaking_eddy_viscosity"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$\\nu_{\\mathrm{brk}}$"

  - name:           age_break
    legacy_name:    AGE_BREAKING
    long_name:      "age of the local breaking event"
    standard_name:  ""
    funwave_name:   "breaking_event_age"
    units:          "s"
    fill_value:     -9999.0
    latex:          "$t_{\\mathrm{age}}$"

  - name:           roller_flux
    legacy_name:    ROLLER_FLUX
    long_name:      "surface roller volume flux per unit width"
    standard_name:  ""
    funwave_name:   "surface_roller_volume_flux_per_unit_width"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$q_r$"

  - name:           undertow_u
    legacy_name:    UNDERTOW_U
    long_name:      "x-component of the roller-driven return flux per unit width"
    standard_name:  ""
    funwave_name:   "eastward_roller_return_volume_flux_per_unit_width"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$q_{u,\\mathrm{under}}$"

  - name:           undertow_v
    legacy_name:    UNDERTOW_V
    long_name:      "y-component of the roller-driven return flux per unit width"
    standard_name:  ""
    funwave_name:   "northward_roller_return_volume_flux_per_unit_width"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$q_{v,\\mathrm{under}}$"

  # ── Gate fields ──────────────────────────────────────────────────────────
  # 0/1 flags or the applied weight, sampled from the last RK stage of the
  # step; a statistics channel gives the duty fraction (mean) and
  # ever-tripped (max) per interval.  wet_fraction = mean of mask.
  - name:           breaking_active
    legacy_name:    ~
    long_name:      "breaker viscosity active flag"
    standard_name:  ""
    funwave_name:   "breaking_eddy_viscosity_active_flag"
    units:          "1"
    fill_value:     -9999.0
    flag_values:    [0, 1]
    flag_meanings:  "inactive active"
    comment:        "nu_break above breaking.nu_bkg at the last stage, the wavemaker-zone term included"
    latex:          "$\\chi_{\\mathrm{brk}}$"

  - name:           nu_capped
    legacy_name:    ~
    long_name:      "breaker viscosity cap engaged flag"
    standard_name:  ""
    funwave_name:   "breaking_eddy_viscosity_cap_engaged_flag"
    units:          "1"
    fill_value:     -9999.0
    flag_values:    [0, 1]
    flag_meanings:  "uncapped capped"
    comment:        "nu_break sitting at the breaking.nu_cap explicit-diffusion clamp at the last stage"
    latex:          "$\\chi_{\\nu,\\mathrm{cap}}$"

  - name:           froude_scale
    legacy_name:    ~
    long_name:      "Froude cap velocity scale factor"
    standard_name:  ""
    funwave_name:   "froude_cap_velocity_scale_factor"
    units:          "1"
    fill_value:     -9999.0
    comment:        "factor applied to the velocity by numerics.froude_cap at the last stage; 1 = untouched"
    latex:          "$s_{\\mathrm{Fr}}$"

  - name:           disp_gate
    legacy_name:    ~
    long_name:      "dispersion gate weight"
    standard_name:  ""
    funwave_name:   "dispersion_gate_weight"
    units:          "1"
    fill_value:     -9999.0
    comment:        "dispersive-term multiplier: 1 = fully dispersive, 0 = shallow-water; SWE, wet/dry and slope tapers"
    latex:          "$w_{\\mathrm{disp}}$"


# ═══════════════════════════════════════════════════════════════════════════════
# sections — hierarchical metadata tree (registry v2)
# ═══════════════════════════════════════════════════════════════════════════════
#
# A DESCRIPTIVE catalog of every config key, mirroring the deck tree — NOT a schema
# code is generated from.  The code (the hand-written readers) is the source of
# truth for structure and validation; this tree only annotates it with the metadata
# the code does not carry (legacy name, default, units, latex, doc).  Two consumers:
#   * readability / de-dup — variant + per-face structure written once;
#   * docs + example-config generation per section and per variant.
# Nothing is generated from this tree but docs/guide/config_reference.md: each
# reader carries its default as the literal at the read site, and
# gen_registry.py --check fails when a literal and this tree disagree.
#
# Per-key metadata (all descriptive):
#   legacy   mod_global.F name for the input.txt converter (~ if none)
#   default  what the reader falls back to (~ = presence-derived)
#   units    null (~) if dimensionless; else a CF unit string
#   latex    terminal/Doxygen label (~ if none)
#   values   documented value set for docs/examples (NOT validated here — the
#            reader validates; this is the option list the docs should show)
#   doc      one-line human description for generated docs
#
# Per-face sections (boundaries) use `per_face:` so a face's keys are written
# once and expanded across faces ({face}/{Face}/{F} templating + overrides).
# A key may carry a dotted deck sub-path (wavemaker spectrum.freq.peak); a
# `variant:` tag documents which discriminant value a key belongs to.

sections:

  # ── wavemaker (spectrum shape x discretization x source) ────────────────────
  wavemaker:
    doc: >-
      Wave generation: a spectrum (shape x discretization) feeding a Wei-Kirby
      internal source box or a boundary signal.  spectrum.type discriminates the
      shape; source:/limiter: presence enables the source box / eta limiter.
      Entry is a mapping or a 1-element sequence (multi-wavemaker pending).  Keys
      carry their deck sub-path; `variant:` tags which spectrum.type a shape key
      belongs to (untagged keys apply regardless, e.g. source/limiter).
    keys:
      name: { legacy: ~, default: ~, units: ~, doc: "Name (referenced by boundaries.<face>.forcing.wavemaker)." }
      seed: {advanced: true, legacy: ~, default: 66, units: ~, doc: "Phase-RNG seed for the random spectral realization (reproducible + restart-coherent; entries offset by index)." }
      zero_phase: {advanced: true, legacy: ~, default: false, units: ~, doc: "Zero every component phase instead of the seeded draw (parity/regression builds)." }
      spectrum.type:
        { legacy: WAVEMAKER, default: ~, units: ~, values: [regular, cnoidal, jonswap, tma, spectrum_2d, components], doc: "Spectrum shape discriminant." }
      spectrum.amplitude: { legacy: AMP_WK, default: 0.0, units: m, latex: "$a$", variant: [regular, cnoidal], doc: "Monochromatic wave amplitude (cnoidal: H/2; the profile is expanded into its harmonics)." }
      spectrum.period: { legacy: Tperiod, default: 0.0, units: s, latex: "$T$", variant: [regular, cnoidal], doc: "Monochromatic wave period." }
      spectrum.direction: { legacy: Theta_WK, default: 0.0, units: deg, latex: "$\\theta$", variant: [regular, cnoidal], doc: "Monochromatic wave direction (cnoidal: 0 only)." }
      spectrum.hm0: { legacy: Hmo, default: 0.0, units: m, latex: "$H_{m0}$", variant: [jonswap, tma], doc: "Significant wave height (total eta)." }
      spectrum.gamma: { legacy: GammaTMA, default: 3.3, units: ~, latex: "$\\gamma$", variant: [jonswap, tma], doc: "Peak enhancement factor." }
      spectrum.normalize:
        {advanced: true, legacy: ~, default: band, units: ~, values: [band, total], variant: [jonswap, tma], doc: "Hm0 normalization: band renormalizes the truncated [min, max] band to carry the full Hm0 (legacy); total keeps the band's natural share of the full-spectrum integral." }
      spectrum.freq.peak: { legacy: FreqPeak, default: 0.0, units: Hz, latex: "$f_p$", variant: [jonswap, tma], doc: "Peak frequency (exact legacy path)." }
      spectrum.freq.min: { legacy: FreqMin, default: 0.0, units: Hz, variant: [jonswap, tma], doc: "Minimum frequency." }
      spectrum.freq.max: { legacy: FreqMax, default: 0.0, units: Hz, variant: [jonswap, tma], doc: "Maximum frequency." }
      spectrum.period.peak: { legacy: ~, default: ~, units: s, latex: "$T_p$", variant: [jonswap, tma], doc: "Hand-authoring alt to freq.peak (reciprocal; mutually exclusive)." }
      spectrum.period.min: { legacy: ~, default: ~, units: s, variant: [jonswap, tma], doc: "Alt to freq.max (note the min<->max swap)." }
      spectrum.period.max: { legacy: ~, default: ~, units: s, variant: [jonswap, tma], doc: "Alt to freq.min." }
      spectrum.directional.peak: { legacy: ThetaPeak, default: 0.0, units: deg, variant: [jonswap, tma], doc: "Mean direction (presence => 2D spreading)." }
      spectrum.directional.spread: { legacy: Sigma_Theta, default: ~, units: deg, variant: [jonswap, tma], doc: "Directional spread (required -- the block's presence means spreading is wanted)." }
      spectrum.discretization.freq_bins: {advanced: true, legacy: Nfreq, default: 45, units: ~, variant: [jonswap, tma], doc: "Frequency bin count." }
      spectrum.discretization.theta_bins: {advanced: true, legacy: Ntheta, default: 24, units: ~, variant: [jonswap, tma], doc: "Directional bin count (requires a directional: block; 1D runs force 1)." }
      spectrum.discretization.equal_energy: {advanced: true, legacy: EqualEnergy, default: none, units: ~, values: [none, freq, dir, both], variant: [jonswap, tma], doc: "Equal-energy binning per axis; the legacy boolean spellings still read as none/freq." }
      spectrum.discretization.method:
        {advanced: true, legacy: ~, default: grid, units: ~, values: [grid, single_dir_per_freq], variant: [jonswap, tma], doc: "Discretization method: directional grid, or one direction per frequency component (nee WK_NEW_*)." }
      spectrum.discretization.coherence_percent: {advanced: true, legacy: ~, default: 0.0, units: "%", variant: [jonswap, tma, spectrum_2d], doc: "Directional-phase coherence: percent by which a frequency's directions share a phase (0 = independent, realistic sea; 100 = the legacy fully-coherent collapse)." }
      spectrum.discretization.group_coherence: {advanced: true, legacy: alpha_c, default: 0.0, units: "%", variant: [jonswap, tma], doc: "Salatin frequency-grouping coherence: percent of components sharing a frequency (single_dir_per_freq only)." }
      spectrum.file: { legacy: WaveCompFile, default: ~, units: ~, variant: [components, spectrum_2d], doc: "Wave-component / 2D-spectrum data file." }
      spectrum.locations: { legacy: ~, default: ~, units: ~, variant: [spectrum_2d], doc: "Manifest of along-face anchor spectra (`<coord> file` per line; coordinate all-or-none, omitted => equispaced) for a spatially-varying boundary feed; mutually exclusive with spectrum.file." }
      spectrum.convention: { legacy: ~, default: local, units: ~, values: [local, cartesian, nautical], variant: [jonswap, tma, spectrum_2d], doc: "Boundary-feed direction frame: local (theta=0 is the fed face inward normal), cartesian (theta=0 is grid +x), nautical (azimuth CW from true North via grid.crs; pending)." }
      spectrum.n: { legacy: NumWaveComp, default: 1, units: ~, variant: [components], doc: "Number of wave components." }
      spectrum.period_peak: { legacy: PeakPeriod, default: 0.0, units: s, latex: "$T_p$", variant: [components], doc: "Peak period (components store a period here)." }
      spectrum.format: { legacy: WAVE_DATA_TYPE, default: DATA_1D, units: ~, variant: [spectrum_2d], doc: "2D-spectrum data format." }
      source.x_center: { legacy: Xc_WK, default: 0.0, units: m, latex: "$x_c$", doc: "Source-box x center (presence of source: => Wei-Kirby)." }
      source.y_center: { legacy: Yc_WK, default: 0.0, units: m, latex: "$y_c$", doc: "Source-box y center." }
      source.depth: { legacy: DEP_WK, default: 0.0, units: m, doc: "Source-box reference depth; absent = the bed mean under the box, refused unless the bed there is flat within 1 %." }
      source.delta: {advanced: true, legacy: Delta_WK, default: 0.5, units: ~, latex: "$\\delta$", doc: "Source-box width parameter." }
      source.y_width: { legacy: Ywidth_WK, default: 999999.0, units: m, doc: "Source-box alongshore width (large = full span)." }
      source.time_ramp: { legacy: Time_ramp, default: 0.0, units: s, doc: "Source ramp-up time." }
      source.current_cd: {advanced: true, legacy: WaveMakerCd, default: ~, units: ~, doc: "Current-balance drag (presence enables; nee WaveMakerCurrentBalance)." }
      source.breaking.cbrk: {advanced: true, legacy: WAVEMAKER_Cbrk, default: 1.0, units: ~, latex: '$C_{\mathrm{brk,wm}}$', doc: "Zone breaking-onset coefficient (Cbrk family vs sqrt(gH), not a scale on cbrk1)." }
      source.breaking.visbrk: {advanced: true, legacy: WAVEMAKER_visbrk, default: 0.0, units: m2 s-1, latex: '$\nu_{\mathrm{brk,wm}}$', doc: "Zone breaking-viscosity coefficient." }
      limiter.crest: {advanced: true, legacy: CrestLimit, default: ~, units: m, doc: "Crest elevation limit (nee ETA_LIMITER). Read and stored; the clamp itself is not ported, so the key has no effect yet." }
      limiter.trough: {advanced: true, legacy: TroughLimit, default: ~, units: m, doc: "Trough elevation limit; same standing as limiter.crest." }

  # ── boundaries (per-face de-dup) ───────────────────────────────────────────
  boundaries:
    doc: >-
      Per-face boundary conditions.  The reader DERIVES each face's BC from which
      blocks are present (nothing -> wall; sponge only -> wall + absorbing strip;
      sponge.direct + forcing -> relaxation to a signal; forcing without direct ->
      characteristic, pending).  type: is an optional assertion.
    keys:
      periodic:
        legacy: PERIODIC
        default: ~
        units: ~
        doc: "Axis-level periodic pair list, x and/or y (e.g. [y] or [x, y])."
      # relaxation_cells retired (rung 11): the face sponge width (m) sizes
      # the forcing relaxation strip -- nee WaveMakerPointNum, 30 cells
      # shared sponge coefficients: every face sponge inherits these PER-KEY
      # (a face sub-block overrides only the keys it states); a mechanism
      # block present here turns that mechanism on for every face sponge.
      # Face mechanism keys also take a boolean: on = enable with the
      # inherited/default coefficients, off = opt out of the shared template
      sponge.direct.r: {advanced: true, legacy: ~, default: ~, units: ~, latex: '$R_s$', doc: "Shared direct-sponge damping ratio all face sponges inherit."}
      sponge.direct.a: {advanced: true, legacy: ~, default: ~, units: ~, latex: '$A_s$', doc: "Shared direct-sponge damping exponent."}
      sponge.friction.cd: {advanced: true, legacy: ~, default: ~, units: ~, doc: "Shared friction-sponge drag coefficient."}
      sponge.diffusion.nu: {advanced: true, legacy: ~, default: ~, units: 'm2 s-1', doc: "Shared diffusion-sponge viscosity."}
    per_face:
      faces: [west, east, south, north] # {face}=west  {Face}=West  {F}=W
      keys:
        type:
          legacy: ~
          default: ~
          units: ~
          doc: "Optional BC assertion; errors at init if it disagrees with the derived BC."
        sponge.width:
          legacy: "Sponge_{face}_width"
          default: 0.0
          units: "m"
          latex: "$W_{s,{F}}$"
          doc: "Absorbing sponge strip width (0 = no sponge). On a forced or wavemaker-fed face this also sizes the relaxation strip (cells = width/dx at init)."
        sponge.direct.r:
          advanced: true
          legacy: R_sponge
          default: 0.85
          units: ~
          latex: "$R_s$"
          doc: "Direct-sponge damping ratio."
        sponge.direct.a:
          advanced: true
          legacy: A_sponge
          default: 5.0
          units: ~
          latex: "$A_s$"
          doc: "Direct-sponge damping exponent."
        sponge.friction.cd:
          advanced: true
          legacy: CDsponge
          default: 0.0
          units: ~
          latex: "$C_{d,s}$"
          doc: "Sponge bottom-friction coefficient."
        sponge.diffusion.nu:
          advanced: true
          legacy: Csp
          default: 0.1
          units: ~
          latex: "$C_{\\mathrm{sp}}$"
          doc: "Sponge diffusion coefficient."
        sponge.pml.r_target:
          advanced: true
          legacy: ~
          default: 0.001
          units: ~
          latex: "$R_{\\mathrm{pml}}$"
          doc: "PML target reflection coefficient; sets sigma_max = 3c/(2W) ln(1/R). North/south faces only."
        sponge.pml.h_gate:
          advanced: true
          legacy: ~
          default: 2.0
          units: "m"
          latex: "$h_{\\mathrm{gate}}$"
          doc: "PML depth gate; sigma tapers smoothly to 0 below this depth so the strip hands off to the beach."
        sponge.pml.width:
          legacy: ~
          default: 0.0
          units: "m"
          latex: "$W_{\\mathrm{pml}}$"
          doc: "PML sub-strip width measured inward from the face; 0 = half the face sponge width (the hybrid default). Confining the PML (and its NSWE zone) to the outer sub-strip leaves an inner Boussinesq-live pre-strip where the friction taper absorbs the dispersive band before it reaches the SWE interface; set to the face width for a full-strip PML."
        sponge.pml.cd:
          advanced: true
          legacy: ~
          default: 10.0
          units: ~
          latex: "$C_{d,\\mathrm{pml}}$"
          doc: "Friction drag auto-enabled over the face strip when the PML is on — the hybrid absorber's inner pre-strip; eq2d showed the bare PML recirculates the kh > 1 band off its SWE interface. Ignored when the face configures friction explicitly; 0 = pure PML."
        forcing.eta:
          legacy: "Tide{Face}_ETA"
          default: ~
          units: m
          doc: "Prescribed surface-elevation forcing (constant; file for a series)."
        forcing.u:
          legacy: "Tide{Face}_U"
          default: ~
          units: m/s
          doc: "Prescribed x-velocity forcing."
        forcing.v:
          legacy: "Tide{Face}_V"
          default: ~
          units: m/s
          doc: "Prescribed y-velocity forcing."
        forcing.file:
          legacy: "Tide{Face}FileName"
          default: ~
          units: ~
          doc: "Time-series forcing file (presence => DATA forcing)."
        forcing.wavemaker:
          legacy: ~
          default: ~
          units: ~
          doc: "Name of a spectrum-only wavemaker entry driving this face (nee ABS)."
        forcing.depth:
          legacy: ~
          default: ~
          units: "m"
          doc: "Reference depth for the wavemaker forcing series (nee DepthWaveMaker); absent = the bed mean along the fed face, refused unless flat within 1 %."
        forcing.disp_ramp:
          advanced: true
          legacy: ~
          default: ~
          units: m
          latex: "$L_{\\mathrm{disp}}$"
          doc: "Dispersion taper from a characteristic (Flather) face: the dispersive terms are off at the face and smoothstep back to full strength over this distance, so the face solves the shallow-water equations the Flather condition is derived for. Absent = 5 x the deepest still water along the face (logged at init); 0 = off. With the dispersion on at the face its closure sends a third of a wave group's amplitude back (Kr 35 % at kh ~ 1; 0.5 % at 5 depths, 0.3 % at 10), and a strong sustained flow grows a two-cell mode there that no ghost content or strip damps (2 m on a bore flume removes it). A face whose depth varies strongly gets the deep end's length everywhere; set the key to override. Refused on a wavemaker-fed face (its short waves need the dispersion) and on a relaxation face."
      overrides:
        west.forcing.depth: { legacy: DepthWaveMaker } # legacy global; west-only

  # ── numerics (format pilot; no variants) ───────────────────────────────────
  numerics:
    doc: "Numerical scheme — CFL, Riemann solver, reconstruction, wet/dry floor."
    keys:
      cfl:
        legacy: CFL
        default: 0.5
        units: ~
        latex: "$C_{\\mathrm{CFL}}$"
        doc: "CFL number for the adaptive timestep. Exclusive with dt: setting both is a config error."
      dt:
        advanced: true
        legacy: DT_fixed
        default: ~
        units: "s"
        latex: "$\\Delta t$"
        doc: "Presence selects a fixed timestep (nee simulation.time_stepping); the default cfl still caps it by halving. Absent = adaptive CFL stepping."
      flux_solver:
        advanced: true
        legacy: CONSTRUCTION
        default: hllc
        units: ~
        values: [hllc, hll]
        doc: "Approximate Riemann solver."
      froude_cap:
        legacy: FroudeCap
        default: 3.0
        units: ~
        latex: "$Fr_{\\mathrm{cap}}$"
        doc: "Velocity cap: |U| is scaled down where |U|/sqrt(g*max(h, min_depth)) exceeds this. The floor on h means the true Froude number is unbounded as the column dries; this caps speed, not Fr."
      min_depth:
        legacy: MinDepth
        default: 0.1
        units: "m"
        latex: "$d_{\\min}$"
        doc: "Floor on the water column wherever it divides or scales: the Froude cap, friction, the SWE gate ratio, the dispersion taper and sediment concentration (legacy folded MinDepth/MinDepthFrc). Not the wet/dry threshold, which is h > 0."
      tridiag.chunk:
        advanced: true
        legacy: ~
        default: 48
        units: ~
        doc: "Transverse chunk width of the pipelined tridiagonal sweeps. System-tuned; bitwise-neutral (reference sweep flat over 16-64)."
      tridiag.transpose_min_py:
        advanced: true
        legacy: ~
        default: 40
        units: ~
        doc: "Minimum y-rank count that switches the distributed y solve to the all-to-all transpose. System-tuned latency/bandwidth crossover; bitwise-neutral."
      reconstruction:
        advanced: true
        legacy: HIGH_ORDER
        default: fourth
        units: ~
        values: [fourth, fminmod, weno, mlp, basic]
        doc: "Spatial reconstruction scheme."

  # ── grid ──
  grid:
    required: true
    doc: "Computational grid — extent, spacing, bathymetry source, MPI decomposition, optional Coriolis + georeferencing."
    keys:
      coriolis.f: {legacy: ~, default: ~, units: s-1, latex: $f$, doc: Constant Coriolis parameter (f-plane; overrides latitude).}
      coriolis.latitude: {legacy: ~, default: ~, units: degrees_north, latex: $\varphi$, doc: Reference latitude for the f-plane Coriolis parameter.}
      cell_size: {legacy: ~, default: ~, units: m, latex: '$[\Delta x, \Delta y]$', doc: "Uniform grid spacing [dx, dy] (nee DX/DY); alternative to dx_file/dy_file."}
      dx_file: {legacy: ~, default: ~, units: ~, doc: "Variable x-spacing file (with dy_file; alternative to cell_size). Not yet implemented in the new path."}
      dy_file: {legacy: ~, default: ~, units: ~, doc: "Variable y-spacing file (with dx_file)."}
      n_cells: {legacy: ~, default: ~, units: ~, latex: '$[N_x, N_y]$', doc: "Global domain size [nx, ny] (nee Mglob/Nglob; grid_size; bathymetry.nx/ny). Required for flat/slope; for file bathymetry absent = inferred from the file (ASCII dimension scan) and present = an origin-anchored subset window, fit-checked under --validate."}
      n_procs: {advanced: true, legacy: ~, default: ~, units: ~, latex: '$[P_x, P_y]$', doc: "MPI decomposition [px, py] (nee PX/PY; decomposition.nx_proc/ny_proc); absent = auto-decompose."}
      origin: {legacy: ~, default: ~, units: m, latex: '$[x_0, y_0]$', doc: "Local coordinates [x0, y0] of the cell (1,1) centre; default [0, 0]."}
      bathymetry.type: {legacy: DEPTH_TYPE, default: file, units: ~, values: [flat, file, slope], doc: Bathymetry source.}
      bathymetry.depth: {legacy: DEPTH_FLAT, default: ~, units: m, latex: $d_0$, doc: Still-water depth (flat and slope types).}
      bathymetry.slope: {legacy: SLP, default: ~, units: ~, latex: $s$, doc: Bed slope for a sloping-beach bathymetry.}
      bathymetry.x0: {legacy: Xslp, default: 0.0, units: m, latex: '$x_{s0}$', doc: x location where the slope begins.}
      bathymetry.file: {legacy: DEPTH_FILE, default: ~, units: ~, doc: "Bathymetry field (file type): a loose file, format from the extension (.bin real stream, .nc netcdf holding one 2-D variable, anything else ascii rows separated by blanks or commas), or a container reference other.nc#/group/var. Binary carries no dimensions, so n_cells is required and must equal the file's."}
      bathymetry.format: {legacy: ~, default: ~, units: ~, values: [ascii, binary, netcdf], doc: Bathymetry file format override (default from the extension).}
      bathymetry.correction: {legacy: BATHY_CORRECTION, default: false, units: ~, doc: Apply the bathymetry smoothing/correction pass (file type).}
      bathymetry.smooth_below_depth: {legacy: ~, default: ~, units: m, doc: "Correction-pass smoothing floor; absent = off (-LARGE sentinel)."}
      bathymetry.slope_cap: {advanced: true, legacy: ~, default: 1.0, units: ~, doc: Correction-pass maximum bed slope.}
      # crs: georef of the (possibly rotated) rectilinear grid — the shared
      # funtools<->engine contract; supersedes the ad-hoc X_origin/Y_origin/
      # EPSG/rotation_deg keys funtools emitted into input.txt.  World from
      # local metres (u,v) measured from the cell (1,1) centre:
      #   E = origin_x + u cos(rot) - v sin(rot)
      #   N = origin_y + u sin(rot) + v cos(rot)
      # Metadata only: physics stays in local metres; the engine's job is
      # stamping the CF grid_mapping quartet (epsg_code, funwave_origin_x/y,
      # funwave_rotation_deg) onto NetCDF output, mirroring funtools bathy.nc.
      crs.epsg: {legacy: ~, default: ~, units: ~, doc: EPSG code of the projected horizontal CRS in metres; presence georeferences the grid (absent = local unreferenced).}
      crs.origin_x: {legacy: ~, default: 0.0, units: m, latex: $x_0$, doc: "Projected easting of the cell (1,1) centre."}
      crs.origin_y: {legacy: ~, default: 0.0, units: m, latex: $y_0$, doc: "Projected northing of the cell (1,1) centre."}
      crs.rotation: {legacy: ~, default: 0.0, units: deg, latex: $\theta_g$, doc: "Grid +x axis angle, CCW from projected east (math convention, NOT compass azimuth); 0 = axis-aligned."}
      crs.vertical_datum: {legacy: ~, default: ~, units: ~, doc: "Vertical datum name that depths/eta reference (e.g. NAVD88, IGLD85 LWD); output-stamp provenance only."}
      water_level: {legacy: WaterLevel, default: 0.0, units: m, latex: $\eta_0$, doc: "Still-water level above the bathymetry datum; added to depth and wavemaker reference depths at init, so output eta is referenced to this level. Survives hotstart (reference-frame property, not an IC)."}

  # ── simulation ──
  simulation:
    required: true
    doc: "Run control — title, total/start time, and screen-log cadence. time_stepping is retired: numerics.dt presence selects a fixed step."
    keys:
      screen_interval: {legacy: SCREEN_INTV, default: 1.0, units: s, latex: '$\Delta t_{\mathrm{screen}}$', doc: Screen-log / monitor cadence.}
      t_start: {legacy: PLOT_START_TIME, default: 0.0, units: s, latex: $t_0$, doc: Simulation time at which output begins.}
      spinup: {legacy: ~, default: 0.0, units: s, latex: '$t_{\\mathrm{spin}}$', doc: "Spin-up duration. The meteo crest envelope does not accumulate before it, and channels may write t_start: spinup to inherit it rather than restating the offset per channel -- so a wavemaker ramp cannot set a maximum that is then reported as a storm peak. 0 = from t=0 (legacy)."}
      title: {legacy: TITLE, default: ~, units: ~, doc: Run title (reserved for NetCDF global attrs).}
      total_time: {legacy: TOTAL_TIME, default: ~, units: s, latex: $T$, doc: Total simulated duration.}

  # ── initial ──
  initial:
    doc: "Initial condition — block presence selects the type (solitary/sine_mode/fields/hump/n_wave). Still-water level lives in grid.water_level."
    keys:
      fields.bed_deformation: {legacy: BED_DEFORMATION, default: false, units: ~, doc: "Take eta as a bed displacement as well: depth = depth - eta at load (co-seismic source)."}
      fields.eta: {legacy: ETA_FILE, default: ~, units: ~, doc: "Surface-elevation field ref: a path or other.nc#/group/var, formats as grid.bathymetry.file."}
      fields.format: {legacy: ~, default: ~, units: ~, values: [ascii, binary, netcdf], doc: Field-file format override (default from the extension).}
      fields.time: {legacy: HotStartTime, default: 0.0, units: s, latex: '$t_{\\mathrm{hs}}$', doc: Simulation time the fields hold; the run starts there.}
      fields.u: {legacy: U_FILE, default: ~, units: ~, doc: x-velocity field ref (with fields.v; absent = still).}
      fields.v: {legacy: V_FILE, default: ~, units: ~, doc: y-velocity field ref (with fields.u).}
      hump.amplitude: {legacy: AMP, default: ~, units: m, doc: "Hump amplitude. The hump block is pending: the engine rejects it at init rather than silently ignoring it."}
      hump.radius: {legacy: ~, default: ~, units: m, doc: "Gaussian hump radius (legacy used WID for both shapes)."}
      hump.shape: {legacy: ~, default: ~, units: ~, values: [rect, gaussian, dipole], doc: Hump shape.}
      hump.width: {legacy: WID, default: ~, units: m, doc: Hump width (rect half-width).}
      hump.x_center: {legacy: Xc, default: ~, units: m, doc: Hump center x.}
      hump.y_center: {legacy: Yc, default: ~, units: m, doc: Hump center y.}
      n_wave.a0: {legacy: a0_Nwave, default: ~, units: m, doc: "N-wave amplitude. The n_wave block is pending: the engine rejects it at init rather than silently ignoring it."}
      n_wave.depth: {legacy: dep_Nwave, default: ~, units: m, doc: N-wave still-water depth.}
      n_wave.gamma: {legacy: gamma_Nwave, default: ~, units: ~, doc: N-wave shape parameter.}
      n_wave.x1: {legacy: x1_Nwave, default: ~, units: m, doc: N-wave leading position.}
      n_wave.x2: {legacy: x2_Nwave, default: ~, units: m, doc: N-wave trailing position.}
      sine_mode.amplitude: {legacy: AMP, default: 0.0, units: m, latex: $a$, doc: Standing sine-mode amplitude.}
      sine_mode.depth: {legacy: DEP, default: 0.0, units: m, latex: $d$, doc: Sine-mode still-water depth.}
      sine_mode.mode_x: {legacy: ~, default: 1, units: ~, doc: Sine mode number in x.}
      sine_mode.mode_y: {legacy: ~, default: 0, units: ~, doc: Sine mode number in y.}
      solitary.amplitude: {legacy: AMP, default: 0.0, units: m, latex: $a$, doc: Solitary-wave amplitude.}
      solitary.depth: {legacy: DEP, default: 0.0, units: m, latex: $d$, doc: Solitary-wave still-water depth.}
      solitary.direction: {legacy: ~, default: +x, units: ~, values: [+x, -x, +y, -y], doc: Solitary-wave propagation direction.}
      solitary.x_center: {legacy: XWAVEMAKER, default: 0.0, units: m, doc: Solitary-wave initial crest x.}
      solitary.angle: {legacy: ~, default: ~, units: deg, latex: $\theta$, doc: Oblique crest angle from +x (presence selects the doubly-periodic tiled train; excludes direction).}
      solitary.y_center: {legacy: ~, default: 0.0, units: m, doc: Solitary-wave initial crest y (angle only).}

  # ── physics ──
  # nee physics: — the wrapper held nothing but dispersion.*, so the
  # mechanism is a top-level section, sibling to breaking/friction
  dispersion:
    doc: "Boussinesq dispersion — named scheme XOR an explicit atomic Gamma triple."
    keys:
      beta_ref: {advanced: true, legacy: Beta_ref, default: -0.531, units: ~, latex: '$\beta_{\mathrm{ref}}$', doc: Reference depth level for the Boussinesq operator.}
      slope_disp_max: {advanced: true, legacy: ~, default: 0.0, units: ~, latex: '$|\\nabla h|_{\\max}$', doc: "Bathymetry-slope dispersion gate: |grad h| at or above which the dispersive terms are fully off (0 = gate disabled). The Boussinesq derivation assumes a mild slope, so on a near-vertical face digitised into the bathymetry the dispersive operator is outside its own validity and goes marginally unstable; gating back toward NSWE there leaves the geometry and overtopping untouched, unlike smoothing the bathymetry. Static (bathymetry-derived), evaluated once at init."}
      slope_disp_ramp: {advanced: true, legacy: ~, default: 0.0, units: ~, doc: "Slope-gate smoothstep taper width in |grad h| units, below slope_disp_max. Required (positive) whenever slope_disp_max is set: a hard switch turns last-bit differences into O(1) residual flips at threshold cells, which is the known blow-up injector."}
      # gamma triple: atomic (any present => all three) and exclusive with
      # scheme: — expert mode states the whole triple; dispersion stays ON
      # (kernels-off NSWE is reachable only via scheme: nswe)
      gamma1: {advanced: true, legacy: Gamma1, default: ~, units: ~, latex: $\Gamma_1$, doc: "Dispersion coefficient (atomic triple with gamma2/gamma3; exclusive with scheme)."}
      gamma2: {advanced: true, legacy: Gamma2, default: ~, units: ~, latex: $\Gamma_2$, doc: "Dispersion coefficient (atomic triple)."}
      gamma3: {advanced: true, legacy: Gamma3, default: ~, units: ~, latex: $\Gamma_3$, doc: "Dispersion coefficient (atomic triple)."}
      scheme:
        legacy: ~
        default: fully_nonlinear
        units: ~
        values: [fully_nonlinear, weakly_nonlinear, linear, nswe]
        # the mode table — data shared by the reader, funtools to_legacy
        # (which emits the resolved Gamma1/2/3), and docs.  nswe also turns
        # the dispersion kernels OFF (not merely zeroed coefficients)
        presets:
          fully_nonlinear: [1.0, 1.0, 1.0]
          weakly_nonlinear: [1.0, 1.0, 0.0]
          linear: [1.0, 0.0, 1.0]
          nswe: [0.0, 0.0, 1.0]
        doc: "Named dispersion preset for the Gamma triple; exclusive with explicit gammas. No 1:1 legacy keyword (legacy encoded this via DISPERSION + the Gamma values)."

  # ── breaking ──
  breaking:
    doc: "Wave breaking — dissipation model, roller, and thresholds (core physics, not presence-gated). Wavemaker-zone overrides live in wavemaker.source.breaking."
    keys:
      cbrk1: {advanced: true, legacy: Cbrk1, default: 0.45, units: ~, latex: '$C_{\mathrm{brk1}}$', doc: "Breaking onset threshold coefficient (legacy default 0.65; 0.45 is the 2026-09 breaking-board fit for the split solve with nu_scale 2)."}
      cbrk2: {advanced: true, legacy: Cbrk2, default: 0.35, units: ~, latex: '$C_{\mathrm{brk2}}$', doc: Breaking cessation threshold coefficient.}
      nu_bkg: {advanced: true, legacy: nu_bkg, default: 0.0, units: m2 s-1, latex: '$\nu_{\mathrm{bkg}}$', doc: Background eddy viscosity added everywhere.}
      nu_scale: {advanced: true, legacy: ~, default: 2.0, units: ~, latex: '$s_\nu$', doc: "Multiplier on the breaker eddy-viscosity magnitude. Every scheme scales nu with cbrk2 x sqrt(gh) x depth, so cbrk2 carried cessation and magnitude together; nu_scale separates them (1 = legacy magnitude; 2 = the 2026-09 breaking-board knee; the wavemaker-zone term is not scaled)."}
      scheme: {advanced: true, legacy: ~, default: constant, units: ~, values: [constant, kennedy, kennedy_orig, static_trans, depth_ratio], doc: "Breaker viscosity form: constant = nu fixed at cbrk2 x sqrt(gh) x depth while active (legacy); kennedy = the steepness-ramped form nu = depth x cbrk2 x sqrt(gh) x (1 + B), B ramping over [cbrk1, 2 cbrk1]; kennedy_orig = Kennedy et al. 2000 with the age-ramped onset threshold and T* = 5 sqrt(h/g); static_trans = linear cbrk1 -> cbrk2 transition over t_brk; depth_ratio = onset on eta/depth > swe_eta_dep, no age."}
      # show_breaking RETIRED: the breaker-diagnostics pass is derived —
      # viscosity breaking (incl. roller forcing) or any AGE/ROLLER/UNDERTOW
      # output request; to_legacy emits the resolved SHOW_BREAKING
      model: {advanced: true, legacy: VISCOSITY_BREAKING, default: eddy_viscosity, units: ~, values: [eddy_viscosity, shock_capturing, wavemaker_viscosity, none], doc: "Breaking dissipation model; eddy_viscosity is the supported closure and the only one the sediment module accepts (shock_capturing is refused with sediment). wavemaker_viscosity (nee WAVEMAKER_VIS) = shock-capturing globally + Kennedy-style viscosity inside the wavemaker zone. none = no breaker and no SWE gate, dispersion everywhere (analytic cases, debugging; refused with sediment)."}
      visbrk: {advanced: true, legacy: visbrk, default: 0.0, units: m2 s-1, latex: '$\nu_{\mathrm{brk}}$', doc: "Breaking eddy-viscosity coefficient (wavemaker_viscosity threshold; read only under that model)."}
      roller: {legacy: ROLLER, default: false, units: ~, doc: Enable the surface roller (forces model eddy_viscosity, as legacy).}
      swe_eta_dep: {advanced: true, legacy: SWE_ETA_DEP, default: 0.8, units: ~, latex: '$\eta_{\mathrm{SWE}}$', doc: "Bore-regime eta/depth threshold: the SWE dispersion gate (shock family) and the viscous breaker's extra onset criterion."}
      swe_eta_ramp: {advanced: true, legacy: ~, default: 0.10, units: ~, latex: '$\Delta\eta_{\mathrm{SWE}}$', doc: "eta/depth width of the SWE-gate smoothstep below swe_eta_dep; 0 = legacy hard switch. Read only when the gate exists (model not eddy_viscosity)."}
      wetdry_disp_ramp: {advanced: true, legacy: ~, default: 3.0, units: ~, latex: '$\Delta H_{\mathrm{wd}}$', doc: "Wet/dry-proximity dispersion taper: water-column multiples of numerics.min_depth over which disp_w smoothsteps up from 0 at the wet/dry threshold; 0 = off (legacy). Applies under every breaking model — the viscous path has no SWE gate, so swash-edge mask flips otherwise radiate through the dispersive terms."}
      swe_gate: {legacy: ~, default: false, units: ~, doc: "Apply the eta/h SWE-transition gate (mask9 zeroing + swe_eta_ramp taper) under eddy_viscosity, capping the dispersion amplitude at steep bores. Default false leaves dispersion ungated, as the legacy viscous breaker did."}
      nu_cap: {advanced: true, legacy: ~, default: 0.0, units: ~, doc: "Clamp nu_break at this fraction of the explicit-diffusion stability bound 1/(2 dt (1/dx^2 + 1/dy^2)). The Laplacian integrates with the advective-CFL dt (no viscous term in estimate_dt, matching legacy), so an uncapped breaker viscosity can exceed the stable limit several-fold at energetic breakpoints. 0 = off (legacy, unbounded); 0.5 recommended under the explicit solver (the split solvers never read it)."}
      solver: {advanced: true, legacy: ~, default: split_implicit, units: ~, values: [explicit, split_implicit, stage_split], doc: "Breaker-viscosity integrator: explicit source term (legacy), a once-per-step operator-split ADI solve on Hu/Hv, or the same solve applied to each RK stage's Euler predictor before the SSP blend (stage_split, IMEX form) — both splits unconditionally stable, nu_cap not applied. Read under eddy_viscosity only; the wavemaker_viscosity zone term stays an explicit source."}
      theta: {advanced: true, legacy: ~, default: 1.0, units: ~, latex: "$\\theta$", doc: "Implicitness weight of the split breaker-viscosity solve: 1 = backward Euler, 0.5 = Crank-Nicolson. A-stable on [0.5, 1]. Read for the split solvers only."}
      t_brk: {advanced: true, legacy: ~, default: 20.0, units: s, latex: '$T_{\mathrm{brk}}$', doc: "Breaking-event age threshold (legacy hard-coded 20 s — the per-wavemaker assignments were dead code)."}
      age_per_stage: {advanced: true, legacy: ~, default: true, units: ~, doc: "Accrue breaker age every RK stage, so age advances three times per step as in legacy (the cbrk defaults were calibrated with it); false = once per time step."}

  # ── friction ──
  friction:
    doc: "Bottom friction — exactly one of cd, manning (n), or file; section absent = zero drag."
    keys:
      cd: {legacy: Cd, default: ~, units: ~, latex: $C_d$, doc: Constant quadratic bottom-drag coefficient.}
      manning: {legacy: ~, default: ~, units: 's m^{-1/3}', latex: $n$, doc: Manning roughness n (converted to Cd per cell).}
      file: {legacy: FRICTION_FILE, default: ~, units: ~, doc: "Spatially varying Cd map file — one row of Mglob values per global J, ascii or binary by extension."}

  # ── obstacle ──
  obstacle:
    doc: "Interior obstacles — obstacle mask file and breakwater absorbing block."
    keys:
      file: {legacy: OBSTACLE_FILE, default: ~, units: ~, doc: "Obstacle mask field, 1 water / 0 structure (presence enables interior walls); ascii, binary or netcdf as grid.bathymetry.file."}
      breakwater.file: {legacy: BREAKWATER_FILE, default: ~, units: ~, doc: "Breakwater width field in metres per cell, 0 = none; ascii, binary or netcdf as grid.bathymetry.file."}
      breakwater.absorb_coef: {advanced: true, legacy: BreakWaterAbsorbCoef, default: 10.0, units: ~, latex: '$C_{\mathrm{bw}}$', doc: Breakwater absorption coefficient.}

  # ── meteo ──
  meteo:
    doc: "Atmospheric forcing — presence-derived sub-models (gaussian/wind/holland/slide)."
    keys:
      gaussian.file: {legacy: METEO_GAUSIAN_FILE, default: ~, units: ~, doc: Gaussian pressure-disturbance file (presence enables; forces pressure coupling).}
      wind.file: {legacy: CONSTANT_WIND_FILE, default: ~, units: ~, doc: Constant wind-field file (presence enables wind stress).}
      wind.cd: {advanced: true, legacy: Cdw, default: 0.002, units: ~, latex: '$C_{dw}$', doc: Wind drag coefficient.}
      wind.wave_interaction: {advanced: true, legacy: ~, default: false, units: ~, doc: Modulate wind stress by the wave field.}
      wind.crest_percent: {advanced: true, legacy: WindCrestPercent, default: ~, units: ~, doc: Fraction of crest exposed to wind (requires wave_interaction).}
      holland.file: {legacy: STORM_FILE, default: ~, units: ~, doc: Holland-model storm-track file.}
      holland.air_pressure: {legacy: AirPressure, default: false, units: ~, doc: Apply the storm pressure coupling.}
      holland.wind_force: {legacy: WindForce, default: false, units: ~, doc: Apply the storm wind-stress coupling.}
      holland.cd: {advanced: true, legacy: ~, default: 0.002, units: ~, latex: '$C_{dw}$', doc: Wind drag coefficient (Holland).}
      holland.wave_interaction: {advanced: true, legacy: ~, default: false, units: ~, doc: Modulate storm wind stress by the wave field.}
      holland.crest_percent: {advanced: true, legacy: ~, default: ~, units: ~, doc: Fraction of crest exposed to wind (requires wave_interaction).}
      slide.file: {legacy: SLIDE_FILE, default: ~, units: ~, doc: Submarine-landslide forcing file (presence enables; forces pressure coupling).}

  # ── subgrid ──
  subgrid:
    doc: "Subgrid porosity (urban flooding) — depth file, ratio, porosity output."
    keys:
      depth_file: {legacy: DEPTH_SUBGRID_FILE, default: ~, units: ~, doc: High-resolution subgrid bathymetry file.}
      write_porosity: {legacy: Porosity, default: false, units: ~, doc: Output the computed porosity field.}
      ratio: {legacy: SubMainGridRatio, default: 1, units: ~, doc: Subgrid-to-main-grid refinement ratio.}

  # ── foam ──
  foam:
    doc: "Foam / bubble model — production and decay parameters."
    keys:
      source_coef: {advanced: true, legacy: f_source, default: 0.05, units: ~, latex: '$f_{\mathrm{source}}$', doc: Foam production coefficient.}
      time_scale: {advanced: true, legacy: FoamTimeScale, default: 3.8, units: s, latex: $\tau_f$, doc: Foam decay time scale.}
      burst_time_non_breaking: {advanced: true, legacy: BurstTimeNonBreaking, default: 1.0, units: s, doc: Foam burst time in non-breaking regions.}
      min_thickness: {advanced: true, legacy: MinThick, default: 0.01, units: m, doc: Minimum foam-layer thickness tracked.}
      cd: {advanced: true, legacy: CdFoam, default: 0.5, units: ~, latex: '$C_{d,f}$', doc: Foam-layer drag coefficient.}

  # ── precipitation ──
  precipitation:
    doc: "Precipitation — rainfall forcing file."
    keys:
      file: {legacy: RAINFALL_FILE, default: ~, units: ~, doc: Rainfall forcing file.}

  # ── tracer ──
  tracer:
    doc: "Passive tracers — the tracker table lives in the tracer file."
    keys:
      file: {legacy: TRACER_FILE, default: ~, units: ~, doc: 'Tracer table file (count, cadence, one row per tracker).'}

  # ── vessel ──
  vessel:
    doc: "Moving vessels — per-hull files in a folder; propeller and deep-draft options."
    keys:
      folder: {legacy: VESSEL_FOLDER, default: ~, units: ~, doc: Directory of per-hull vessel_NNNNN files.}
      count: {legacy: NumVessel, default: 1, units: ~, doc: Number of vessels.}
      propeller: {legacy: ~, default: false, units: ~, doc: Enable propeller jets (must match the build's -DPROPELLER).}
      deep_draft.clearance: {legacy: CLEARANCE, default: ~, units: m, doc: Keel clearance above the bed (required for deep_draft).}
      deep_draft.mask: {legacy: MaskMethod, default: true, units: ~, doc: Mask cells fully blocked by the hull.}
      deep_draft.cd: {advanced: true, legacy: CdDeepDraft, default: ~, units: ~, latex: '$C_{d,v}$', doc: Hull drag coefficient (presence enables hull drag).}
      deep_draft.nu: {advanced: true, legacy: VisDeepDraft, default: ~, units: m^2/s, doc: Hull eddy viscosity (presence enables).}

  # ── sediment ──
  sediment:
    doc: "Sediment — single grain size, morphology, avalanching, cohesive, and flow-feedback sub-blocks."
    keys:
      scheme: {advanced: true, legacy: Sed_Scheme, default: upwinding, units: ~, values: [upwinding, tvd], doc: Advection scheme for suspended load.}
      solver: {advanced: true, legacy: ~, default: split_implicit, units: ~, values: [explicit, split_implicit], doc: "Suspended-load diffusion integrator: a once-per-step operator-split backward-Euler ADI solve on CH (unconditionally stable), or the explicit face flux inside the RK stages (legacy; clamped at the stability bound, which the Elder diffusivity tops under ~0.5 m cells)."}
      d50: {legacy: D50, default: ~, units: m, latex: '$D_{50}$', doc: 'Median grain diameter (absent: 0.5 mm sand / 5 nm mud by cohesive).'}
      specific_gravity: {legacy: Sdensity, default: 2.68, units: ~, latex: $s$, doc: Sediment specific gravity.}
      porosity: {legacy: n_porosity, default: 0.47, units: ~, latex: $n$, doc: Bed porosity.}
      settling_velocity: {legacy: WS, default: ~, units: m/s, latex: $w_s$, doc: Settling velocity (absent = computed from grain size).}
      shields_cr: {advanced: true, legacy: Shields_cr, default: 0.055, units: ~, latex: '$\theta_{cr}$', doc: Critical Shields parameter for suspension.}
      min_depth_pickup: {legacy: MinDepthPickup, default: 0.1, units: m, doc: Minimum water depth for pickup.}
      pickup_ramp: {advanced: true, legacy: ~, default: 0.0, units: ~, doc: "Wet/dry-proximity source taper: multiples of min_depth_pickup over which the sand pickup, the bedload flux, and the split-diffusion faces smoothstep up from zero at the cutoff; 0 = off (legacy hard switch). The wetdry_disp_ramp idiom applied to the sediment column."}
      pickup_reduction: {advanced: true, legacy: PickupReduction, default: true, units: ~, doc: "Cap the bed concentration c_b at reduction_parameter (pickup scaled by min(1, reduction_parameter/c_b))."}
      reduction_parameter: {advanced: true, legacy: ReductionParameter, default: 0.65, units: ~, doc: "The c_b cap (requires pickup_reduction)."}
      c_limiter: {advanced: true, legacy: C_limiter, default: ~, units: ~, doc: Suspended-concentration limiter (presence enables).}
      morph_interval: {legacy: Morph_interval, default: ~, units: s, doc: Morphology update interval.}
      bed_change: {legacy: Bed_Change, default: false, units: ~, doc: Enable bed-level change (morphodynamics).}
      bedload: {legacy: BedLoad, default: false, units: ~, doc: Include bed-load transport.}
      shields_cr_bedload: {advanced: true, legacy: Shields_cr_bedload, default: ~, units: ~, latex: '$\theta_{cr,b}$', doc: Critical Shields for bed load (absent = shields_cr).}
      morph_factor: {advanced: true, legacy: Morph_factor, default: 1, units: ~, doc: Morphological acceleration factor.}
      hard_bottom.file: {legacy: Hard_bottom_file, default: ~, units: ~, doc: "Non-erodible bed level z_s field (required); ascii, binary or netcdf as grid.bathymetry.file."}
      avalanche.tan_phi: {legacy: Tan_phi, default: ~, units: ~, latex: $\tan\phi$, doc: Tangent of the repose angle (required for avalanche).}
      avalanche.interval: {advanced: true, legacy: Aval_interval, default: ~, units: s, doc: Avalanche relaxation interval (absent = every step).}
      cohesive.soft_bed: {legacy: SoftBed, default: true, units: ~, doc: Track a consolidating soft-bed layer.}
      cohesive.tau_cr: {legacy: Tau_cr_coh, default: ~, units: m2/s2, latex: '$\tau_{cr}$', doc: Critical erosion shear stress (required for cohesive).}
      cohesive.tau_crd: {advanced: true, legacy: Tau_crd_coh, default: 0.001, units: m2/s2, latex: '$\tau_{cr,d}$', doc: Critical deposition shear stress.}
      cohesive.e: {advanced: true, legacy: E_coh, default: 0.0001, units: m/s, latex: $E$, doc: Erosion-rate coefficient.}
      cohesive.alpha: {advanced: true, legacy: alpha_coh, default: 1.0, units: ~, latex: $\alpha$, doc: Consolidation coefficient.}
      cohesive.a: {advanced: true, legacy: a_coh, default: 0.1, units: ~, latex: $a$, doc: Soft-bed density parameter a.}
      cohesive.b: {advanced: true, legacy: b_coh, default: 2.0, units: ~, latex: $b$, doc: Soft-bed density parameter b.}
      cohesive.n: {advanced: true, legacy: n_coh, default: 0.5, units: ~, latex: $n$, doc: Soft-bed exponent n.}
      cohesive.m: {advanced: true, legacy: m_coh, default: 1.5, units: ~, latex: $m$, doc: Soft-bed exponent m.}
      feedback.mass_source: {advanced: true, legacy: SedimentMassSource, default: false, units: ~, doc: Feed erosion/deposition mass back into continuity.}
      feedback.moment_dc: {advanced: true, legacy: SedimentMomentDC, default: false, units: ~, doc: Feed the density-current momentum term back.}
      feedback.moment_exg: {advanced: true, legacy: SedimentMomentEXG, default: false, units: ~, doc: Feed the sediment-exchange momentum term back.}

  # ── coupling ──
  coupling:
    doc: "External-model coupling — coupling data file."
    keys:
      file: {legacy: COUPLING_FILE, default: ~, units: ~, doc: Nesting/coupling boundary data file.}

  # ── hot_start ──
  hot_start:
    doc: "Hot start — restart from a binary checkpoint set; output numbering."
    keys:
      checkpoint: {legacy: ~, default: ~, units: ~, doc: "Restart from a binary checkpoint directory (holds core.bin: state and time). Required when the block is present; a start from field files is initial.fields."}
      output_start_number: {legacy: ~, default: 1, units: ~, doc: First output frame number after restart.}
      # eta_file/u_file/v_file/time/bed_deformation retired: initial.fields
      # (ETA_FILE, U_FILE, V_FILE, HotStartTime, BED_DEFORMATION map there);
      # MASK_FILE dropped -- the wet/dry mask is derived from eta and depth

  # ── output ──
  output:
    required: true
    doc: "Output control — cadence, format, folder, plus means/vessel/arrival-time sub-blocks."
    keys:
      checkpoint: {legacy: ~, default: ~, units: ~, doc: Directory to write the hot-start checkpoint set (core.bin) at run end.}
      depth_out: {legacy: DEPTH_OUT, default: false, units: ~, doc: Write the still-water depth field.}
      format: {legacy: FIELD_IO_TYPE, default: binary, units: ~, values: [ascii, binary, netcdf, pnetcdf], doc: Field output format (nee field_io_type; netcdf needs a netcdf-fortran build, pnetcdf writes classic CDF-5 collectively and needs a PnetCDF build).}
      layout: {legacy: ~, default: chunked, units: ~, values: [single, per_stream, chunked], doc: NetCDF file topology; single = one output.nc with streams as groups, per_stream = data.nc + diagnostics.nc, chunked = field files split in time with a size-derived window.}
      max_file_size: {legacy: ~, default: 50.0, units: GB, doc: Chunk roll-over size; also the predicted-size warning threshold for single/per_stream.}
      result_folder: {legacy: RESULT_FOLDER, default: ./output/, units: ~, doc: Directory for output files.}
      # interval / variables / means.* retired (channels migration): the
      # fields channel carries cadence + registry-name variables; a
      # statistics channel supersedes the means block (hsig = the wave
      # height product).  nee PLOT_INTV / the OUT_* flags list /
      # T_INTV_mean + STEADY_TIME.
      blowup_threshold: {advanced: true, legacy: EtaBlowVal, default: ~, units: m, doc: Elevation above which the run aborts (absent = 100*max|Depth|).}
      vessel.interval: {legacy: PLOT_INTV_VESSEL, default: ~, units: s, doc: Vessel resistance-series output cadence.}
      # diagnostics: the scalar-reduction channel (the modern STATISTICS): one row per sample
      diagnostics.variables: {legacy: ~, default: ~, units: ~, doc: "Metrics, each a domain-wide reduction over WET cells: <variable>.<max|min|sum|mean|count|fraction|area> on any registry field (count/fraction/area take a 0/1 flag as active at 1, froude_scale and disp_gate as active below 1), or the named quantities mass (sum eta dx dy), energy (sum (g h^2 + h|u|^2)/2 dx dy), speed.max, froude.max (|u|/sqrt(g max(h, min_depth_frc))), flooded_area (wet area above the still-water shoreline). Presence of the block enables output/diagnostics.dat (t, dt, step, n_wet, one column per metric; a mean or fraction with n_wet = 0 is written as 0; a hot start appends behind a '# restart t_start=<t>' line; step counts the current leg, so continuity keys on t), the five-row sidecar diagnostics.latest, diagnostics.metadata.yaml (units per column), on netcdf/pnetcdf decks the group diagnostics in diagnostics.nc as well (the current leg only, the root file is recreated on a hot start; the table stays the full record), a screen-log line per sample, and the one-time warnings: a gate's first active cell, dt collapse under 0.1 x the sampled median, a dt jump above 10 x the previous step, |u| above 3 sqrt(g h_max). A non-finite metric aborts the run."}
      diagnostics.interval: {legacy: PLOT_INTV_STAT, default: ~, units: s, doc: "Sample cadence. Absent or 0 = every N steps with N = screen_interval / dt0 fixed at the first step, so a dt collapse densifies the record on its own (a collapse also forces a sample)."}
      diagnostics.abort: {legacy: ~, default: ~, units: ~, doc: "Per-metric abort thresholds, {metric: value}: the run stops with the offending value logged when a listed metric exceeds its value (e.g. {eta.max: 50, speed.max: 30}). Independent of blowup_threshold, which stays the every-step |eta| guard."}
      # geometries:/channels: are lists of named entries (keys below are per entry)
      geometries.name: {legacy: ~, default: ~, units: ~, doc: Point-set name (referenced by channels.geometry).}
      geometries.type: {legacy: ~, default: ~, units: ~, values: [station, transect], doc: "Point-set kind. Station/transect values are BILINEARLY INTERPOLATED from the four surrounding cells, which has a validity consequence worth knowing: dry cells are not neutral (at init they carry eta = -depth - min_depth, and thereafter whatever the last wet step left), so a point whose stencil straddles the wet/dry line returns a contaminated value with no error. Request `mask` on the same channel to detect it -- the weights sum to 1 and mask is 0/1 per cell, so the interpolated mask is exactly the weighted wet fraction of the stencil: 1.0 means every contributing cell is wet and the value is clean, anything less means it is not. A station outside every rank's subdomain is dropped by the interpolator and reads 0.0 in every variable, mask included. Sampling `mask` at the station cadence also gives the per-station wet-step record for free."}
      geometries.file: {legacy: ~, default: ~, units: ~, doc: "Station coordinate file, one \"x y\" pair (m) per line -- exclusive with x:/y:."}
      geometries.x: {legacy: ~, default: ~, units: m, doc: Station x-coordinates (equal length with y).}
      geometries.y: {legacy: ~, default: ~, units: m, doc: Station y-coordinates.}
      geometries.start: {legacy: ~, default: ~, units: m, doc: "Transect start point [x, y]."}
      geometries.end: {legacy: ~, default: ~, units: m, doc: "Transect end point [x, y]."}
      geometries.n_points: {legacy: ~, default: ~, units: ~, doc: "Transect sample count >= 2 (absent = sampled at min(dx, dy))."}
      channels.name: {legacy: ~, default: ~, units: ~, doc: Channel name (file stem <name>_<var>.dat).}
      channels.geometry: {legacy: ~, default: ~, units: ~, doc: "Name of the geometries entry to sample, or the reserved name 'field' for the whole domain (or inline the geometry keys on the channel instead)."}
      channels.variables: {legacy: ~, default: ~, units: ~, doc: "Field-registry variable names, vector-derived names (velocity.mag, velocity.dir -- registry vectors: velocity = [u, v]; statistics on .dir are rejected, direction is circular), and product-derived names (hsig = 4.004*std(eta), the Rayleigh H_1/3 constant; its eta source accumulates hidden when not itself requested)."}
      channels.interval: {legacy: ~, default: ~, units: s, doc: Channel flush cadence.}
      channels.statistics: {legacy: ~, default: ~, units: ~, values: [min, max, mean, rms, std, max_time, first_time, last_time, duration, duration_max, count, envelope, arrival, inundation], doc: "Presence makes the channel windowed (per-interval statistics, no snapshots); absence makes it instantaneous. std is about the window mean (rms includes it); shifted moments keep single precision safe. max_time = when the window maximum was set. The event class (first_time, last_time = onset of the first/last event, duration, duration_max, count) needs threshold: and samples wet cells only; an event commits when it closes, so adjacent windows sum exactly; time values hold the fill where nothing triggered. Presets expand in place: envelope = max min max_time, arrival = first_time, inundation = first_time duration duration_max count."}
      channels.threshold.above: {legacy: ~, default: ~, units: ~, doc: "Event condition: sample > value, in the variable's units; a real or a list of reals (one output per value, suffixed _<value> with p for the point, e.g. h_duration_0p1; a single value takes no suffix). Exactly one of above/below/magnitude."}
      channels.threshold.below: {legacy: ~, default: ~, units: ~, doc: "Event condition: sample < value (see above)."}
      channels.threshold.magnitude: {legacy: ~, default: ~, units: ~, doc: "Event condition on a .mag speed variable (velocity.mag): speed > value (see above)."}
      channels.gap: {legacy: ~, default: 10, units: ~, doc: "Event filter in time steps: the condition returning within this many steps continues the same event (the gap is not counted as duration). 0 = off. The breaking flag flickers at the step scale as a front passes, whatever the grid: on the TK flume 0 gives about four fragments per wave per cell, 2 the right median with a quarter of the surf cells still over, 5 the knee, 10 the plateau and 20 the same, so the default sits at the start of the plateau. With an adaptive dt the count follows the physics; keep it well below the wave period in steps (T/dt), which only a very coarse dt approaches. A crest or flooding event lasts hundreds of steps and is untouched."}
      channels.min_duration: {legacy: ~, default: 0.0, units: s, doc: "Event filter: an event shorter than this is discarded at close without a trace. 0 = off. Keep it below the passage time of the feature at a cell: a breaking front holds a cell for about 0.03 T, so a value near 0.1 T discards every event."}
      channels.log: {legacy: ~, default: false, units: ~, doc: "Event log: every committed event of the channel's threshold condition as one row of <channel>/events_<variable>[_<threshold tag>].dat (columns t_on t_off duration peak x y i j; peak = the sample furthest past the threshold, i j global 1-based cells, or the point index and 1 on a station/transect geometry), gathered and ordered by onset at every flush; the same filters (gap, min_duration) apply, so the row count equals the count statistic summed over cells. x y are model metres from cell (1,1), NOT georeferenced; peak keeps its sign (a magnitude threshold selects on |value|). A hot start appends behind a '# restart t_start=<t>' line and the end of every leg lists the events still open as '# open' rows (they are lost across the restart); rows over a per-rank cap of 1000000 per flush are dropped, counted and marked with a '# dropped' line at that flush, after which rows == count no longer holds (shorten the interval). A row is about 120 bytes, so a large breaking channel logging every flush can make this the largest output of the run: size it before enabling on a long many-rank case. On a netcdf channel the rows also land as CF point-feature groups <channel>_events_<variable> in diagnostics.nc."}
      channels.accumulate: {legacy: ~, default: window, units: ~, values: [window, running, total], doc: "Statistics accumulation: window resets at every interval; running accumulates since t_start and writes every interval; total accumulates since t_start and writes once at the end of the run (interval ignored). No overlapping windows: adjacent windows combine exactly in postprocessing."}
      channels.t_start: {legacy: ~, default: ~, units: s, doc: "Channel start time (default simulation t_start). Also accepts the sentinel `spinup`, which resolves to simulation.spinup -- so a campaign whose statistics windows all begin after spin-up states the offset once instead of restating it per channel per run."}
      channels.t_end: {legacy: ~, default: ~, units: s, doc: "Channel end time; absent = unbounded (writes to the end of the run). Bounds a high-cadence channel to part of a long record -- e.g. a 1/30 s field dump over the closing seconds while eta writes throughout -- without paying for the cadence over the whole run."}
      channels.format: {legacy: ~, default: ~, units: ~, values: [ascii, netcdf], doc: Point file format; default follows the deck format (netcdf/pnetcdf selects a netcdf group in diagnostics.nc, anything else ascii .dat files).}
      channels.precision: {legacy: ~, default: double, units: ~, values: [single, double], doc: "Field save precision: single halves binary/netcdf storage for high-cadence channels (ascii text unchanged; double = the model working precision). Every channel writes into result_folder/<name>/ with its own t.out frame index (frame, t, dt) and, for field channels, a grid.txt."}
