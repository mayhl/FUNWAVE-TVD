# FUNWAVE Variable and Parameter Registry
#
# variables: field arrays output to NetCDF/binary.
#   Required: name, legacy_name, long_name, standard_name, units, fill_value, latex
#   standard_name: empty string if no CF match exists.
#   funwave_name:  required when standard_name is ""; follows CF naming style
#                  (lowercase, underscores, physical description) so future CF
#                  migration is obvious. Omit when standard_name is non-empty.
#
# sections: hierarchical metadata catalog for config keys (legacy name, default,
#   units, latex, values, doc).  See the sections: header below.
#
# Neither html descriptions, latex, nor funwave_name are written to NetCDF variable attrs.
# funwave_name IS written as a global attr on simulation.nc for variable inventory.
# NetCDF variable attr allowlist: {long_name, standard_name, units, fill_value, grid_mapping}.

variables:

  # ── Primary prognostic fields ──────────────────────────────────────────────
  - name:           eta
    legacy_name:    ETA
    long_name:      "free surface elevation"
    standard_name:  "sea_surface_height_above_mean_sea_level"
    units:          "m"
    fill_value:     -9999.0
    latex:          "$\\eta$"

  - name:           u
    legacy_name:    U
    long_name:      "depth-averaged x-velocity"
    standard_name:  "eastward_sea_water_velocity"
    units:          "m s-1"
    fill_value:     -9999.0
    latex:          "$u$"

  - name:           v
    legacy_name:    V
    long_name:      "depth-averaged y-velocity"
    standard_name:  "northward_sea_water_velocity"
    units:          "m s-1"
    fill_value:     -9999.0
    latex:          "$v$"

  - name:           p
    legacy_name:    P
    long_name:      "x-component of depth-integrated volume flux"
    standard_name:  ""
    funwave_name:   "sea_water_x_volume_flux"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$P = Hu$"

  - name:           q
    legacy_name:    Q
    long_name:      "y-component of depth-integrated volume flux"
    standard_name:  ""
    funwave_name:   "sea_water_y_volume_flux"
    units:          "m2 s-1"
    fill_value:     -9999.0
    latex:          "$Q = Hv$"

  # ── Depth / bathymetry ─────────────────────────────────────────────────────
  - name:           depth
    legacy_name:    Depth
    long_name:      "still-water depth"
    standard_name:  "sea_floor_depth_below_mean_sea_level"
    units:          "m"
    fill_value:     -9999.0
    latex:          "$d$"

  - name:           h
    legacy_name:    H
    long_name:      "total water depth"
    standard_name:  "sea_floor_depth_below_sea_surface"
    units:          "m"
    fill_value:     -9999.0
    latex:          "$H = \\eta + d$"

  # ── Masks ──────────────────────────────────────────────────────────────────
  - name:           mask
    legacy_name:    MASK
    long_name:      "wet/dry mask (1=wet, 0=dry)"
    standard_name:  ""
    funwave_name:   "sea_water_wet_binary_mask"
    units:          "1"
    fill_value:     -9999.0
    latex:          "$m$"

  - name:           mask9
    legacy_name:    MASK9
    long_name:      "wet/dry mask on 3x3 stencil (1=wet, 0=dry)"
    standard_name:  ""
    funwave_name:   "sea_water_3x3_wet_binary_mask"
    units:          "1"
    fill_value:     -9999.0
    latex:          "$m_9$"

  # ── Diagnostics / envelope fields ─────────────────────────────────────────
  - name:           h_max
    legacy_name:    HeightMax
    long_name:      "maximum sea surface elevation above mean sea level"
    standard_name:  ""
    funwave_name:   "maximum_sea_surface_height_above_mean_sea_level"
    units:          "m"
    fill_value:     -9999.0
    latex:          "$\\eta_{\\max}$"

  - name:           h_min
    legacy_name:    HeightMin
    long_name:      "minimum sea surface elevation above mean sea level"
    standard_name:  ""
    funwave_name:   "minimum_sea_surface_height_above_mean_sea_level"
    units:          "m"
    fill_value:     -9999.0
    latex:          "$\\eta_{\\min}$"

  - name:           u_max
    legacy_name:    VelocityMax
    long_name:      "maximum depth-averaged sea water speed"
    standard_name:  ""
    funwave_name:   "maximum_depth_averaged_sea_water_speed"
    units:          "m s-1"
    fill_value:     -9999.0
    latex:          "$|\\mathbf{u}|_{\\max}$"

  - name:           arr_time
    legacy_name:    ARRTIME
    long_name:      "wave front arrival time"
    standard_name:  ""
    funwave_name:   "sea_water_wave_front_arrival_time"
    units:          "s"
    fill_value:     -9999.0
    latex:          "$t_{\\mathrm{arr}}$"


# ═══════════════════════════════════════════════════════════════════════════════
# sections — hierarchical metadata tree (registry v2)
# ═══════════════════════════════════════════════════════════════════════════════
#
# A DESCRIPTIVE catalog of every config key, mirroring the deck tree — NOT a schema
# code is generated from.  The code (the hand-written readers) is the source of
# truth for structure and validation; this tree only annotates it with the metadata
# the code does not carry (legacy name, default, units, latex, doc).  Two consumers:
#   * readability / de-dup — variant + per-face structure written once;
#   * docs + example-config generation per section and per variant.
# gen_registry.py still emits the DEF_ default constants (config_defaults.f90,
# unchanged) by walking this tree's `default`s.
#
# Per-key metadata (all descriptive):
#   legacy   mod_global.F name for the input.txt converter (~ if none)
#   default  registry default (feeds the DEF_ constant)
#   units    null (~) if dimensionless; else a CF unit string
#   latex    terminal/Doxygen label (~ if none)
#   values   documented value set for docs/examples (NOT validated here — the
#            reader validates; this is the option list the docs should show)
#   doc      one-line human description for generated docs
#
# Per-face sections (boundaries) use `per_face:` so a face's keys are written
# once and expanded across faces ({face}/{Face}/{F} templating + overrides).
# A key may carry a dotted deck sub-path (wavemaker spectrum.freq.peak); a
# `variant:` tag documents which discriminant value a key belongs to.

sections:

  # ── wavemaker (spectrum shape x discretization x source) ────────────────────
  wavemaker:
    doc: >-
      Wave generation: a spectrum (shape x discretization) feeding a Wei-Kirby
      internal source box or a boundary signal.  spectrum.type discriminates the
      shape; source:/limiter: presence enables the source box / eta limiter.
      Entry is a mapping or a 1-element sequence (multi-wavemaker pending).  Keys
      carry their deck sub-path; `variant:` tags which spectrum.type a shape key
      belongs to (untagged keys apply regardless, e.g. source/limiter).
    keys:
      name: { legacy: ~, default: ~, units: ~, doc: "Name (referenced by boundaries.<face>.forcing.wavemaker)." }
      spectrum.type:
        { legacy: WAVEMAKER, default: ~, units: ~, values: [regular, jonswap, tma, spectrum_2d, components], doc: "Spectrum shape discriminant." }
      spectrum.amplitude: { legacy: AMP_WK, default: 0.0, units: m, latex: "$a$", variant: [regular], doc: "Monochromatic wave amplitude." }
      spectrum.period: { legacy: Tperiod, default: 0.0, units: s, latex: "$T$", variant: [regular], doc: "Monochromatic wave period." }
      spectrum.direction: { legacy: Theta_WK, default: 0.0, units: deg, latex: "$\\theta$", variant: [regular], doc: "Monochromatic wave direction." }
      spectrum.hm0: { legacy: Hmo, default: 0.0, units: m, latex: "$H_{m0}$", variant: [jonswap, tma], doc: "Significant wave height (total eta)." }
      spectrum.gamma: { legacy: GammaTMA, default: 3.3, units: ~, latex: "$\\gamma$", variant: [jonswap, tma], doc: "Peak enhancement factor." }
      spectrum.freq.peak: { legacy: FreqPeak, default: 0.0, units: Hz, latex: "$f_p$", variant: [jonswap, tma], doc: "Peak frequency (exact legacy path)." }
      spectrum.freq.min: { legacy: FreqMin, default: 0.0, units: Hz, variant: [jonswap, tma], doc: "Minimum frequency." }
      spectrum.freq.max: { legacy: FreqMax, default: 0.0, units: Hz, variant: [jonswap, tma], doc: "Maximum frequency." }
      spectrum.period.peak: { legacy: ~, default: ~, units: s, latex: "$T_p$", variant: [jonswap, tma], doc: "Hand-authoring alt to freq.peak (reciprocal; mutually exclusive)." }
      spectrum.period.min: { legacy: ~, default: ~, units: s, variant: [jonswap, tma], doc: "Alt to freq.max (note the min<->max swap)." }
      spectrum.period.max: { legacy: ~, default: ~, units: s, variant: [jonswap, tma], doc: "Alt to freq.min." }
      spectrum.directional.peak: { legacy: ThetaPeak, default: 0.0, units: deg, variant: [jonswap, tma], doc: "Mean direction (presence => 2D spreading)." }
      spectrum.directional.spread: { legacy: Sigma_Theta, default: 0.0, units: deg, variant: [jonswap, tma], doc: "Directional spread (legacy 10.0 in directional branch; PENDING)." }
      spectrum.directional.n_bins: { legacy: Ntheta, default: 1, units: ~, variant: [jonswap, tma], doc: "Directional bin count (legacy 24 in directional branch; PENDING)." }
      spectrum.discretization.freq_bins: { legacy: Nfreq, default: 45, units: ~, variant: [jonswap, tma], doc: "Frequency bin count." }
      spectrum.discretization.equal_energy: { legacy: EqualEnergy, default: false, units: ~, variant: [jonswap, tma], doc: "Equal-energy frequency binning." }
      spectrum.discretization.method:
        { legacy: ~, default: grid, units: ~, values: [grid, single_dir_per_freq], variant: [jonswap, tma], doc: "Discretization method (single_dir_per_freq init-gated pending)." }
      spectrum.discretization.coherence_percent: { legacy: alpha_c, default: 0.0, units: "%", variant: [jonswap, tma], doc: "Percent of components sharing a frequency." }
      spectrum.file: { legacy: WaveCompFile, default: ~, units: ~, variant: [components, spectrum_2d], doc: "Wave-component / 2D-spectrum data file." }
      spectrum.n: { legacy: NumWaveComp, default: 1, units: ~, variant: [components], doc: "Number of wave components." }
      spectrum.period_peak: { legacy: PeakPeriod, default: 0.0, units: s, latex: "$T_p$", variant: [components], doc: "Peak period (components store a period here)." }
      spectrum.format: { legacy: WAVE_DATA_TYPE, default: DATA_1D, units: ~, variant: [spectrum_2d], doc: "2D-spectrum data format." }
      source.x_center: { legacy: Xc_WK, default: 0.0, units: m, latex: "$x_c$", doc: "Source-box x center (presence of source: => Wei-Kirby)." }
      source.y_center: { legacy: Yc_WK, default: 0.0, units: m, latex: "$y_c$", doc: "Source-box y center." }
      source.depth: { legacy: DEP_WK, default: 0.0, units: m, doc: "Source-box reference depth." }
      source.delta: { legacy: Delta_WK, default: 0.5, units: ~, latex: "$\\delta$", doc: "Source-box width parameter." }
      source.y_width: { legacy: Ywidth_WK, default: 999999.0, units: m, doc: "Source-box alongshore width (large = full span)." }
      source.time_ramp: { legacy: Time_ramp, default: 0.0, units: s, doc: "Source ramp-up time." }
      source.current_cd: { legacy: WaveMakerCd, default: ~, units: ~, doc: "Current-balance drag (presence enables; nee WaveMakerCurrentBalance)." }
      limiter.crest: { legacy: CrestLimit, default: ~, units: m, doc: "Crest elevation limit (presence => eta limiter)." }
      limiter.trough: { legacy: TroughLimit, default: ~, units: m, doc: "Trough elevation limit." }

  # ── boundaries (per-face de-dup) ───────────────────────────────────────────
  boundaries:
    doc: >-
      Per-face boundary conditions.  The reader DERIVES each face's BC from which
      blocks are present (nothing -> wall; sponge only -> wall + absorbing strip;
      sponge.direct + forcing -> relaxation to a signal; forcing without direct ->
      characteristic, pending).  type: is an optional assertion.
    keys:
      periodic:
        legacy: PERIODIC
        default: ~
        units: ~
        doc: "Axis-level periodic pair list (e.g. [y]); x pending trid_x_periodic."
      relaxation_cells:
        legacy: WaveMakerPointNum
        default: 30
        units: ~
        doc: "Width in cells of the forcing relaxation strip."
    per_face:
      faces: [west, east, south, north] # {face}=west  {Face}=West  {F}=W
      keys:
        type:
          legacy: ~
          default: ~
          units: ~
          doc: "Optional BC assertion; errors at init if it disagrees with the derived BC."
        sponge.width:
          legacy: "Sponge_{face}_width"
          default: 0.0
          units: "m"
          latex: "$W_{s,{F}}$"
          doc: "Absorbing sponge strip width (0 = no sponge)."
        sponge.direct.r:
          legacy: R_sponge
          default: 0.85
          units: ~
          latex: "$R_s$"
          doc: "Direct-sponge damping ratio."
        sponge.direct.a:
          legacy: A_sponge
          default: 5.0
          units: ~
          latex: "$A_s$"
          doc: "Direct-sponge damping exponent."
        sponge.friction.cd:
          legacy: CDsponge
          default: 0.0
          units: ~
          latex: "$C_{d,s}$"
          doc: "Sponge bottom-friction coefficient."
        sponge.diffusion.nu:
          legacy: Csp
          default: 0.1
          units: ~
          latex: "$C_{\\mathrm{sp}}$"
          doc: "Sponge diffusion coefficient."
        forcing.eta:
          legacy: "Tide{Face}_ETA"
          default: ~
          units: m
          doc: "Prescribed surface-elevation forcing (constant; file for a series)."
        forcing.u:
          legacy: "Tide{Face}_U"
          default: ~
          units: m/s
          doc: "Prescribed x-velocity forcing."
        forcing.v:
          legacy: "Tide{Face}_V"
          default: ~
          units: m/s
          doc: "Prescribed y-velocity forcing."
        forcing.file:
          legacy: "Tide{Face}FileName"
          default: ~
          units: ~
          doc: "Time-series forcing file (presence => DATA forcing)."
        forcing.wavemaker:
          legacy: ~
          default: ~
          units: ~
          doc: "Name of a spectrum-only wavemaker entry driving this face (nee ABS)."
        forcing.depth:
          legacy: ~
          default: ~
          units: "m"
          doc: "Reference depth for the wavemaker forcing series (nee DepthWaveMaker)."
      overrides:
        west.forcing.depth: { legacy: DepthWaveMaker } # legacy global; west-only

  # ── numerics (format pilot; no variants) ───────────────────────────────────
  numerics:
    doc: "Numerical scheme — CFL, Riemann solver, reconstruction, wet/dry floor."
    keys:
      cfl:
        legacy: CFL
        default: 0.5
        units: ~
        latex: "$C_{\\mathrm{CFL}}$"
        doc: "CFL number for the adaptive timestep."
      flux_solver:
        legacy: CONSTR
        default: hllc
        units: ~
        values: [hllc, hll]
        doc: "Approximate Riemann solver."
      froude_cap:
        legacy: FroudeCap
        default: 3.0
        units: ~
        latex: "$Fr_{\\mathrm{cap}}$"
        doc: "Maximum Froude number (velocity limiter)."
      min_depth:
        legacy: MinDepth
        default: 0.1
        units: "m"
        latex: "$d_{\\min}$"
        doc: "Single wet/dry + friction floor (legacy folded MinDepth/MinDepthFrc)."
      reconstruction:
        legacy: HIGH_ORDER
        default: fourth
        units: ~
        values: [fourth, fminmod, weno, mlp, basic]
        doc: "Spatial reconstruction scheme."

  # ── grid ──
  grid:
    doc: "Computational grid — extent, spacing, bathymetry source, MPI decomposition, optional Coriolis."
    keys:
      coriolis.f: {legacy: ~, default: ~, units: s-1, latex: $f$, doc: Constant Coriolis parameter (f-plane; overrides latitude).}
      coriolis.latitude: {legacy: ~, default: ~, units: degrees_north, latex: $\varphi$, doc: Reference latitude for the f-plane Coriolis parameter.}
      bathy_correction: {legacy: BATHY_CORRECTION, default: false, units: ~, doc: Apply the bathymetry smoothing/correction pass.}
      bathy_depth: {legacy: Depth_Flat, default: ~, units: m, latex: $d_0$, doc: Still-water depth for a flat bottom.}
      bathy_file: {legacy: DEPTH_FILE, default: ~, units: ~, doc: Bathymetry data file.}
      bathy_slope: {legacy: SLP, default: ~, units: ~, latex: $s$, doc: Bed slope for a sloping-beach bathymetry.}
      bathy_slope_x0: {legacy: Xslp, default: ~, units: m, latex: '$x_{s0}$', doc: x location where the slope begins.}
      bathy_type: {legacy: DEPTH_TYPE, default: flat, units: ~, values: [flat, slope, data], doc: Bathymetry generator.}
      dx: {legacy: DX, default: ~, units: m, latex: $\Delta x$, doc: Grid spacing in x.}
      dy: {legacy: DY, default: ~, units: m, latex: $\Delta y$, doc: Grid spacing in y.}
      grid_nx: {legacy: Mglob, default: ~, units: ~, latex: $N_x$, doc: Number of grid cells in x (global).}
      grid_ny: {legacy: Nglob, default: ~, units: ~, latex: $N_y$, doc: Number of grid cells in y (global).}
      nx_proc: {legacy: px, default: ~, units: ~, latex: $P_x$, doc: MPI process count in x (absent = auto-decompose).}
      ny_proc: {legacy: py, default: ~, units: ~, latex: $P_y$, doc: MPI process count in y (absent = auto-decompose).}

  # ── simulation ──
  simulation:
    doc: "Run control — title, total/start time, screen-log cadence, and time-stepping."
    keys:
      screen_interval: {legacy: SCREEN_INTV, default: 1.0, units: s, latex: '$\Delta t_{\mathrm{screen}}$', doc: Screen-log / monitor cadence.}
      t_start: {legacy: PLOT_START_TIME, default: 0.0, units: s, latex: $t_0$, doc: Simulation time at which output begins.}
      title: {legacy: TITLE, default: ~, units: ~, doc: Run title (reserved for NetCDF global attrs).}
      total_time: {legacy: TOTAL_TIME, default: ~, units: s, latex: $T$, doc: Total simulated duration.}
      time_stepping.dt: {legacy: DT_fixed, default: ~, units: s, latex: $\Delta t$, doc: Fixed timestep value (with fixed_dt).}
      time_stepping.fixed_dt: {legacy: FIXED_DT, default: false, units: ~, doc: Use a fixed timestep instead of adaptive CFL.}

  # ── initial ──
  initial:
    doc: "Initial condition — block presence selects the type (solitary/sine_mode/hump/n_wave) + still-water level."
    keys:
      water_level: {legacy: WaterLevel, default: 0.0, units: m, latex: $\eta_0$, doc: Uniform still-water level offset (non-zero init-gated pending).}
      hump.amplitude: {legacy: AMP_SOLI, default: ~, units: m, doc: Hump amplitude.}
      hump.radius: {legacy: GauRadius, default: ~, units: m, doc: Gaussian hump radius.}
      hump.shape: {legacy: ~, default: ~, units: ~, values: [rect, gaussian, dipole], doc: Hump shape.}
      hump.width: {legacy: WID, default: ~, units: m, doc: Hump width.}
      hump.x_center: {legacy: Xc, default: ~, units: m, doc: Hump center x.}
      hump.y_center: {legacy: Yc, default: ~, units: m, doc: Hump center y.}
      n_wave.a0: {legacy: a0_Nwave, default: ~, units: m, doc: N-wave amplitude.}
      n_wave.depth: {legacy: dep_Nwave, default: ~, units: m, doc: N-wave still-water depth.}
      n_wave.gamma: {legacy: gamma_Nwave, default: ~, units: ~, doc: N-wave shape parameter.}
      n_wave.x1: {legacy: x1_Nwave, default: ~, units: m, doc: N-wave leading position.}
      n_wave.x2: {legacy: x2_Nwave, default: ~, units: m, doc: N-wave trailing position.}
      sine_mode.amplitude: {legacy: AMP_SOLI, default: 0.0, units: m, latex: $a$, doc: Standing sine-mode amplitude.}
      sine_mode.depth: {legacy: DEP_SOLI, default: 0.0, units: m, latex: $d$, doc: Sine-mode still-water depth.}
      sine_mode.mode_x: {legacy: MODE_X, default: 1, units: ~, doc: Sine mode number in x.}
      sine_mode.mode_y: {legacy: MODE_Y, default: 0, units: ~, doc: Sine mode number in y.}
      solitary.amplitude: {legacy: AMP_SOLI, default: 0.0, units: m, latex: $a$, doc: Solitary-wave amplitude.}
      solitary.depth: {legacy: DEP_SOLI, default: 0.0, units: m, latex: $d$, doc: Solitary-wave still-water depth.}
      solitary.direction: {legacy: SolitaryPositiveDirection, default: +x, units: ~, values: [+x, -x, +y, -y], doc: Solitary-wave propagation direction.}
      solitary.x_center: {legacy: XWAVEMAKER, default: 0.0, units: m, doc: Solitary-wave initial crest x.}

  # ── physics ──
  physics:
    doc: "Physics — Boussinesq dispersion scheme (Gamma presets + overrides) and the SWE transition depth."
    keys:
      dispersion.beta_ref: {legacy: Beta_ref, default: -0.531, units: ~, latex: '$\beta_{\mathrm{ref}}$', doc: Reference depth level for the Boussinesq operator.}
      dispersion.gamma1: {legacy: gamma1, default: ~, units: ~, latex: $\Gamma_1$, doc: Dispersion coefficient Gamma1 (overrides the scheme preset).}
      dispersion.gamma2: {legacy: gamma2, default: ~, units: ~, latex: $\Gamma_2$, doc: Dispersion coefficient Gamma2 (overrides the scheme preset).}
      dispersion.gamma3: {legacy: gamma3, default: ~, units: ~, latex: $\Gamma_3$, doc: Dispersion coefficient Gamma3 (overrides the scheme preset).}
      dispersion.scheme: {legacy: DISPERSION, default: fully_nonlinear, units: ~, values: [fully_nonlinear, weakly_nonlinear, linear, nswe], doc: Dispersion preset for Gamma1/2/3.}
      dispersion.swe_eta_dep: {legacy: SWE_ETA_DEP, default: 0.8, units: ~, latex: '$\eta_{\mathrm{SWE}}$', doc: eta/depth ratio above which cells switch to shallow-water equations.}

  # ── breaking ──
  breaking:
    doc: "Wave breaking — dissipation model, roller, and wavemaker-region overrides (core physics, not presence-gated)."
    keys:
      cbrk1: {legacy: Cbrk1, default: 0.65, units: ~, latex: '$C_{\mathrm{brk1}}$', doc: Breaking onset threshold coefficient.}
      cbrk2: {legacy: Cbrk2, default: 0.35, units: ~, latex: '$C_{\mathrm{brk2}}$', doc: Breaking cessation threshold coefficient.}
      nu_bkg: {legacy: nu_bkg, default: 0.0, units: m2 s-1, latex: '$\nu_{\mathrm{bkg}}$', doc: Background eddy viscosity added everywhere.}
      roller: {legacy: ROLLER, default: false, units: ~, doc: Enable surface-roller momentum flux.}
      show_breaking: {legacy: SHOW_BREAKING, default: true, units: ~, doc: Output the breaking-index field.}
      model: {legacy: VISCOSITY_BREAKING, default: eddy_viscosity, units: ~, values: [eddy_viscosity, shock_capturing], doc: Breaking dissipation model.}
      visbrk: {legacy: visbrk, default: 0.0, units: m2 s-1, latex: '$\nu_{\mathrm{brk}}$', doc: Breaking eddy-viscosity coefficient.}
      wavemaker_cbrk: {legacy: WAVEMAKER_Cbrk, default: 1.0, units: ~, latex: '$C_{\mathrm{brk,wm}}$', doc: Breaking threshold scale inside the wavemaker region.}
      wavemaker_vis: {legacy: WAVEMAKER_VIS, default: false, units: ~, doc: Enable extra viscosity in the wavemaker region.}
      wavemaker_visbrk: {legacy: WAVEMAKER_visbrk, default: 0.0, units: m2 s-1, latex: '$\nu_{\mathrm{brk,wm}}$', doc: Breaking viscosity coefficient in the wavemaker region.}
      roller_effect: {legacy: ROLLER_EFFECT, default: false, units: ~, doc: Apply the roller effect to the momentum equations.}

  # ── friction ──
  friction:
    doc: "Bottom friction — exactly one of cd, manning (n), or file; section absent = zero drag."
    keys:
      cd: {legacy: Cd, default: ~, units: ~, latex: $C_d$, doc: Constant quadratic bottom-drag coefficient.}
      manning: {legacy: ~, default: ~, units: 's m^{-1/3}', latex: $n$, doc: Manning roughness n (converted to Cd per cell).}
      file: {legacy: CD_FILE, default: ~, units: ~, doc: Spatially varying Cd map file (init-gated pending).}

  # ── obstacle ──
  obstacle:
    doc: "Interior obstacles — obstacle mask file and breakwater absorbing block."
    keys:
      file: {legacy: OBSTACLE_FILE, default: ~, units: ~, doc: Obstacle mask file (presence enables interior walls).}
      breakwater.file: {legacy: BREAKWATER_FILE, default: ~, units: ~, doc: Breakwater location file.}
      breakwater.absorb_coef: {legacy: BreakWaterAbsorbCoef, default: 10.0, units: ~, latex: '$C_{\mathrm{bw}}$', doc: Breakwater absorption coefficient.}

  # ── meteo ──
  meteo:
    doc: "Atmospheric forcing — presence-derived sub-models (gaussian/wind/holland/slide)."
    keys:
      gaussian.file: {legacy: METEO_GAUSIAN_FILE, default: ~, units: ~, doc: Gaussian pressure-disturbance file (presence enables; forces pressure coupling).}
      wind.file: {legacy: CONSTANT_WIND_FILE, default: ~, units: ~, doc: Constant wind-field file (presence enables wind stress).}
      wind.cd: {legacy: Cdw, default: 0.002, units: ~, latex: '$C_{dw}$', doc: Wind drag coefficient.}
      wind.wave_interaction: {legacy: WindWaveInteraction, default: false, units: ~, doc: Modulate wind stress by the wave field.}
      wind.crest_percent: {legacy: WindCrestPercent, default: ~, units: ~, doc: Fraction of crest exposed to wind (requires wave_interaction).}
      holland.file: {legacy: STORM_FILE, default: ~, units: ~, doc: Holland-model storm-track file.}
      holland.air_pressure: {legacy: AirPressure, default: false, units: ~, doc: Apply the storm pressure coupling.}
      holland.wind_force: {legacy: WindForce, default: false, units: ~, doc: Apply the storm wind-stress coupling.}
      holland.cd: {legacy: ~, default: 0.002, units: ~, latex: '$C_{dw}$', doc: Wind drag coefficient (Holland).}
      holland.wave_interaction: {legacy: ~, default: false, units: ~, doc: Modulate storm wind stress by the wave field.}
      holland.crest_percent: {legacy: ~, default: ~, units: ~, doc: Fraction of crest exposed to wind (requires wave_interaction).}
      slide.file: {legacy: SLIDE_FILE, default: ~, units: ~, doc: Submarine-landslide forcing file (presence enables; forces pressure coupling).}

  # ── subgrid ──
  subgrid:
    doc: "Subgrid porosity (urban flooding) — depth file, ratio, porosity output."
    keys:
      depth_file: {legacy: DEPTH_SUBGRID_FILE, default: ~, units: ~, doc: High-resolution subgrid bathymetry file.}
      write_porosity: {legacy: Porosity, default: false, units: ~, doc: Output the computed porosity field.}
      ratio: {legacy: SubMainGridRatio, default: 1, units: ~, doc: Subgrid-to-main-grid refinement ratio.}

  # ── foam ──
  foam:
    doc: "Foam / bubble model — production and decay parameters."
    keys:
      source_coef: {legacy: f_source, default: 0.05, units: ~, latex: '$f_{\mathrm{source}}$', doc: Foam production coefficient.}
      time_scale: {legacy: FoamTimeScale, default: 3.8, units: s, latex: $\tau_f$, doc: Foam decay time scale.}
      burst_time_non_breaking: {legacy: BurstTimeNonBreaking, default: 1.0, units: s, doc: Foam burst time in non-breaking regions.}
      min_thickness: {legacy: MinThick, default: 0.01, units: m, doc: Minimum foam-layer thickness tracked.}
      cd: {legacy: CdFoam, default: 0.5, units: ~, latex: '$C_{d,f}$', doc: Foam-layer drag coefficient.}

  # ── precipitation ──
  precipitation:
    doc: "Precipitation — rainfall forcing file."
    keys:
      file: {legacy: RAINFALL_FILE, default: ~, units: ~, doc: Rainfall forcing file.}

  # ── tracer ──
  tracer:
    doc: "Passive tracers — the tracker table lives in the tracer file."
    keys:
      file: {legacy: TRACER_FILE, default: ~, units: ~, doc: 'Tracer table file (count, cadence, one row per tracker).'}

  # ── vessel ──
  vessel:
    doc: "Moving vessels — per-hull files in a folder; propeller and deep-draft options."
    keys:
      folder: {legacy: VESSEL_FOLDER, default: ~, units: ~, doc: Directory of per-hull vessel_NNNNN files.}
      count: {legacy: NumVessel, default: 1, units: ~, doc: Number of vessels.}
      propeller: {legacy: PROPELLER, default: false, units: ~, doc: Enable propeller jets (must match the build's -DPROPELLER).}
      deep_draft.clearance: {legacy: CLEARANCE, default: ~, units: m, doc: Keel clearance above the bed (required for deep_draft).}
      deep_draft.mask: {legacy: MaskMethod, default: true, units: ~, doc: Mask cells fully blocked by the hull.}
      deep_draft.cd: {legacy: CdDeepDraft, default: ~, units: ~, latex: '$C_{d,v}$', doc: Hull drag coefficient (presence enables hull drag).}
      deep_draft.nu: {legacy: VisDeepDraft, default: ~, units: m^2/s, doc: Hull eddy viscosity (presence enables).}

  # ── sediment ──
  sediment:
    doc: "Sediment — single grain size, morphology, avalanching, cohesive, and flow-feedback sub-blocks."
    keys:
      scheme: {legacy: Sed_Scheme, default: upwinding, units: ~, values: [upwinding, tvd], doc: Advection scheme for suspended load.}
      d50: {legacy: D50, default: ~, units: m, latex: '$D_{50}$', doc: 'Median grain diameter (absent: 0.5 mm sand / 5 nm mud by cohesive).'}
      specific_gravity: {legacy: Sdensity, default: 2.68, units: ~, latex: $s$, doc: Sediment specific gravity.}
      porosity: {legacy: n_porosity, default: 0.47, units: ~, latex: $n$, doc: Bed porosity.}
      settling_velocity: {legacy: WS, default: ~, units: m/s, latex: $w_s$, doc: Settling velocity (absent = computed from grain size).}
      shields_cr: {legacy: Shields_cr, default: 0.055, units: ~, latex: '$\theta_{cr}$', doc: Critical Shields parameter for suspension.}
      min_depth_pickup: {legacy: MinDepthPickup, default: 0.1, units: m, doc: Minimum water depth for pickup.}
      pickup_reduction: {legacy: PickupReduction, default: true, units: ~, doc: Reduce pickup on steep slopes.}
      reduction_parameter: {legacy: ReductionParameter, default: 0.65, units: ~, doc: Slope pickup-reduction coefficient (requires pickup_reduction).}
      c_limiter: {legacy: C_limiter, default: ~, units: ~, doc: Suspended-concentration limiter (presence enables).}
      morph_interval: {legacy: Morph_interval, default: ~, units: s, doc: Morphology update interval.}
      bed_change: {legacy: Bed_Change, default: false, units: ~, doc: Enable bed-level change (morphodynamics).}
      bedload: {legacy: BedLoad, default: false, units: ~, doc: Include bed-load transport.}
      shields_cr_bedload: {legacy: Shields_cr_bedload, default: ~, units: ~, latex: '$\theta_{cr,b}$', doc: Critical Shields for bed load (absent = shields_cr).}
      morph_factor: {legacy: Morph_factor, default: 1, units: ~, doc: Morphological acceleration factor.}
      hard_bottom.file: {legacy: Mask_s_File, default: ~, units: ~, doc: Non-erodible hard-bottom mask file (required).}
      avalanche.tan_phi: {legacy: tan_phi, default: ~, units: ~, latex: $\tan\phi$, doc: Tangent of the repose angle (required for avalanche).}
      avalanche.interval: {legacy: Aval_interval, default: ~, units: s, doc: Avalanche relaxation interval (absent = every step).}
      cohesive.soft_bed: {legacy: SoftBed, default: true, units: ~, doc: Track a consolidating soft-bed layer.}
      cohesive.tau_cr: {legacy: Tau_cr_coh, default: ~, units: m2/s2, latex: '$\tau_{cr}$', doc: Critical erosion shear stress (required for cohesive).}
      cohesive.tau_crd: {legacy: Tau_crd_coh, default: 0.001, units: m2/s2, latex: '$\tau_{cr,d}$', doc: Critical deposition shear stress.}
      cohesive.e: {legacy: E_coh, default: 0.0001, units: m/s, latex: $E$, doc: Erosion-rate coefficient.}
      cohesive.alpha: {legacy: alpha_coh, default: 1.0, units: ~, latex: $\alpha$, doc: Consolidation coefficient.}
      cohesive.a: {legacy: a_coh, default: 0.1, units: ~, latex: $a$, doc: Soft-bed density parameter a.}
      cohesive.b: {legacy: b_coh, default: 2.0, units: ~, latex: $b$, doc: Soft-bed density parameter b.}
      cohesive.n: {legacy: n_coh, default: 0.5, units: ~, latex: $n$, doc: Soft-bed exponent n.}
      cohesive.m: {legacy: m_coh, default: 1.5, units: ~, latex: $m$, doc: Soft-bed exponent m.}
      feedback.mass_source: {legacy: SedimentMassSource, default: false, units: ~, doc: Feed erosion/deposition mass back into continuity.}
      feedback.moment_dc: {legacy: SedimentMomentDC, default: false, units: ~, doc: Feed the density-current momentum term back.}
      feedback.moment_exg: {legacy: SedimentMomentEXG, default: false, units: ~, doc: Feed the sediment-exchange momentum term back.}

  # ── coupling ──
  coupling:
    doc: "External-model coupling — coupling data file."
    keys:
      file: {legacy: COUPLING_FILE, default: ~, units: ~, doc: Nesting/coupling boundary data file.}

  # ── hot_start ──
  hot_start:
    doc: "Hot-start (restart) — binary checkpoint set OR ASCII field files, restart time, output numbering."
    keys:
      checkpoint: {legacy: ~, default: ~, units: ~, doc: Restart from a binary checkpoint directory (holds core.bin; supersedes the ASCII field/time keys).}
      bed_deformation: {legacy: BED_DEFORMATION, default: false, units: ~, doc: Apply bed deformation on restart.}
      eta_file: {legacy: ETA_FILE, default: ~, units: ~, doc: Surface-elevation restart field file.}
      mask_file: {legacy: MASK_FILE, default: ~, units: ~, doc: Wet/dry mask restart field file.}
      output_start_number: {legacy: FileNumber_HOTSTART, default: 0, units: ~, doc: First output frame number after restart.}
      time: {legacy: HotStartTime, default: 0.0, units: s, latex: '$t_{\mathrm{hs}}$', doc: Simulation time at the restart instant.}
      u_file: {legacy: U_FILE, default: ~, units: ~, doc: x-velocity restart field file.}
      v_file: {legacy: V_FILE, default: ~, units: ~, doc: y-velocity restart field file.}

  # ── output ──
  output:
    doc: "Output control — cadence, format, folder, plus stations/means/vessel/arrival-time sub-blocks."
    keys:
      arrival_time.min_height: {legacy: ArrTimeMin, default: 0.001, units: m, latex: '$H_{\mathrm{arr}}$', doc: Elevation threshold defining first wave arrival.}
      checkpoint: {legacy: ~, default: ~, units: ~, doc: Directory to write the hot-start checkpoint set (core.bin) at run end.}
      depth_out: {legacy: OUT_DEPTH, default: false, units: ~, doc: Write the still-water depth field.}
      field_io_type: {legacy: FIELD_IO_TYPE, default: ASCII, units: ~, values: [ASCII, BINARY], doc: Field output format.}
      output_res: {legacy: OUTPUT_RES, default: 1, units: ~, doc: Output spatial subsampling stride.}
      result_folder: {legacy: RESULT_FOLDER, default: ./output/, units: ~, doc: Directory for output files.}
      stations.file: {legacy: STATIONS_FILE, default: ~, units: ~, doc: Gauge-station coordinate file (presence enables station output).}
      means.steady_time: {legacy: STEADY_TIME, default: 0.0, units: s, latex: '$T_{\mathrm{steady}}$', doc: Time to begin time-averaging.}
      means.interval: {legacy: T_INTV_mean, default: ~, units: s, latex: '$T_{\mathrm{mean}}$', doc: Averaging output cadence.}
      interval: {legacy: PLOT_INTV, default: ~, units: s, latex: '$\Delta t_{\mathrm{out}}$', doc: Global field-output cadence.}
      blowup_threshold: {legacy: EtaBlowVal, default: ~, units: m, doc: Elevation above which the run aborts (absent = 100*max|Depth|).}
      stations.interval: {legacy: PLOT_INTV_STATION, default: 1.0, units: s, doc: Station-output cadence.}
      stations.buffer: {legacy: StationOutputBuffer, default: 1000, units: ~, doc: Station time-series buffer length (rows).}
      vessel.interval: {legacy: PLOT_INTV_VESSEL, default: ~, units: s, doc: Vessel resistance-series output cadence.}
